<!--
  ============================================================
  一次性原型（throwaway prototype），2026-10-03
  用途：演示"个人报告"并入成绩中心现有结构的方案——不设新页签：
  · 成绩明细（学生×题目矩阵）在学生姓名后加个人报告状态图标，
    筛选区新增"报告未生成或需重新生成"片；
  · 点学生姓名打开右侧学生抽屉：总分/较上场/意外失分/逐题得分，
    抽屉顶部为"个人报告"入口（按本场状态显示不同文案与按钮）；
  · "查看个人报告"打开全屏阅读器（上一位/下一位沿当前筛选顺序，
    Esc 返回抽屉），复用每场 AI 个人报告版式与图表；
  · 顶部"导出"为下拉菜单：成绩表/批注原卷为静态行，"学生个人分析
    报告"行内可生成（模拟确认+进度）或打开导出对话框
    （方式 A：学生范围×考试×格式，实时汇总与文件名预览）。
  不调用模型、不产生费用、不连接真实接口；全部为种子固定的合成数据。
  "原型控制"角标可切换报告状态（已生成/需重新生成/未生成/缺考/原卷已释放）。
  尚未实现到正式应用的内容：真实数据接入与报告存储/幂等、生成任务与
  任务中心对接、导出打包（ZIP/PDF）、打印样式、原卷图片在线读取、
  学生间切换的权限与分页、拼音检索。
  ============================================================
-->

<!-- 原型控制：默认收起为角标，点击展开 -->
<div id="protoCtl">
  <div id="pcBody">
    <div class="pc-t">原型控制 · 仅演示，不影响数据</div>
    <label>报告视图状态
      <select id="ctlRstate">
        <option value="real">按数据（各生状态）</option>
        <option value="done">强制：已生成</option>
        <option value="stale">强制：需重新生成</option>
        <option value="none">强制：未生成</option>
        <option value="absent">强制：缺考</option>
        <option value="released">强制：原卷已释放</option>
      </select>
    </label>
    <div class="pc-n">强制状态作用于阅读器当前查看的那一场；<br>"原卷已释放"把作答图换成占位说明。<br>其他页签与侧栏为死链。</div>
  </div>
  <button id="pcToggle" type="button">原型控制</button>
