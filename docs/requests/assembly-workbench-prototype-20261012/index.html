<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>组卷工作台改版原型 · 静态演示（数据为虚构）</title>
<link rel="stylesheet" href="./proto.css?v=20261012c">
<link rel="stylesheet" href="./views.css?v=20261012d">
<link rel="stylesheet" href="./paper.css?v=20261012c">
<link rel="stylesheet" href="./export.css?v=20261012c">
<link rel="stylesheet" href="./basket.css?v=20261012c">
</head>
<body>

<!-- 原型控制条：不属于被实现的设计 -->
<header class="chrome">
  <div class="chrome__row">
    <span class="chrome__title">组卷工作台改版原型 <em>数据为虚构</em></span>
    <nav class="chrome__views" role="group" aria-label="原型视图">
      <button type="button" data-view="class">班级组卷</button>
      <button type="button" data-view="preview">整卷预览（新页面）</button>
      <button type="button" data-view="export">整理与导出</button>
      <button type="button" data-view="bank">题库管理（示意）</button>
    </nav>
    <button type="button" id="sim-refresh" class="chrome__sim-btn">模拟后台重算</button>
  </div>
  <div class="chrome__row">
    <p class="chrome__desc">右栏「这张卷」已并入试卷篮抽屉（右缘开关、页头「试卷篮 · N」或 B 键打开，推开页面约 1/3 屏），抽屉复用整卷预览的卷面与题号轨道，出卷设置移到「整理与导出」；题库管理（示意）共用同一抽屉。</p>
  </div>
</header>

<!-- 假应用外壳 -->
<div class="app">
  <aside class="sbar" aria-label="应用导航">
    <a class="sbar__brand" href="javascript:void(0)">
      <span class="sbar__brand-mark" aria-hidden="true">阅</span>
      <span class="sbar__brand-copy"><strong>阅知</strong><small>阅卷与教学</small></span>
    </a>
    <div class="sbar__exam" role="button" tabindex="0">
      <span class="sbar__exam-row"><span class="sbar__exam-label">当前考试</span><span class="sbar__exam-status">已批改</span></span>
      <span class="sbar__exam-name">第四周学情反馈</span>
      <span class="sbar__exam-meta">八年级 9、10 班 · 91 份答卷</span>
    </div>
    <nav class="sbar__nav" id="sbar-nav" aria-label="主要导航"></nav>
    <div class="sbar__bottom"><nav id="sbar-settings" aria-label="设置导航"></nav></div>
  </aside>

  <div class="main">
    <main class="main__scroll" id="page-root"></main>
    <!-- 试卷篮右缘开关（抽屉关闭时显示，仅班级组卷 / 题库管理） -->
    <button type="button" id="basket-tab" class="basket-tab" onclick="PROTO.toggleBasket()" title="打开试卷篮（B）" hidden>
      <svg viewBox="0 0 18 18" width="16" height="16" aria-hidden="true"><path d="M3 7h12l-1.1 5.6A1.6 1.6 0 0 1 12.3 14H5.7a1.6 1.6 0 0 1-1.6-1.4L3 7Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M6 7 9 3.5 12 7" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <b>0</b><small></small>
    </button>
  </div>
  <!-- 试卷篮抽屉：推开式第三列 -->
  <aside class="basket" id="basket-root" aria-label="试卷篮" aria-hidden="true"></aside>
</div>

<!-- 视图切换胶囊（仅「整理与导出」显示） -->
<div id="variant-switcher" class="vsw" hidden>
  <button type="button" id="vsw-prev" aria-label="上一个方案">←</button>
  <span id="vsw-label">方案 A · 在卷面上直接排</span>
  <button type="button" id="vsw-next" aria-label="下一个方案">→</button>
</div>

<!-- 原型状态面板 -->
<details id="proto-state" class="pstate">
  <summary>原型状态</summary>
  <div class="pstate__body"><pre id="pstate-pre"></pre></div>
</details>

<div id="toast-root" aria-live="polite"></div>

<script src="./data-questions.js?v=20261012c"></script>
<script src="./data-questions2.js?v=20261012c"></script>
<script src="./data-needs.js?v=20261012d"></script>
<script src="./state.js?v=20261012d"></script>
<script src="./shell.js?v=20261012c"></script>
<script src="./view-paper.js?v=20261012c"></script>
<script src="./view-needs.js?v=20261012d"></script>
<script src="./view-match.js?v=20261012c"></script>
<script src="./view-papercol.js?v=20261012c"></script>
<script src="./view-bank.js?v=20261012c"></script>
<script src="./view-class.js?v=20261012d"></script>
<script src="./view-preview.js?v=20261012c"></script>
<script src="./view-export.js?v=20261012c"></script>
<script src="./app.js?v=20261012c"></script>
</body>
</html>
