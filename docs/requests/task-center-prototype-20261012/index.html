<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>任务中心原型（已选方案）· 静态演示</title>
<link rel="stylesheet" href="./proto.css?v=20261012c">
<link rel="stylesheet" href="./variants.css?v=20261012c">
</head>
<body>

<!-- 原型控制条：不属于被实现的设计，刻意做成醒目配色以便区分 -->
<header class="chrome">
  <div class="chrome__row">
    <span class="chrome__title">任务中心原型（已选方案）静态演示 <em>数据为虚构</em></span>
    <div class="chrome__sim" role="group" aria-label="模拟任务">
      <span class="chrome__sim-label">模拟</span>
      <button type="button" data-sim="paper-analysis">试卷分析</button>
      <button type="button" data-sim="grading">答卷批改</button>
      <button type="button" data-sim="tagging">题目标签</button>
      <button type="button" data-sim="ai-summary">AI 整理</button>
      <button type="button" data-sim="ai-summary" data-fail="1">模拟失败</button>
      <button type="button" data-sim="export-book">导出错题本</button>
      <button type="button" id="speed-toggle" class="chrome__speed">速度 1×</button>
      <button type="button" id="sim-clear" class="chrome__clear">清空模拟</button>
    </div>
  </div>
  <div class="chrome__row">
    <p class="chrome__desc">右下角环钮胶囊，点击弹出任务面板，按「进行中 / 需要处理 / 已结束」分组；任务完成时弹出自动收起的通知卡片。</p>
  </div>
</header>

<!-- 假应用外壳 -->
<div class="app">
  <aside class="sbar" aria-label="应用导航">
    <a class="sbar__brand" href="javascript:void(0)">
      <span class="sbar__brand-mark" aria-hidden="true">阅</span>
      <span class="sbar__brand-copy"><strong>阅知</strong><small>阅卷与教学</small></span>
    </a>
    <div class="sbar__exam" role="button" tabindex="0" aria-label="当前考试">
      <span class="sbar__exam-row"><span class="sbar__exam-label">当前考试</span><span class="sbar__exam-status">进行中</span></span>
      <span class="sbar__exam-name">八年级上学期期中数学</span>
      <span class="sbar__exam-meta">初二 3 班 · 48 份答卷</span>
    </div>
    <nav class="sbar__nav" id="sbar-nav" aria-label="主要导航"></nav>
    <div class="sbar__bottom">
      <nav id="sbar-settings" aria-label="设置导航"></nav>
    </div>
  </aside>

  <div class="main">
    <main class="main__scroll" id="page-root"></main>
  </div>
</div>

<!-- 任务中心挂载点 -->
<div id="variant-root"></div>
<div id="cards-root" class="cards" aria-live="polite" aria-label="任务完成通知"></div>
<div id="dialog-root"></div>
<div id="toast-root" aria-live="polite"></div>

<script src="./data.js?v=20261012c"></script>
<script src="./engine.js?v=20261012c"></script>
<script src="./shared-ui.js?v=20261012c"></script>
<script src="./task-center.js?v=20261012c"></script>
<script src="./shell.js?v=20261012c"></script>
<script src="./app.js?v=20261012c"></script>
</body>
</html>
