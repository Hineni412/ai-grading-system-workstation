<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>组卷工作台 · 班级组卷原型（演示 · 合成数据）</title>
<!--
  ============================================================
  一次性原型（throwaway prototype），2026-10-02；
  用途：组卷工作台“班级组卷”重新设计讨论（第二版：多班合并、考试全选、可改出卷设置、讲义/训练卷用途与训练流程衔接）；
  实施说明见同目录 class-assembly-implementation-plan-20261002.md；
  全部为合成数据，不连接真实接口、不调用模型、不产生费用；
  尚未实现到正式应用。
  ============================================================
-->
<style>
:root{
  --bg:#faf9f6; --surface:#ffffff; --subtle:#f3f3ef; --sel:#e9ede9;
  --bd:#dfe4e1; --bd2:#e9ede9; --bd3:#d1d9d5;
  --ink:#202a30; --ink2:#59656b; --ink3:#657176;
  --ac:#176b75; --ac-h:#145f68; --ac-soft:rgba(23,107,117,.08);
  --ok:#2f7d5c; --ok-soft:rgba(47,125,92,.1);
  --warn:#7c5a24; --warn-soft:rgba(184,135,58,.12);
  --danger:#b3402a; --danger-soft:rgba(179,64,42,.08);
  --info:#496579; --info-soft:#edf3f7;
  --r-tag:5px; --r-ctl:8px; --r-panel:12px;
  --sh1:0 1px 2px rgba(32,42,48,.025);
  --sh2:0 4px 12px rgba(28,39,51,.06);
  --sh3:0 10px 28px rgba(28,39,51,.14);
  --font:"Microsoft YaHei","PingFang SC",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid rgba(23,107,117,.45);outline-offset:1px}
h1,h2,h3,p{margin:0}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#cfd6d2;border-radius:6px;border:2px solid transparent;background-clip:content-box}::-webkit-scrollbar-track{background:transparent}

.app{display:grid;grid-template-columns:180px minmax(0,1fr);height:100vh}

/* ===== 侧栏 ===== */
.side{position:relative;display:flex;flex-direction:column;gap:0;padding:16px 12px 14px;color:#a7bfc2;
  background:linear-gradient(180deg,#0e1c20 0%,#10262b 70%,#0e2026 100%);border-right:1px solid rgba(255,255,255,.08);overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 14px}
.brand .mark{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px;background:linear-gradient(135deg,#2fb9c6,#136e7c);flex:none}
.brand b{display:block;color:#e4eff0;font-size:15px;font-weight:600;letter-spacing:.02em}
.brand span{display:block;font-size:10.5px;color:#82a4aa;margin-top:1px}
.navgrp{margin-bottom:12px}
.navgrp .gl{font-size:10.5px;color:#82a4aa;letter-spacing:.08em;padding:0 8px 5px}
.navgrp a{position:relative;display:flex;align-items:center;gap:8px;height:32px;padding:0 10px 0 12px;border-radius:8px;font-size:13px;color:#a7bfc2;text-decoration:none}
.navgrp a:hover{background:rgba(255,255,255,.06);color:#e4eff0}
.navgrp a.on{background:linear-gradient(90deg,rgba(43,160,173,.30),rgba(43,160,173,.12));color:#7fe3ec}
.navgrp a.on::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:2px;background:#2fb9c6}
.sidelow{margin-top:auto;padding-top:12px;border-top:1px solid rgba(255,255,255,.08)}
.sidelow a{position:relative;display:flex;align-items:center;height:32px;padding:0 10px 0 12px;border-radius:8px;font-size:13px;color:#a7bfc2;text-decoration:none}
.sidelow a:hover{background:rgba(255,255,255,.06);color:#e4eff0}
.sidever{padding:10px 12px 0;font-size:10.5px;color:#5d7a80}

/* ===== 主区与顶栏 ===== */
.main{min-width:0;display:flex;flex-direction:column;height:100vh}
.topbar{position:relative;z-index:30;display:flex;align-items:center;gap:14px;height:56px;padding:0 20px;flex:none;
  background:rgba(250,249,246,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--bd2)}
.topbar h1{font-size:20px;font-weight:600;white-space:nowrap}
.proto{display:inline-flex;align-items:center;height:19px;padding:0 8px;border:1px dashed #9db4b8;border-radius:999px;color:#4f767c;font-size:11px;background:rgba(23,107,117,.05);white-space:nowrap}
.topbar .meta{font-size:12px;color:var(--ink3);white-space:nowrap}
.topbar .sp{flex:1}
.tabs{display:flex;gap:2px;align-self:stretch}
.tabs button{position:relative;padding:0 12px;font-size:13px;font-weight:500;color:var(--ink2)}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ac)}
.tabs button.on::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:2px;border-radius:1px;background:var(--ac)}
.page{flex:1;min-height:0;padding:16px 20px 24px;overflow-y:auto}
.sec{display:none;min-width:0}
.sec.on{display:block}

/* ===== 控件 ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--bd3);background:#fff;color:#303c42;font-size:13px;font-weight:500;white-space:nowrap;box-shadow:var(--sh1)}
.btn:hover{border-color:#bcc8c3;background:#fbfdfc}
.btn.primary{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.primary:hover{background:var(--ac-h);border-color:var(--ac-h)}
.btn.small{height:30px;padding:0 11px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:default}
.btn:active:not(:disabled){transform:scale(.98)}
.link{color:var(--ac);font-size:12px;text-decoration:none;cursor:pointer;white-space:nowrap}
.link:hover{color:var(--ac-h);text-decoration:underline}
.inp{height:30px;padding:0 10px;border:1px solid var(--bd);border-radius:8px;font-size:12.5px;background:#fff;color:var(--ink)}
.sel{height:30px;padding:0 7px;border:1px solid var(--bd);border-radius:8px;font-size:12px;color:var(--ink2);background:#fff}
.bd{display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:var(--r-tag);font-size:11px;font-weight:500;white-space:nowrap;line-height:1}
.bd.ok{background:var(--ok-soft);color:var(--ok)}
.bd.warn{background:var(--warn-soft);color:var(--warn)}
.bd.gray{background:var(--subtle);color:var(--ink3)}
.bd.info{background:var(--info-soft);color:var(--info)}
.note{font-size:12px;color:var(--ink3)}
.rowhint{font-size:11.5px;color:var(--ink3)}
.panel{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-panel);box-shadow:var(--sh1)}
.panel-h{display:flex;align-items:center;gap:10px;padding:12px 15px 10px;border-bottom:1px solid var(--bd2);flex-wrap:wrap}
.panel-h .t{font-size:13px;font-weight:600}
.panel-h .hdops{margin-left:auto;display:flex;align-items:center;gap:8px}
.panel-b{padding:12px 15px 14px}
.ck{width:14px;height:14px;accent-color:var(--ac)}
.prog{height:4px;border-radius:2px;background:var(--bd2);overflow:hidden;flex:1;min-width:60px}
.prog i{display:block;height:100%;width:0;background:var(--ac)}

/* ===== 范围栏 ===== */
.scope{display:flex;align-items:center;gap:12px;padding:10px 15px;flex-wrap:wrap;margin-bottom:10px}
.scope .lab{font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:6px}
.xchip{display:inline-flex;flex-direction:column;align-items:flex-start;gap:1px;padding:4px 10px;border:1px solid var(--bd);border-radius:8px;background:#fff;font-size:12px;color:var(--ink2);text-align:left;cursor:pointer}
.xchip b{font-weight:500;color:var(--ink2)}
.xchip span{font-size:10.5px;color:var(--ink3)}
.xchip:hover{border-color:var(--bd3)}
.xchip.on{border-color:rgba(23,107,117,.5);background:var(--ac-soft)}
.xchip.on b{color:var(--ac)}
.keepnote{display:none;font-size:12px;color:var(--warn);margin:0 2px 10px}
.keepnote.on{display:block}

/* ===== 三栏 ===== */
.cols{display:grid;grid-template-columns:320px minmax(0,1fr) 340px;gap:14px;align-items:start}
@media (max-width:1200px){.cols{grid-template-columns:1fr}}

/* ===== 左栏 ===== */
.seg{display:inline-flex;background:var(--subtle);border-radius:8px;padding:2px;gap:2px}
.seg button{padding:4px 12px;border-radius:6px;font-size:12.5px;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--sh1);font-weight:500}
.ectl{display:flex;align-items:center;gap:8px;margin:10px 0 6px;flex-wrap:wrap}
.ectl .sel{height:26px;font-size:11.5px}
.lcount{font-size:11.5px;color:var(--ink3);margin:2px 0 8px}
.lq{width:100%;display:block;text-align:left;padding:8px 10px;border:1px solid var(--bd2);border-radius:9px;background:#fff;margin-bottom:6px}
.lq:hover{border-color:var(--bd3)}
.lq.on{border-color:rgba(23,107,117,.55);background:var(--ac-soft)}
.lq1{display:flex;align-items:center;gap:7px}
.lqt{font-size:12.5px;font-weight:600;white-space:nowrap}
.lqr{margin-left:auto;font-size:16px;font-weight:700;color:var(--danger);font-variant-numeric:tabular-nums}
.lqr.soft{color:var(--ac);font-weight:600;font-size:14px}
.ratebar{height:4px;border-radius:2px;background:var(--bd2);margin:5px 0;overflow:hidden}
.ratebar i{display:block;height:100%;background:var(--danger)}
.ratebar i.soft{background:var(--ac)}
.cchip{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:999px;background:var(--subtle);font-size:11px;color:var(--ink2);margin:0 5px 3px 0}
.cchip i{width:7px;height:7px;border-radius:50%;flex:none}
.lq3{font-size:11px;color:var(--ink3);margin-top:3px;line-height:1.55}
.lq3 .bd{margin-right:4px}
.chap{font-size:12px;font-weight:600;color:var(--ink);margin:12px 2px 4px}
.sech{font-size:11px;font-weight:600;color:var(--ink3);margin:8px 2px 4px}
.skillcap{font-size:11px;color:var(--ink3);margin:2px 0 8px}
.draftarea{margin:6px 0 10px;border:1px solid rgba(23,107,117,.25);background:var(--ac-soft);border-radius:9px;padding:9px 11px;font-size:12px;color:var(--ink2)}
.draftarea .sel{height:24px;font-size:11.5px;margin:0 2px}
.draftacts{display:flex;align-items:center;gap:8px;margin-top:8px}
.draftmsg{margin-top:7px;font-size:12px;color:var(--ok)}
.sklmore{display:block;margin:6px 0 4px;font-size:12px}

/* ===== 中栏 ===== */
.orig{border:1px solid var(--bd2);border-radius:10px;background:#fbfdfc;padding:10px 12px;margin-bottom:12px}
.orig .oh{display:flex;align-items:center;gap:8px;font-size:12.5px;flex-wrap:wrap}
.orig .oh b{font-weight:600}
.stem{font-size:12.5px;color:var(--ink2);line-height:1.65;margin:6px 0 2px}
.stem.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stackbar{display:flex;height:14px;border-radius:4px;overflow:hidden;margin:10px 0 5px;background:var(--bd2)}
.stackbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:11px;color:var(--ink3)}
.legend .dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.interp{font-size:12px;color:var(--ink2);background:var(--info-soft);border-radius:8px;padding:6px 10px;margin-top:8px}
.skchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.skchip{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;background:var(--subtle);font-size:11.5px;color:var(--ink2)}
.candhead{display:flex;align-items:center;gap:10px;margin:4px 0 10px;flex-wrap:wrap}
.candhead .t{font-size:13px;font-weight:600}
.pillrow{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.pillrow .plab{font-size:11.5px;color:var(--ink3)}
.pill{padding:2px 11px;border:1px solid var(--bd);border-radius:999px;font-size:12px;background:#fff;color:var(--ink2)}
.pill:hover{border-color:var(--bd3)}
.pill.on{border-color:rgba(23,107,117,.55);background:var(--ac-soft);color:var(--ac)}
.cand{border:1px solid var(--bd2);border-radius:10px;background:#fff;padding:10px 12px;margin-bottom:10px}
.cand .ch{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cand .ch .ct{font-size:12.5px;font-weight:600}
.cand .ch .cd{font-size:11.5px;color:var(--ink3)}
.cand .ch .ops{margin-left:auto}
.cand .cb{font-size:12.5px;color:var(--ink2);line-height:1.65;margin:7px 0}
.cand .cf{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--ink3)}
.candwarn{display:none;margin-top:8px;align-items:center;gap:8px;background:var(--warn-soft);border:1px solid rgba(184,135,58,.3);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--warn);flex-wrap:wrap}
.candwarn.on{display:flex}
.simtag{color:var(--warn);font-size:11.5px}
.mempty{padding:40px 0;text-align:center;color:var(--ink3);font-size:12.5px}

/* ===== 右栏 ===== */
.stick{position:sticky;top:0}
.ptitle{width:100%;margin-bottom:8px}
.psum{font-size:12.5px;color:var(--ink2);margin-bottom:10px}
.psum b{font-size:14px;color:var(--ink)}
.flab2{font-size:11px;color:var(--ink3);font-weight:600;margin:10px 0 5px}
.minibar{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink2);margin-bottom:4px}
.minibar .lab{width:28px;flex:none}
.minibar .bar{flex:1;height:8px;border-radius:4px;background:var(--bd2);overflow:hidden}
.minibar .bar i{display:block;height:100%;background:var(--ac)}
.minibar .n{width:56px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink3);flex:none}
.hist{display:flex;align-items:flex-end;gap:3px;height:36px}
.hist i{flex:1;background:rgba(23,107,117,.18);border-top:2px solid var(--ac);border-radius:2px 2px 0 0;min-height:2px}
.histlab{display:flex;gap:3px;font-size:9.5px;color:var(--ink3)}
.histlab span{flex:1;text-align:center}
.covrow{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink2)}
.rules{margin:10px 0}
.rule{display:flex;gap:7px;font-size:12px;color:var(--ink2);padding:1.5px 0}
.rule .mk{color:var(--ok);font-weight:700;width:14px;flex:none}
.rule.bad .mk{color:var(--warn)}
.plist{border-top:1px solid var(--bd2);margin-top:10px;padding-top:8px;max-height:280px;overflow-y:auto}
.prow{display:flex;align-items:flex-start;gap:8px;padding:6px 2px;border-bottom:1px solid var(--bd2);font-size:12px}
.prow:last-child{border-bottom:0}
.prow .pn{width:16px;flex:none;color:var(--ink3);font-variant-numeric:tabular-nums;padding-top:1px}
.prow .pb{flex:1;min-width:0}
.prow .ps{display:block;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .pm{display:block;font-size:10.5px;color:var(--ink3);margin-top:1px}
.prow .ops{display:flex;gap:8px;flex:none;padding-top:1px}
.pempty{text-align:center;color:var(--ink3);font-size:12px;padding:16px 6px;line-height:1.8}
.pfoot{margin-top:12px}
.pfoot .btn{width:100%}
.pfoot .note{display:block;text-align:center;margin-top:7px}

/* ===== 出卷设置 ===== */
.stick{max-height:calc(100vh - 96px);overflow-y:auto}
.setcard{border:1px solid var(--bd2);border-radius:10px;padding:9px 11px;margin-top:12px;background:#fbfdfc}
.seth{display:flex;align-items:center;gap:8px}
.seth .t2{font-size:12.5px;font-weight:600}
.setsum{font-size:11.5px;color:var(--ink3);margin-top:4px;line-height:1.6}
.setgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;margin-top:8px}
.setgrid label{display:flex;flex-wrap:wrap;gap:3px;font-size:11.5px;color:var(--ink2)}
.setgrid label small{margin-left:auto;color:var(--ink3);font-size:10.5px}
.setgrid .inp,.setgrid .sel{width:100%;height:28px}
.setfoot{display:flex;align-items:center;gap:10px;margin-top:8px}
.bd.bad{background:var(--danger-soft);color:var(--danger)}
.prow.over .ps{color:var(--danger)}
.prow .pm .bd{margin-left:4px}
.preason{display:block;font-size:11.5px;color:var(--danger);margin-top:6px;text-align:center}
.phint{display:block;font-size:11.5px;color:var(--ink3);margin-top:6px;line-height:1.6}
.steps{display:flex;gap:8px;margin:2px 0 10px}
.step{padding:4px 12px;border-radius:999px;border:1px solid var(--bd);font-size:12px;color:var(--ink3)}
.step.on{border-color:rgba(23,107,117,.55);background:var(--ac-soft);color:var(--ac);font-weight:600}
.origact{margin-top:8px;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink3)}
.xchip .bd{margin-left:4px;height:15px;font-size:10px;padding:0 5px}

/* ===== 导出占位 ===== */
.explist{margin-top:10px;border-top:1px solid var(--bd2)}
.expr{display:flex;gap:10px;padding:7px 2px;border-bottom:1px solid var(--bd2);font-size:12.5px;align-items:baseline}
.expr .pn{width:18px;color:var(--ink3);flex:none}
.expr .pm{margin-left:auto;color:var(--ink3);font-size:11.5px;white-space:nowrap}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);background:#202a30;color:#f3f3ef;font-size:12.5px;padding:8px 15px;border-radius:9px;box-shadow:var(--sh3);opacity:0;transition:.2s;z-index:80;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
  <!-- ============ 侧栏 ============ -->
  <aside class="side">
    <div class="brand"><div class="mark">衡</div><div><b>知衡</b><span>教师教学工作台</span></div></div>
    <nav aria-label="主导航">
      <div class="navgrp"><div class="gl">教学</div>
        <a href="#">工作台</a><a href="#">考试阅卷</a><a href="#">复核</a><a href="#">结果中心</a>
      </div>
      <div class="navgrp"><div class="gl">题库与训练</div>
        <a href="#">题库管理</a><a href="#" class="on" aria-current="page">组卷工作台</a><a href="#">个性化训练</a>
      </div>
      <div class="navgrp"><div class="gl">分析</div>
        <a href="#">学情概览</a>
      </div>
    </nav>
    <div class="sidelow">
      <a href="#">设置</a>
      <div class="sidever">v1.5.0 · 原型预览</div>
    </div>
  </aside>

  <!-- ============ 主区 ============ -->
  <div class="main">
    <header class="topbar">
      <h1>组卷工作台</h1>
      <span class="proto">原型 · 合成数据</span>
      <span class="meta" id="paperMeta">当前试卷 0 题</span>
      <div class="sp"></div>
      <div class="tabs" role="tablist" aria-label="页面">
        <button role="tab" class="on" data-sec="assemble" aria-selected="true">班级组卷</button>
        <button role="tab" data-sec="export" aria-selected="false">整理与导出</button>
      </div>
    </header>
    <div class="page">
      <div class="content">

        <!-- ========== 班级组卷 ========== -->
        <section class="sec on" id="sec-assemble">
          <div class="panel scope">
            <span class="lab">班级</span>
            <span id="clsChips" style="display:inline-flex;gap:8px;flex-wrap:wrap"></span>
            <span class="note" id="clsTotal"></span>
            <span class="lab">依据考试</span>
            <span id="examChips" style="display:inline-flex;gap:8px;flex-wrap:wrap"></span>
            <label class="lab" style="cursor:pointer"><input type="checkbox" class="ck" id="overlayCk" checked> 叠加训练掌握情况</label>
            <span style="flex:1"></span>
            <span class="note">本地筛选 · 无模型费用</span>
          </div>
          <div class="keepnote" id="keepNote">试卷保留；覆盖情况按新依据重算</div>

function selClasses(){return CLASSES.filter(c=>S.classes.has(c.id))}
function multi(){return S.classes.size>1}
function totalN(){return selClasses().reduce((s,c)=>s+c.n,0)}
function factor(){return totalN()/48}
function sc(v){return Math.round(v*factor())}
/* 多班合并：同一场考试按参加人数加权得分率，错因人数相加，保留各班明细 */
function mergedExams(){
  const map=new Map();
  selClasses().forEach(c=>c.exams.forEach(e=>{
    let m=map.get(e.id);
    if(!m){m={id:e.id,short:e.short,title:e.title,date:e.date,n:0,sum:0,classes:[],qs:new Map()};map.set(e.id,m)}
    m.n+=e.n;m.sum+=e.avg*e.n;m.classes.push(c.name);
    e.questions.forEach(q=>{
      let mq=m.qs.get(q.label);
      if(!mq){mq={...q,per:[],causes:q.causes?[]:null};m.qs.set(q.label,mq)}
      mq.per.push({name:c.name,rate:q.rate,n:e.n});
      if(q.causes&&mq.causes)q.causes.forEach(([k,v])=>{const f=mq.causes.find(x=>x[0]===k);if(f)f[1]+=v;else mq.causes.push([k,v])});
    });
  }));
  return [...map.values()].sort((a,b)=>b.date.localeCompare(a.date)).map(m=>({
    id:m.id,short:m.short,title:m.title,date:m.date,n:m.n,classes:m.classes,avg:+(m.sum/m.n).toFixed(1),
    questions:[...m.qs.values()].map(q=>({...q,rate:q.per.reduce((s,p)=>s+p.rate*p.n,0)/q.per.reduce((s,p)=>s+p.n,0)})),
  }));
}
function examsFor(){return mergedExams()}
function pruneExams(){
  const ids=new Set(examsFor().map(e=>e.id));
  S.exams=new Set([...S.exams].filter(i=>ids.has(i)));
  if(!S.exams.size)S.exams=new Set(examsFor().slice(0,2).map(e=>e.id));
}
function selExams(){return examsFor().filter(e=>S.exams.has(e.id))}
function autoTitle(){
  if(S.titleEdited)return;
  const cs=selClasses();
  const latest=selExams()[0];
  $('#paperTitle').value=cs.length>1
    ?'八年级'+cs.map(c=>c.name.replace('班','')).join('、')+'班 补偿练习'
    :cs[0].full+' '+(latest?latest.short:'')+'补偿练习';
}

  if(!multi())return '';
  const only=q.per.length<S.classes.size?'仅'+q.per.map(p=>p.name).join('、')+'参加 · ':'';
  return only+q.per.map(p=>p.name+' '+Math.round(p.rate*100)).join(' · ');
}
function jdCount(){return S.paper.filter(p=>CAND_BY_ID[p.cid].type==='解答题').length}
function origCand(it){
  const id='o:'+it.key;
  if(!CAND_BY_ID[id])CAND_BY_ID[id]={id,skill:it.q.skills[0],type:it.q.type,difficulty:origDiff(it.q),stem:it.q.stem,rem:0,con:0,nw:0,fit:0,match:'原题',isOrig:true};
  return CAND_BY_ID[id];
}
function lostList(){
  const out=[];
  selExams().forEach(e=>e.questions.forEach((q,i)=>{
    if(S.threshold==='all'||q.rate<+S.threshold)out.push({e,q,ord:i,key:e.id+'|'+q.label});
  }));
  if(S.sort==='loss')out.sort((a,b)=>a.q.rate-b.q.rate);
  return out;
}
function skillList(){return SKILLS.filter(s=>s.na>0||S.showAllSkills)}
function paperSkills(){return new Set(S.paper.map(p=>CAND_BY_ID[p.cid].skill))}
function coverInfo(it){
  const ps=paperSkills();
  const hit=it.q.skills.filter(sk=>ps.has(sk));
  const n=S.paper.filter(p=>hit.includes(CAND_BY_ID[p.cid].skill)).length;
  let share='';
  if(n){
    const other=lostList().find(o=>o.key!==it.key&&o.q.skills.some(sk=>hit.includes(sk)));
    if(other)share=other.e.short+'·'+other.q.label;
  }
  return {n,share};
}
function isCovered(it){return coverInfo(it).n>0}
function findItem(key){
  for(const e of selExams())for(const q of e.questions){
    if(e.id+'|'+q.label===key)return {e,q,key};
  }
  return null;
}
function curItem(){
  if(S.view==='exam'){
    const l=lostList();
    let it=S.sel&&S.sel.key?l.find(x=>x.key===S.sel.key):null;
    if(!it){it=l[0]||null;S.sel=it?{kind:'exam',key:it.key}:null}
    return it?{kind:'exam',it}:null;
  }
  const l=skillList();
  let sk=S.sel&&S.sel.id?SKILL_BY_ID[S.sel.id]:null;
  if(!sk||!l.includes(sk)){sk=l[0]||null;S.sel=sk?{kind:'skill',id:sk.id}:null}
  return sk?{kind:'skill',sk}:null;
}
function origDiff(q){return Math.round(((1-q.rate)*7+1.5)*10)/10}
function relOf(c,od){return c.difficulty<od-.8?'更基础':c.difficulty>od+.8?'更难':'相当'}
function curSrc(){
  if(S.view==='exam'&&S.sel&&S.sel.key){
    const f=findItem(S.sel.key);if(f)return {src:'补 '+f.e.short+'·'+f.q.label,skey:{kind:'exam',key:f.key}};
  }
  if(S.view==='skill'&&S.sel&&S.sel.id){
    return {src:'技能 · '+SKILL_BY_ID[S.sel.id].name,skey:{kind:'skill',id:S.sel.id}};
  }
  return {src:'',skey:null};
}

/* ================= 规则 ================= */
function checkAdd(c){
  const R=S.rules;
  for(let i=0;i<S.paper.length;i++){
    const pc=CAND_BY_ID[S.paper[i].cid];
    if(c.similarTo===pc.id||pc.similarTo===c.id)return {kind:'sim',msg:'与卷中第 '+(i+1)+' 题高度相似'};
  }
  const same=S.paper.map((p,i)=>CAND_BY_ID[p.cid].skill===c.skill?i:-1).filter(i=>i>=0);
  if(same.length>=R.perSkill){
    const pc=CAND_BY_ID[S.paper[same[0]].cid];
    return {kind:'skill',msg:'同技能最多 '+R.perSkill+' 道：卷中已有「'+pc.stem.slice(0,12)+'…」，可点「替换」',replaceIdx:same[0]};
  }
  if(c.type==='解答题'&&jdCount()>=R.written)return {kind:'type',msg:'解答题最多 '+R.written+' 道，已满'};
  if(c.difficulty>R.diffMax)return {kind:'diff',msg:'难度 '+c.difficulty+' 超过上限 '+R.diffMax+' 级'};
  return null;
}
/* 改小限制后不自动移出，只把超出的题标红 */
function violations(){
  const R=S.rules,out=S.paper.map(()=>[]),skc={};let jd=0;
  S.paper.forEach((p,i)=>{
    const c=CAND_BY_ID[p.cid];
    skc[c.skill]=(skc[c.skill]||0)+1;
    if(skc[c.skill]>R.perSkill)out[i].push('同技能最多 '+R.perSkill+' 道');
    if(c.type==='解答题'){jd++;if(jd>R.written)out[i].push('解答题最多 '+R.written+' 道')}
    if(c.difficulty>R.diffMax)out[i].push('难度上限 '+R.diffMax+' 级');
    if(c.isOrig&&R.recent>0)out[i].push('近期原题');
    for(let j=0;j<i;j++){const d=CAND_BY_ID[S.paper[j].cid];if(c.similarTo===d.id||d.similarTo===c.id)out[i].push('与第 '+(j+1)+' 题高度相似')}
  });
  return out;
}
function shortReason(b){
  if(!b)return '无可配题';
  if(b.kind==='type')return '解答题已满 '+S.rules.written+' 道';
  if(b.kind==='skill')return '同技能已配';
  if(b.kind==='sim')return '与卷中题高度相似';
  if(b.kind==='diff')return '难度超限';
  return '无可配题';
}
function addCand(c){
  if(S.paper.some(p=>p.cid===c.id)){ // 已在卷 → 移出
    S.paper=S.paper.filter(p=>p.cid!==c.id);S.warnFor=null;renderAll();return;
  }
  const b=checkAdd(c);
  if(b){S.warnFor=c.id;S.warnMsg=b.msg;S.warnReplace=b.replaceIdx;renderAll();return}
  const {src,skey}=curSrc();
  S.paper.push({cid:c.id,src,skey});
  S.warnFor=null;renderAll();
}
function replaceCand(idx,c){
  const old=CAND_BY_ID[S.paper[idx].cid];
  if(c.type==='解答题'&&old.type!=='解答题'&&jdCount()>=S.rules.written){
    toast('解答题最多 '+S.rules.written+' 道，不能换成解答题');return;
  }
  const {src,skey}=curSrc();
  S.paper[idx]={cid:c.id,src,skey};
  S.warnFor=null;renderAll();
}

/* ================= 渲染：范围栏 ================= */
function renderChips(){
  const allC=S.classes.size===CLASSES.length;
  $('#clsChips').innerHTML=`<button class="xchip${allC?' on':''}" data-cls="all"><b>全选</b><span>${CLASSES.length} 个班</span></button>`
    +CLASSES.map(c=>`<button class="xchip${S.classes.has(c.id)?' on':''}" data-cls="${c.id}"><b>${c.full}</b><span>${c.n}人</span></button>`).join('');
  $('#clsTotal').textContent=multi()?'合计 '+totalN()+' 人':'';
  $$('#clsChips .xchip').forEach(b=>b.onclick=()=>{
    const id=b.dataset.cls;
    if(id==='all'){if(allC){toast('已全选');return}S.classes=new Set(CLASSES.map(c=>c.id))}
    else if(S.classes.has(id)){
      if(S.classes.size<=1){toast('至少保留一个班级');return}
      S.classes.delete(id);
    }else S.classes.add(id);
    pruneExams();S.sel=null;S.warnFor=null;autoTitle();keepNote();renderChips();renderAll();
  });
  const exams=examsFor(),allE=exams.every(e=>S.exams.has(e.id));
  $('#examChips').innerHTML=`<button class="xchip${allE?' on':''}" data-ex="all"><b>全选</b><span>${exams.length} 场</span></button>`
    +exams.map(e=>{
      const part=multi()&&e.classes.length<S.classes.size?`<span class="bd gray">仅${e.classes.join('、')}</span>`:'';
      return `<button class="xchip${S.exams.has(e.id)?' on':''}" data-ex="${e.id}">
      <b>${e.title}${part}</b><span>${e.date} · ${e.n}人 · 均分 ${e.avg}</span></button>`;
    }).join('');
  $$('#examChips .xchip').forEach(b=>b.onclick=()=>{
    const id=b.dataset.ex;
    if(id==='all'){if(allE){toast('已全选');return}S.exams=new Set(exams.map(e=>e.id))}
    else if(S.exams.has(id)){
      if(S.exams.size<=1){toast('至少保留一场考试作为依据');return}
      S.exams.delete(id);
    }else S.exams.add(id);
    autoTitle();keepNote();renderChips();renderAll();
  });
}
let keepNoteShown=false;
function keepNote(msg){

/* ================= 渲染：中栏 ================= */
function candPool(){
  const it=curItem();if(!it)return {item:null,list:[]};
  let pool;
  if(it.kind==='exam')pool=CANDS.filter(c=>it.it.q.skills.includes(c.skill));
  else pool=CANDS.filter(c=>c.skill===it.sk.id);
  if(S.typeF!=='全部')pool=pool.filter(c=>c.type===S.typeF);
  if(it.kind==='exam'&&S.diffPill!=='all'){
    const od=origDiff(it.it.q);
    pool=pool.filter(c=>relOf(c,od)===S.diffPill);
  }
  return {item:it,list:pool};
}
function renderMiddle(){
  const {item,list}=candPool();
  /* 原题块 */
  if(item&&item.kind==='exam'){
    const {e,q}=item.it;
    const total=q.causes?q.causes.reduce((s,c)=>s+c[1],0):0;
    let causeHtml='';
    if(q.causes){
      const seg=CAUSES.filter(c=>q.causes.some(x=>x[0]===c))
        .map(c=>{const n=q.causes.find(x=>x[0]===c)[1];return `<i style="width:${(n/total*100).toFixed(1)}%;background:${CAUSE_COLOR[c]}" title="${c} ${n}人"></i>`}).join('');
      const leg=CAUSES.map(c=>{const f=q.causes.find(x=>x[0]===c);const n=f?f[1]:0;
        return `<span><i class="dot" style="background:${CAUSE_COLOR[c]}"></i>${c} ${n}人</span>`}).join('');
      const top=[...q.causes].sort((a,b)=>b[1]-a[1])[0][0];
      const interp=top==='未作答'?'多数失分为未作答，可能偏难或时间不够，建议配一道更基础的题'
        :top==='计算与化简'?'以计算失误为主，适合配同类型计算变式'
        :`以「${top}」为主，建议配同技能变式`;
      causeHtml=`<div class="stackbar">${seg}</div><div class="legend">${leg}</div><div class="interp">${interp}</div>`;
    }else{
      causeHtml='<div class="lq3" style="margin-top:8px">本场考试错因未整理</div>';
    }
    const skchips=q.skills.map(s=>`<span class="skchip">${SKILL_BY_ID[s].name}</span>`).join('');
    const per=multi()?`<div class="lq3" style="margin-top:3px">${q.per.length<S.classes.size?'仅'+q.per.map(p=>p.name).join('、')+'参加 · ':''}${q.per.map(p=>p.name+' '+Math.round(p.rate*100)+'%（'+p.n+'人）').join(' · ')}</div>`:'';
    const who=multi()?'所选班级':'本班';
    let origAct;
    if(q.linked===false)origAct='<div class="origact">该题未关联题库，只能按技能配题</div>';
    else if(S.rules.recent>0)origAct=`<div class="origact">${who}最近 ${S.rules.recent} 次已做过原题，按出卷设置不重复出</div>`;
    else{
      const oc=origCand(item.it),inP=S.paper.some(p=>p.cid===oc.id);
      origAct=`<div class="origact"><button class="btn small${inP?'':' primary'}" id="origAdd">${inP?'原题已在卷中':'加入原题'}</button><span>出卷设置已允许近期原题</span></div>`;
    }
    $('#origWrap').innerHTML=`<div class="orig">
      <div class="oh"><b>原题</b><span>${e.short} · ${q.label} · ${q.type} · ${q.score}分 · ${multi()?'合计':'本班'}得分率 ${Math.round(q.rate*100)}%</span></div>
      ${per}
      <div class="stem${S.origOpen?'':' clamp'}" id="origStem">${q.stem}</div>
      <button class="link" id="origTgl">${S.origOpen?'收起':'展开原题'}</button>
      ${causeHtml}
      <div class="skchips">${skchips}</div>
      ${origAct}
    </div>`;
    $('#origTgl').onclick=()=>{S.origOpen=!S.origOpen;renderMiddle()};
    const oa=$('#origAdd');
    if(oa)oa.onclick=()=>{
      const oc=origCand(item.it);
      if(S.paper.some(p=>p.cid===oc.id)){S.paper=S.paper.filter(p=>p.cid!==oc.id);renderAll();return}
      const b=checkAdd(oc);if(b){toast(b.msg);return}
      S.paper.push({cid:oc.id,src:'原题 '+e.short+'·'+q.label,skey:{kind:'exam',key:item.it.key}});renderAll();
    };
  }else{
    $('#origWrap').innerHTML=item?`<div class="lq3" style="margin-bottom:10px">技能「${item.sk.name}」：${sc(item.sk.na)} 人需关注 · ${sc(item.sk.ev)} 人有证据 · 掌握度 ${Math.round(item.sk.ma*100)}%</div>`:'';
  }

    $('#diffPills').innerHTML='<span class="plab">难度</span>'+['全部','更基础','相当','更难']
      .map(p=>`<button class="pill${S.diffPill===p?' on':''}" data-p="${p}">${p}</button>`).join('');

  }else{
    $('#diffPills').innerHTML='<span class="plab">难度</span><span class="rowhint">卡片标注绝对难度</span>';
  }
  $('#candTitle').textContent=item
    ?(item.kind==='exam'?'可配的题 · 同技能 '+list.length+' 题':'可配的题 · '+item.sk.name+' '+list.length+' 题')
    :'可配的题';
  /* 候选卡 */
  const od=item&&item.kind==='exam'?origDiff(item.it.q):null;
  $('#candList').innerHTML=list.map((c,i)=>{
    const inPaper=S.paper.some(p=>p.cid===c.id);
    const rel=od!==null?'（'+relOf(c,od)+'）':'';
    const simIdx=c.similarTo?list.findIndex(x=>x.id===c.similarTo):-1;
    const sim=c.similarTo?`<span class="simtag">${simIdx>=0?'与候选 '+(simIdx+1)+' 高度相似':'与另一道候选高度相似'}</span>`:'';
    const warn=S.warnFor===c.id?`<div class="candwarn on"><span>${S.warnMsg}</span>${S.warnReplace!==undefined&&S.warnReplace!==null?`<button class="btn small" data-rep="${c.id}">替换</button>`:''}</div>`:'';
    return `<div class="cand" data-cid="${c.id}">

      <div class="cb">${c.stem}</div>

      ${warn}

  }).join('')||'<div class="mempty">没有符合筛选的候选题</div>';
  $$('#candList [data-add]').forEach(b=>b.onclick=()=>addCand(CAND_BY_ID[b.dataset.add]));
  $$('#candList [data-rep]').forEach(b=>b.onclick=()=>{
    const c=CAND_BY_ID[b.dataset.rep];
    if(S.warnReplace!==undefined&&S.warnReplace!==null)replaceCand(S.warnReplace,c);
  });
}

/* ================= 渲染：右栏 ================= */
function renderPaper(){
  const n=S.paper.length;
  $('#paperMeta').textContent='当前试卷 '+n+' 题';
  const mins=S.paper.reduce((s,p)=>s+TYPE_MIN[CAND_BY_ID[p.cid].type],0);
  const R=S.rules,training=R.purpose==='training';
  $('#paperSum').innerHTML='<b>'+n+' 题</b> · 预计 '+mins+' 分钟 <span class="bd info">'+(training?'训练卷':'讲义')+'</span>';
  /* 题型构成 */
  const types=['选择题','填空题','解答题'];
  const max=Math.max(1,...types.map(t=>S.paper.filter(p=>CAND_BY_ID[p.cid].type===t).length));
  $('#typeBars').innerHTML=types.map(t=>{
    const c=S.paper.filter(p=>CAND_BY_ID[p.cid].type===t).length;
    const lim=t==='解答题'&&c>=R.written?(c>R.written?c+'/'+R.written+' 超出':c+'/'+R.written+' 已满'):c+' 题';
    return `<div class="minibar"><span class="lab">${t.slice(0,2)}</span><div class="bar"><i style="width:${c/max*100}%"></i></div><span class="n">${lim}</span></div>`;
  }).join('');
  /* 难度分布 */
  const bk=[0,0,0,0,0,0,0,0];
  S.paper.forEach(p=>{const d=Math.max(1,Math.min(8,Math.round(CAND_BY_ID[p.cid].difficulty)));bk[d-1]++});
  const mx=Math.max(1,...bk);
  $('#hist').innerHTML=bk.map(v=>`<i style="height:${v?Math.max(8,v/mx*100):2}%"></i>`).join('');
  $('#histLab').innerHTML=bk.map((_,i)=>`<span>${i+1}</span>`).join('');
  /* 覆盖 */
  const l=lostList(),cov=l.filter(it=>isCovered(it)).length;
  $('#covText').textContent='覆盖失分题 '+cov+'/'+l.length;
  $('#covBar').style.width=(l.length?cov/l.length*100:0)+'%';
  /* 出卷设置与检查 */
  const v=violations(),has=k=>v.some(a=>a.some(x=>x.startsWith(k)));
  const countBad=training&&(n<8||n>12);
  const rules=[
    {t:'题数 '+n+' / 目标 '+R.count+(training?'（训练卷需 8–12）':''),bad:countBad},
    {t:'同技能最多 '+R.perSkill+' 道',bad:has('同技能')},
    {t:'解答题最多 '+R.written+' 道',bad:has('解答题')},
    {t:'难度不超过 '+R.diffMax+' 级',bad:has('难度')},
    {t:R.recent>0?'不含近期原题与高度相似题':'不含高度相似题（已允许近期原题）',bad:has('近期原题')||has('与第')},
  ];
  $('#rules').innerHTML=rules.map(r=>`<div class="rule${r.bad?' bad':''}"><span class="mk">${r.bad?'!':'✓'}</span><span>${r.t}</span></div>`).join('');
  const changed=Object.keys(DEF_RULES).some(k=>R[k]!==DEF_RULES[k]);
  $('#setChanged').hidden=!changed;
  $('#setSum').textContent=(training?'训练卷 · 回收批改':'讲义 · 只打印')+' · '+R.count+' 题 · 难度 ≤ '+R.diffMax+' · 同技能 ≤ '+R.perSkill+' · 解答题 ≤ '+R.written+' · '+(R.recent?'排除最近 '+R.recent+' 次原题':'不排除近期原题');
  $('#setBody').hidden=!S.setOpen;$('#setTgl').textContent=S.setOpen?'收起':'修改';
  $('#rPurpose').value=R.purpose;$('#rCount').value=R.count;$('#rDiff').value=R.diffMax;
  $('#rSkill').value=R.perSkill;$('#rWritten').value=R.written;$('#rRecent').value=R.recent;
  $('#rCountHint').textContent=training?'8–12 题':'至少 1 题';
  $('#draftText').textContent='按出卷设置补足到 '+R.count+' 题：为未配题的失分题各配 1 道最合适的题，之后可逐题替换。';
  /* 主按钮 */
  let reason='';
  if(!n)reason='试卷还没有题';
  else if(v.some(a=>a.length))reason='有题目超出出卷设置，请移出或替换标红的题';
  else if(countBad)reason='训练卷需 8–12 题，当前 '+n+' 题';
  const go=$('#goExport');
  go.textContent=training?'生成训练卷 →':'去整理与导出 →';
  go.disabled=!!reason;
  $('#goReason').hidden=!reason;$('#goReason').textContent=reason;
  $('#goHint').textContent=training
    ?'全班同一套卷（'+totalN()+' 人），进入训练流程：审核题目 → 打印试卷 → 回收批改，批改结果更新这些学生的掌握度，考试分数不受影响。回收批改会调用模型、产生费用，批改前在训练页确认。'
    :'讲义不回收、不更新掌握度。';
  $('.tabs button[data-sec="export"]').textContent=training?'审核与回收':'整理与导出';
  /* 卷面列表 */
  $('#plist').innerHTML=n?S.paper.map((p,i)=>{
    const c=CAND_BY_ID[p.cid];
    const over=v[i].length?v[i].map(x=>`<span class="bd bad">超出：${x}</span>`).join(''):'';
    return `<div class="prow${over?' over':''}"><span class="pn">${i+1}</span>
      <div class="pb"><span class="ps">${c.stem.slice(0,20)}${c.stem.length>20?'…':''}</span>
      <span class="pm">${c.type} · 难度 ${c.difficulty} · ${p.src}${over}</span></div>
      <span class="ops"><button class="link" data-swap="${i}">换一题</button><button class="link" data-rm="${i}">移出</button></span></div>`;
  }).join(''):'<div class="pempty">还没有题。从左侧选一道失分题，在中间挑一题加入；或用「快速起草」。</div>';
  $$('#plist [data-rm]').forEach(b=>b.onclick=()=>{S.paper.splice(+b.dataset.rm,1);S.warnFor=null;renderAll()});
  $$('#plist [data-swap]').forEach(b=>b.onclick=()=>jumpToSource(S.paper[+b.dataset.swap].skey));
}
function jumpToSource(skey){
  if(!skey)return;
  if(skey.kind==='exam'){
    const eid=skey.key.split('|')[0];
    if(!examsFor().some(e=>e.id===eid)){toast('来源考试不在当前所选班级中');return}
    if(!S.exams.has(eid)){S.exams.add(eid);renderChips();keepNote('已把来源考试加回依据，试卷保留')}
    S.view='exam';
    if(!lostList().some(x=>x.key===skey.key)){S.threshold='all';$('#thSel').value='all'}
    S.sel={kind:'exam',key:skey.key};S.warnFor=null;
    renderAll();
    const row=$$('#lostList [data-lq]').find(r=>r.dataset.lq===skey.key);
    if(row)row.scrollIntoView({block:'center',behavior:'smooth'});
  }else{
    S.view='skill';
    const sk=SKILL_BY_ID[skey.id];
    if(sk&&sk.na===0)S.showAllSkills=true;
    S.sel={kind:'skill',id:skey.id};S.warnFor=null;
    renderAll();
    const row=$$('#skillList [data-sk]').find(r=>r.dataset.sk===skey.id);
    if(row)row.scrollIntoView({block:'center',behavior:'smooth'});
  }
}

/* ================= 渲染：导出 ================= */
function renderExport(){
  const training=S.rules.purpose==='training';
  $('#expTitle').textContent=training?'审核与回收':'整理与导出';
  $('#expHead').innerHTML=training
    ?`<div class="steps"><span class="step on">1 审核题目</span><span class="step">2 打印试卷</span><span class="step">3 回收批改</span></div>
      <p class="note">全班同一套卷 · ${totalN()} 人（${selClasses().map(c=>c.name).join('、')}全体） · ${S.paper.length} 题 · 来源：班级组卷（依据 ${selExams().map(e=>e.short).join('、')}）</p>
      <p class="note" style="margin-top:4px">沿用个性化训练现有流程，本原型只示意衔接。审核按整卷统一调整，不按学生换题；个人卷、小组卷仍在个性化训练自动选题。</p>
      <p class="note" style="margin-top:4px">生成和打印不产生费用；回收批改会调用模型、产生费用，批改前在训练页确认。批改结果写入训练证据并更新掌握度，考试分数、排名与报告不变。</p>`
    :'<p class="note">沿用现有的试卷设置、题序拖拽与 Word 导出，本原型不改动。</p>';
  $('#expList').innerHTML=S.paper.length?S.paper.map((p,i)=>{
    const c=CAND_BY_ID[p.cid];
    return `<div class="expr"><span class="pn">${i+1}.</span><span>${c.stem.slice(0,42)}${c.stem.length>42?'…':''}</span><span class="pm">${c.type} · 难度 ${c.difficulty} · ${p.src}</span></div>`;
  }).join(''):'<div class="pempty">试卷为空</div>';
}

/* ================= 汇总渲染 ================= */
function renderAll(){curItem();renderLeft();renderMiddle();renderPaper()}

/* ================= 快速起草 ================= */
function doDraft(){
  const target=S.rules.count;
  if(S.paper.length>=target){const dm=$('#draftMsg');dm.hidden=false;dm.textContent='试卷已有 '+S.paper.length+' 题，达到出卷设置的 '+target+' 题，未再起草';return}
  const list=lostList().filter(it=>!isCovered(it));
  let added=0;const reasons={};
  list.forEach(it=>{
    if(S.paper.length>=target)return;
    const pool=CANDS.filter(c=>it.q.skills.includes(c.skill)&&!S.paper.some(p=>p.cid===c.id))
      .sort((a,b)=>b.fit-a.fit);
    let picked=null,reason='无可配题';
    for(const c of pool){const b=checkAdd(c);if(!b){picked=c;break}else reason=shortReason(b)}
    if(picked){S.paper.push({cid:picked.id,src:'补 '+it.e.short+'·'+it.q.label,skey:{kind:'exam',key:it.key}});added++}
    else reasons[reason]=(reasons[reason]||0)+1;
  });
  renderAll();
  let msg='已起草 '+added+' 题，试卷共 '+S.paper.length+' / '+target+' 题';
  const parts=Object.entries(reasons).map(([r,c])=>c+' 道因'+r+'跳过');
  if(parts.length)msg+='；'+parts.join('，');
  if(!added&&!parts.length)msg='没有可起草的失分题';
  const dm=$('#draftMsg');dm.hidden=false;dm.textContent=msg;
}

/* ================= 事件 ================= */
function switchSection(id){
  $$('.tabs button').forEach(b=>{b.classList.toggle('on',b.dataset.sec===id);b.setAttribute('aria-selected',b.dataset.sec===id)});
  $$('.sec').forEach(s=>s.classList.toggle('on',s.id==='sec-'+id));
  if(id==='export')renderExport();
  $('.page').scrollTop=0;
}
$$('.tabs button').forEach(b=>b.onclick=()=>switchSection(b.dataset.sec));
$('#goExport').onclick=()=>switchSection('export');

$('#paperTitle').oninput=()=>{S.titleEdited=true};
$('#setTgl').onclick=()=>{S.setOpen=!S.setOpen;renderPaper()};
$('#setReset').onclick=()=>{S.rules={...DEF_RULES};renderAll()};
function num(id,min,max,def){const v=Math.round(+$(id).value);return Number.isFinite(v)?Math.min(max,Math.max(min,v)):def}
function readRules(){
  const R=S.rules;
  R.purpose=$('#rPurpose').value;
  R.count=num('#rCount',R.purpose==='training'?8:1,R.purpose==='training'?12:500,R.count);
  R.diffMax=num('#rDiff',1,10,R.diffMax);
  R.perSkill=num('#rSkill',1,50,R.perSkill);
  R.written=num('#rWritten',0,50,R.written);
  R.recent=num('#rRecent',0,20,R.recent);
  S.warnFor=null;renderAll();
}
['#rPurpose','#rCount','#rDiff','#rSkill','#rWritten','#rRecent'].forEach(id=>$(id).onchange=readRules);
$('#overlayCk').onchange=()=>renderLeft();
$$('#viewSeg button').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;S.sel=null;S.warnFor=null;S.origOpen=false;renderAll()});
$('#thSel').onchange=e=>{S.threshold=e.target.value;S.sel=null;renderAll()};
$('#sortSel').onchange=e=>{S.sort=e.target.value;renderAll()};
$('#typeSel').onchange=e=>{S.typeF=e.target.value;renderMiddle()};
$('#skillMore').onclick=()=>{S.showAllSkills=!S.showAllSkills;renderLeft()};
$('#btnDraft').onclick=()=>{const a=$('#draftArea');a.hidden=!a.hidden;$('#draftMsg').hidden=true};
$('#draftCancel').onclick=()=>{$('#draftArea').hidden=true};
$('#draftGo').onclick=doDraft;

document.addEventListener('keydown',e=>{
  const ae=document.activeElement;
  if(ae&&['INPUT','SELECT','TEXTAREA'].includes(ae.tagName))return;
  const k=e.key.toLowerCase();
  if(k!=='w'&&k!=='s')return;
  if($('#sec-assemble').classList.contains('on')===false)return;
  const items=S.view==='exam'?lostList().map(x=>({kind:'exam',key:x.key})):skillList().map(s=>({kind:'skill',id:s.id}));
  if(!items.length)return;
  const cur=S.sel?(S.view==='exam'?S.sel.key:S.sel.id):null;
  let i=items.findIndex(x=>(x.key||x.id)===cur);
  i=k==='s'?Math.min(items.length-1,i+1):Math.max(0,i<0?0:i-1);
  S.sel=items[i];S.warnFor=null;
  renderLeft();renderMiddle();
  const row=S.view==='exam'?$$('#lostList [data-lq]').find(r=>r.dataset.lq===S.sel.key):$$('#skillList [data-sk]').find(r=>r.dataset.sk===S.sel.id);
  if(row)row.scrollIntoView({block:'nearest'});
  e.preventDefault();
});

/* ================= 初始化 ================= */
renderChips();autoTitle();renderAll();
</script>
