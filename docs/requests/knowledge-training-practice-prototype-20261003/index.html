<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>知识与训练 · 训练页原型（演示 · 合成数据）</title>
<!--
  ============================================================
  一次性原型（throwaway prototype），2026-10-03
  用途：演示"知识与训练"中"按学生训练 / 按章节训练"两个页签的改版方向——
  · 按学生训练：左侧选学生 → 中间定训练范围（综合/专项）→ 右侧出卷面板；
  · 按章节训练：左侧章节 → 中间推荐同质小组（可采用/看名单）→ 右侧同一出卷面板；
  · 出卷面板三用途：训练卷（回收批改更新掌握度）、刷题讲义（只打印）、错题本（考试原题 Word）。
  不调用模型、不产生费用、不连接真实接口；全部为种子固定的合成数据。
  "原型控制"角标可切换正常数据与"未选择教学学期"空态。
  尚未实现到正式应用的内容：
  · 真实数据接入；讲义题量结构的后端选题；
  · 错题本按章节/技能/难度排序与留空白；错题本按章节过滤；
  · 批量错题本预览接口；
  · 草稿审核/打印/回收页（沿用现有）。
  ============================================================
-->
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="practice.css">
</head>
<body>

<div class="app">
  <aside class="side">
    <div class="brand"><div class="mark">知</div><div><b>知衡</b><span>教师教学工作台</span></div></div>
    <div class="examcard">
      <div class="el">当前考试</div>
      <div class="en">第四周学情反馈</div>
      <div class="es">八年级上册 · 9 月 20 日 · 已完成</div>
    </div>
    <nav class="navgrp">
      <div class="gl">考试与阅卷</div>
      <a href="#">考试配置</a><a href="#">考试批改</a><a href="#">成绩中心</a>
      <div class="gl">题库与组卷</div>
      <a href="#">题库管理</a><a href="#">组卷工作台</a><a href="#">命题练习</a>
      <div class="gl">教学分析</div>
      <a href="#" class="on">知识与训练</a><a href="#">任务中心</a>
    </nav>
    <div class="sidelow"><a href="#">设置</a></div>
    <div class="sidever">v1.5.0 · 原型演示</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <h1>知识与训练</h1>
      <span class="proto">原型演示 · 合成数据</span>
      <div class="sp"></div>
      <nav class="tabs" id="tabs">
        <button data-dead>学情总览</button>
        <button data-dead>知识结构</button>
        <button data-v="chapter">按章节训练</button>
        <button data-v="student" class="on">按学生训练</button>
        <button data-dead>生成试卷</button>
      </nav>
    </header>

    <div class="page">
      <div class="wrap">
        <!-- 共享范围条：两个页签同一条、同一位置 -->
        <div class="scopebar" id="scopebar">
          <span class="volid">八年级上册</span>
          <span class="evid">本学期 3 场考试 + 已发布训练</span>
          <span class="sep"></span>
          <button class="scp on" data-s="all">全部学生</button>
          <button class="scp" data-s="9班">9班</button>
          <button class="scp" data-s="10班">10班</button>
          <label class="minscore">最低考试得分率
            <input type="number" id="minScore" min="0" max="100" placeholder="不限">
            <span>%</span>
          </label>
        </div>

        <!-- 页签：按学生训练 -->
        <section id="v-student" class="view on">
          <div class="cols">
            <aside class="col col-l" id="stuList"></aside>
            <div class="col col-m" id="stuRange"></div>
            <aside class="col col-r" id="panel-student"></aside>
          </div>
        </section>

        <!-- 页签：按章节训练 -->
        <section id="v-chapter" class="view">
          <div class="cols">
            <aside class="col col-l" id="chapList"></aside>
            <div class="col col-m" id="chapGroups"></div>
            <aside class="col col-r" id="panel-chapter"></aside>
          </div>
        </section>

        <!-- 空态 -->
        <section id="v-state" class="view"></section>
      </div>
    </div>
  </div>
</div>

<!-- 原型控制：默认收起为角标，点击展开 -->
<div id="protoCtl">
  <div id="pcBody">
    <div class="pc-t">原型控制 · 仅演示，不影响数据</div>
    <label><input type="radio" name="ctlstate" value="ok" checked> 正常数据</label>
    <label><input type="radio" name="ctlstate" value="empty"> 未选择教学学期（空态）</label>
    <div class="pc-n">空态替换两个页签的内容区。</div>
  </div>
  <button id="pcToggle" type="button">原型控制</button>
</div>

<div id="drawerWrap"><div class="mask" id="drawerMask"></div><aside class="drawer" id="drawer"></aside></div>
<div class="tooltip" id="tip"></div>
<div id="toast"></div>

<script src="data.js"></script>
<script src="app.js"></script>
<script src="panel.js"></script>
<script src="student.js"></script>
<script src="chapter.js"></script>
</body>
</html>
