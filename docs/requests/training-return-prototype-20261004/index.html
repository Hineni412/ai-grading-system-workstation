<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>回收批改 · 原型（演示 · 合成数据）</title>
<!--
  ============================================================
  一次性原型（throwaway prototype），2026-10-04
  用途：演示"知识与训练 · 生成试卷 · 回收批改"页的改版方向——
  · 无批次时：一个"回收答卷"面板收扫描件，导入即归组；
  · 有批次时：汇总行（批次 + 可点击计数 + 单一主按钮）+ 三栏
    （学生队列 | 答卷影像 | 判定点台账），队列按"需要先处理"排序；
  · 复核一次点击即锁教师判定；台账按学生状态切换形态；
  · 批量判定逐份发送、逐个出结果；批量更新只覆盖无待复核点的份数。
  不调用模型、不产生费用、不连接真实接口；全部为合成数据。
  "原型控制"角标可切换 5 种状态，并可叠加"标注数据来源"查看每块的取数口径。
  尚未实现到正式应用的内容：真实接口接入、批量判定的逐份发送与结果查询、
  教师锁接口、掌握度反馈真实数据、工作台待办跳转定位。
  草稿打开后页头改为：返回 + 草稿标题与信息 + 右上步骤条；不显示知识与训练五个页签（三个步骤通用）。
  ============================================================
-->
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="views.css">
</head>
<body>

<div class="app">
  <aside class="side">
    <button class="brand" type="button" data-t="将进入 工作台"><div class="mark">知</div><div><b>知衡</b><span>教师教学工作台</span></div></button>
    <div class="examcard"><div class="el">当前训练卷</div><div class="en">个人训练卷</div><div class="es">20 人 · 回收批改</div></div>
    <button class="quickrow" type="button" data-t="将打开 快速跳转（Ctrl K）"><span>快速跳转</span><kbd>Ctrl K</kbd></button>
    <nav class="navgrp">
      <div class="gl">考试与阅卷</div>
      <a href="#" data-t="将进入 考试配置">考试配置</a><a href="#" data-t="将进入 考试批改">考试批改</a><a href="#" data-t="将进入 成绩中心">成绩中心</a>
      <div class="gl">题库与组卷</div>
      <a href="#" data-t="将进入 题库管理">题库管理</a><a href="#" data-t="将进入 组卷工作台">组卷工作台</a><a href="#" data-t="将进入 命题练习">命题练习</a>
      <div class="gl">教学分析</div>
      <a href="#" class="on">知识与训练</a>
    </nav>
    <div class="sidelow"><a href="#" data-t="将进入 任务中心">任务中心</a><a href="#" data-t="将进入 设置">设置</a></div>
    <div class="sidever">v1.5.0 · 原型演示</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="bkbtn" type="button" data-t="将返回 按学生训练（实际返回进入草稿前的页面，默认 生成试卷）">← 返回 按学生训练</button>
      <h1>个人训练卷</h1>
      <span class="meta">20 人 · 10月3日 创建 · 自动保存 V3</span>
      <div class="sp"></div>
      <span class="proto">原型演示 · 合成数据</span>
      <div class="dsteps hsteps">
        <span class="dst done"><i>✓</i>审核题目</span><em></em>
        <span class="dst done"><i>✓</i>打印试卷</span><em></em>
        <span class="dst prog"><i></i>回收批改</span>
      </div>
    </header>

    <div class="page">
      <div class="wrap">
        <div id="stateA"></div>
        <div id="stateB" hidden>
          <div id="sumRow"></div>
          <div class="bgrid">
            <div class="bcol" id="colQ"></div>
            <div class="bcol" id="colS"></div>
            <div class="bcol" id="colL"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="modalWrap"></div>

<!-- 原型控制：默认收起为角标，点击展开 -->
<div id="protoCtl">
  <div id="pcBody">
    <div class="pc-t">原型控制 · 仅演示，不影响数据</div>
    <label><input type="radio" name="ctlstate" value="nobatch"> 未建立批次</label>
    <label><input type="radio" name="ctlstate" value="imported"> 刚导入（有异常页）</label>
    <label><input type="radio" name="ctlstate" value="judging"> 判定进行中</label>
    <label><input type="radio" name="ctlstate" value="review" checked> 复核中（默认）</label>
    <label><input type="radio" name="ctlstate" value="done"> 全部完成</label>
    <label><input type="checkbox" id="ctlSrc"> 标注数据来源</label>
    <div class="pc-n">切换状态会重置整页数据；J/K 切换学生，Tab 走待复核点，1/2/3 写判定。</div>
  </div>
  <button id="pcToggle" type="button">原型控制</button>
</div>

<div id="toast"></div>

<script src="data.js"></script>
<script src="states.js"></script>
<script src="util.js"></script>
<script src="sheet.js"></script>
<script src="queue.js"></script>
<script src="review.js"></script>
<script src="ledger.js"></script>
<script src="actions.js"></script>
<script src="app.js"></script>
</body>
</html>
