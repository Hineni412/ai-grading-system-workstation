<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>知识与训练改版 · 原型（演示 · 合成数据）</title>
<!--
  ============================================================
  一次性原型（throwaway prototype），2026-10-03
  用途：演示"知识与训练"前两个页签的改版方向——
  · 学情总览改为"行动页"：KPI → 本周建议优先处理 → 需要个别关注的学生；
  · 知识结构改为"地图页"：整卷热力图 + 知识点/技能关联连线 + 右侧抽屉；
  · 两页共用同一条范围条与同一口径，数字一致；往届内容单列不计入本册。
  不调用模型、不产生费用、不连接真实接口；全部为种子固定的合成数据。
  "原型控制"角标可切换班级范围、空状态与读取失败。
  尚未实现到正式应用的内容：真实数据接入与口径对齐、范围条在应用顶栏
  的落位、"出训练卷/看错题/进入学生作答证据"等跳转、抽屉内完整证据、
  导出与打印、以及性能与分页。
  ============================================================
-->
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="views.css">
</head>
<body>

<div class="app">
  <aside class="side">
    <div class="brand"><div class="mark">知</div><div><b>知衡</b><span>教师教学工作台</span></div></div>
    <div class="examcard">
      <div class="el">当前考试</div>
      <div class="en">第四周学情反馈</div>
      <div class="es">八年级上册 · 9 月 20 日 · 已完成</div>
    </div>
    <nav class="navgrp">
      <div class="gl">考试与阅卷</div>
      <a href="#">考试配置</a><a href="#">考试批改</a><a href="#">成绩中心</a>
      <div class="gl">题库与组卷</div>
      <a href="#">题库管理</a><a href="#">组卷工作台</a><a href="#">命题练习</a>
      <div class="gl">教学分析</div>
      <a href="#" class="on">知识与训练</a><a href="#">任务中心</a>
    </nav>
    <div class="sidelow"><a href="#">设置</a></div>
    <div class="sidever">v1.5.0 · 原型演示</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <h1>知识与训练</h1>
      <span class="proto">原型演示 · 合成数据</span>
      <span class="meta">学期掌握度 · 知识点与技能并列</span>
      <div class="sp"></div>
      <nav class="tabs" id="tabs">
        <button data-v="overview" class="on">学情总览</button>
        <button data-v="map">知识结构</button>
        <button data-dead>按章节训练</button>
        <button data-dead>按学生训练</button>
        <button data-dead>生成试卷</button>
      </nav>
    </header>

    <div class="page">
      <div class="wrap">
        <!-- 共享范围条：两个视图同一条、同一位置 -->
        <div class="scopebar" id="scopebar">
          <span class="volid">八年级上册</span>
          <span class="evid">本学期 3 场考试 + 已发布训练</span>
          <span class="sep"></span>
          <button class="scp on" data-s="all">全部学生</button>
          <button class="scp" data-s="9班">9班</button>
          <button class="scp" data-s="10班">10班</button>
          <span class="tail"><a class="link" id="scopeDef">口径说明</a></span>
        </div>

        <!-- 视图一：学情总览 -->
        <section id="v-overview" class="view on"></section>

        <!-- 视图二：知识结构 -->
        <section id="v-map" class="view">
          <div class="maptoolbar">
            <span id="filterChips">
              <button class="fchip on" data-f="all">全部</button>
              <button class="fchip" data-f="skill">只看技能</button>
              <button class="fchip" data-f="topic">只看知识点</button>
              <button class="fchip" data-f="weak">只看有学生明显薄弱</button>
            </span>
            <span class="legend" id="legend"></span>
          </div>
          <div id="mapHeat"></div>
        </section>

        <!-- 空态 / 错误态 -->
        <section id="v-state" class="view"></section>
      </div>
    </div>
  </div>
</div>

<!-- 原型控制：默认收起为角标，点击展开 -->
<div id="protoCtl">
  <div id="pcBody">
    <div class="pc-t">原型控制 · 仅演示，不影响数据</div>
    <label>班级范围
      <select id="ctlCls">
        <option value="all">全部学生</option><option value="9班">9班</option><option value="10班">10班</option>
      </select>
    </label>
    <label><input type="radio" name="ctlstate" value="ok" checked> 正常数据</label>
    <label><input type="radio" name="ctlstate" value="empty"> 无教学学期（空态）</label>
    <label><input type="radio" name="ctlstate" value="error"> 读取失败</label>
    <div class="pc-n">班级范围与顶部范围条同步；空态/失败替换两个视图内容。</div>
  </div>
  <button id="pcToggle" type="button">原型控制</button>
</div>

<div id="drawerWrap"><div class="mask" id="drawerMask"></div><aside class="drawer" id="drawer"></aside></div>
<div class="tooltip" id="tip"></div>
<div id="toast"></div>

<script src="data.js"></script>
<script src="app.js"></script>
<script src="overview.js"></script>
<script src="map.js"></script>
</body>
</html>
