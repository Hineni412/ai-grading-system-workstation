<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>原型 · 教研提升 · 命题训练</title>
<link rel="stylesheet" href="../paper-review-prototype-20261011/style.css">
<link rel="stylesheet" href="exam-design.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">阅</span>
      <span class="brand-copy"><strong>AI 阅卷</strong><small>工作机版</small></span>
    </div>
    <nav class="nav">
      <a class="nav-link" href="javascript:void(0)"><i>⌂</i><span>工作台</span></a>
      <div class="nav-group">
        <p>考试与阅卷</p>
        <a class="nav-link" href="javascript:void(0)"><i>▦</i><span>考试配置</span></a>
        <a class="nav-link" href="javascript:void(0)"><i>✎</i><span>考试批改</span></a>
        <a class="nav-link" href="javascript:void(0)"><i>▤</i><span>成绩中心</span></a>
      </div>
      <div class="nav-group">
        <p>题库与组卷</p>
        <a class="nav-link" href="javascript:void(0)"><i>▣</i><span>题库管理</span></a>
        <a class="nav-link" href="javascript:void(0)"><i>⧉</i><span>组卷工作台</span></a>
      </div>
      <div class="nav-group">
        <p>教学分析</p>
        <a class="nav-link" href="javascript:void(0)"><i>◈</i><span>知识与训练</span></a>
        <a class="nav-link active" aria-current="page" href="javascript:void(0)"><i>✦</i><span>教研提升</span></a>
      </div>
    </nav>
  </aside>

  <div class="main">
    <header class="page-head">
      <h1>教研提升</h1>
      <div class="subtabs">
        <a class="subtab" href="../paper-review-prototype-20261011/index.html">试卷评价</a>
        <button class="subtab on">命题训练</button>
      </div>
      <span class="proto-badge">原型 · 真实数据汇总 · 不含学生姓名</span>
    </header>

    <div class="toolbar">
      <label class="tool-field">卷子
        <select id="paper-select"></select>
      </label>
      <span class="tool-field">班级
        <span class="seg" id="class-seg"></span>
      </span>
      <span class="tool-hint">班级只影响①中显示的系统预估与实际得分率；②③ 按全场口径。</span>
    </div>

    <div class="steps" id="steps">
      <button class="step" data-step="1"><b>①</b> 考前预评</button>
      <button class="step" data-step="2"><b>②</b> 我的预测</button>
      <button class="step" data-step="3"><b>③</b> 考后对照</button>
      <span class="step-hint" id="step-hint"></span>
    </div>

    <main class="content" id="content">
      <div id="app-root"></div>
    </main>
  </div>
</div>

<script src="../../../tmp_exam_design_prototype/data.js"></script>
<script src="render-preview.js"></script>
<script src="render-items.js"></script>
<script src="render-predict.js"></script>
<script src="render-compare.js"></script>
<script src="app-core.js"></script>
</body>
</html>
