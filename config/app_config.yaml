# ═══════════════════════════════════════════════════
# AI 阅卷系统 — 数据目录配置
# ═══════════════════════════════════════════════════
#
# DATA_DIR: 所有用户数据的根目录
#   - 支持相对路径（相对于项目根目录）或绝对路径
#   - 例如: user_data          → 项目根/user_data/
#   - 例如: D:\教学数据\AI阅卷  → 绝对路径
#   - 默认值: user_data
DATA_DIR: user_data

# LOGS_DIR: 日志文件目录
#   - 支持相对路径或绝对路径
#   - 默认值: logs
LOGS_DIR: logs

# 系统版本号（显示在系统自检页面）
VERSION: "v1.4.0-RC"
