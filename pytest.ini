[pytest]
testpaths =
    tests
tmp_path_retention_policy = failed
tmp_path_retention_count = 0
norecursedirs =
    .git
    .test-runs
    .worktrees
    .venv
    __pycache__
    backups
    build
    dist
    dist_smoke_test
    logs
    node_modules
    runtime
    scratch
    user_data
markers =
    acceptance_quick: high-value daily acceptance sentinel
    acceptance_serial: process-global or Windows resource test kept in the serial lane
    release_audit: frozen phase, packaging, or performance evidence test
