<body>

  <header class="topbar">

    function paperCards(){const rows=visiblePapers();if(!rows.length)return '<div class="empty">没有找到符合条件的试卷。</div>';return `<div class="paper-grid">${rows.map(p=>`<article class="paper-card"><h3>${esc(p.title)}</h3><div class="paper-meta"><span>${p.grade}</span><span>${p.year||'年份未填'} ${p.semester||'学期未填'}</span><span>${p.count} 题</span></div><div class="paper-actions"><button class="btn small">查看试题</button><button class="btn small" data-action="move" data-id="${p.id}">移动归类</button></div></article>`).join('')}</div>`;}

    function purposeTable(){return `<table class="purpose-table"><thead><tr><th>老师要完成的工作</th><th>当前模型</th><th>没有单独设置时</th></tr></thead><tbody>${modelRows.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td class="muted">${r[2]}</td></tr>`).join('')}</tbody></table>`;}
    function scopes(){return `<div class="scope-grid"><section class="scope yes"><h3>本次会备份</h3><ul>${backupYes.map(x=>`<li>${x}</li>`).join('')}</ul></section><section class="scope no"><h3>本次不会备份</h3><ul>${backupNo.map(x=>`<li>${x}</li>`).join('')}</ul></section></div>`;}
    function settingsContentA(){if(state.settingsTab==='backup')return `<h2>先看清范围，再开始备份</h2><p class="muted">这里展示的是当前系统的真实备份规则；原型按钮不会生成文件。</p>${scopes()}<div class="note" style="margin-top:13px">当前班主任工作台处于未加密调试模式，其数据会进入普通备份；API 密钥不会进入。</div><p style="margin-top:14px"><button class="btn primary" data-action="backup">预览本次备份清单</button></p>`;if(state.settingsTab==='check')return `<h2>检查与维护</h2><table class="purpose-table"><tr><td><b>系统运行</b></td><td style="color:var(--ok)">正常</td><td>无需处理</td></tr><tr><td><b>AI 服务</b></td><td style="color:var(--ok)">连接正常</td><td>上次检查：今天</td></tr><tr><td><b>最近备份</b></td><td style="color:var(--warn)">3 天前</td><td><button class="btn small" data-action="backup">查看备份</button></td></tr></table><details class="inline"><summary>高级维护与问题排查</summary><p class="note">迁移、恢复、导入导出和原始响应放在这里；执行前仍需逐次确认。</p></details>`;return `<h2>先看用途，再决定要不要修改</h2><p class="muted">日常只需核对下面五项。服务地址、密钥和速度设置收在高级区域。</p>${purposeTable()}<details class="inline"><summary>高级：主服务与高级任务服务</summary><p>主服务负责识别和批改；可选的高级任务服务负责评分依据、题库分析、备课和班主任。没有单独设置时按表格中的顺序回退。</p><p><button class="btn">修改服务地址与密钥</button> <button class="btn">连接检查</button></p></details>`;}
    function classDestination(){if(!state.destination)return '';return `<section class="panel route-result"><span class="eyebrow">模拟到达</span><h2>${esc(state.destination[1])}</h2><p>由“${esc(state.destination[0])}”进入。正式页面会保留当前领域提示，不创建重复模块。</p><button class="btn" data-action="back-domains">返回六个入口</button></section>`;}
    function conversationDesk(){return `<section class="conversation-demo panel"><header class="conversation-head"><div><span class="eyebrow">班主任案头</span><h2>先把事情说清楚，再决定怎么处理</h2></div><div class="tools"><button class="btn">当前班级：九年级 2 班</button><button class="btn">新对话</button></div></header><div class="conversation-body"><article class="conversation-main"><div class="opening-copy"><p>直接输入今天需要处理的班务即可，不必先选分类。<br><small>系统只负责整理和起草，正式记录与处置仍由你确认。</small></p></div><div class="composer-demo"><label>继续说明或补充</label><textarea placeholder="例如：月底提醒我复查；已确认双方目前都安全"></textarea><div class="composer-actions"><small class="muted">发送后进入已配置的班主任模型。</small><button class="btn primary" data-action="send-chat">发送并整理</button></div></div></article><aside class="conversation-side"><section><strong>今日与接下来</strong><small class="muted">家长会材料 · 明天</small></section><section><strong>待核对 · 2</strong><small class="muted">草稿确认后才会正式保存</small></section><section><strong>最近会话</strong><small class="muted">运动会值班安排</small></section></aside></div></section>`;}
    function domainCards(){return `<section class="panel" style="padding:18px"><div class="section-head" style="margin-top:0"><div><span class="eyebrow">常用入口</span><h2>选择要进入的工作区</h2></div><span class="muted">对话区完整保留在上方</span></div><div class="domain-grid">${domains.map(d=>`<button class="domain-card" data-action="domain" data-name="${d[0]}" data-target="${d[1]}"><span class="eyebrow">进入 ${d[1]}</span><h2>${d[0]}</h2><p>${d[2]}</p><b>打开 →</b></button>`).join('')}</div></section>`;}
    function selectedScopeKeys(){return Object.keys(backupGroups).filter(key=>state.backupScopes[key]);}

    function siteOptions(selected){return state.apiSites.map(site=>`<option value="${site.id}" ${site.id===selected?'selected':''}>${esc(site.name)}</option>`).join('');}
    function selectedSettings(){const selected=selectedScopeKeys();return head('已选组合 · C 型设置中心','多个 API 站点、四类任务模型、三类数据可选备份','站点与任务分开管理；同一站点可以承担多类任务。','<span class="pill">紧凑总览</span>')+`<div class="c-console"><aside class="c-left"><h2>设置中心</h2><button class="active">总览</button><button>API 站点</button><button>任务模型</button><button>备份与恢复</button><button>检查与维护</button><div class="note" style="margin-top:18px">API 密钥永远不会进入普通备份。</div></aside><section class="c-center"><section class="console-section"><div class="console-title"><div><h2>API 站点</h2><p class="muted">每个站点保存自己的 Base URL 和 API Key。</p></div><button class="btn small primary" data-action="new-site">新增站点</button></div><table class="dense-table"><thead><tr><th>站点</th><th>Base URL</th><th>API Key</th><th></th></tr></thead><tbody>${state.apiSites.map(site=>`<tr><td><span class="site-name"><i class="site-dot"></i><b>${esc(site.name)}</b></span></td><td><div class="site-url">${esc(site.baseUrl)}</div></td><td>${site.keyState}</td><td><button class="btn small" data-action="edit-site" data-site="${site.id}">修改</button></td></tr>`).join('')}</tbody></table></section><section class="console-section"><div class="console-title"><div><h2>四类任务使用哪个站点和模型</h2><p class="muted">不再单独出现“OCR 模型”。姓名识别和批改共用一套视觉模型。</p></div></div><table class="dense-table"><thead><tr><th>任务</th><th>API 站点</th><th>模型名称</th></tr></thead><tbody>${state.taskRoutes.map(route=>`<tr><td><b>${route.label}</b>${route.id==='grading'?'<br><small class="muted">姓名先本机识别；模型兜底可批量合并姓名框</small>':''}</td><td><select class="route-select" data-task-site="${route.id}">${siteOptions(route.siteId)}</select></td><td><input class="model-input" data-task-model="${route.id}" value="${esc(route.model)}"></td></tr>`).join('')}</tbody></table><p style="margin-top:10px"><button class="btn small" data-action="name-batch-detail">查看姓名批量识别方案</button></p></section><section class="console-section"><div class="console-title"><div><h2>这次备份哪些数据</h2><p class="muted">可以任意组合；备份记录会永久标明包含了哪几块。</p></div><span class="pill">已选 ${selected.length}/3</span></div>${backupOptionCards()}</section></section><aside class="c-right"><span class="eyebrow">当前设置</span><div class="c-stat"><strong>${state.apiSites.length}</strong><small>个 API 站点</small></div><div class="c-stat"><strong>4</strong><small>类任务独立绑定</small></div><div class="c-stat"><span class="scope-total">${selected.length}</span><small>类数据将进入备份</small></div><button class="btn primary" style="width:100%;margin-top:14px" data-action="backup-selected" ${selected.length?'':'disabled'}>预览并开始备份</button><p class="muted" style="margin-top:10px">恢复时先显示该备份包含的三类范围；本轮只设计选择备份，不假设可以拆分恢复。</p><details class="inline"><summary>高级问题排查</summary><p class="muted">连接诊断、调用速度、原始响应、迁移和导入导出。</p></details></aside></div>`;}

    function VariantA(screen){
      if(screen==='bank')return head('方案 A · 教师工作台','试卷按学期收好，自己需要的再归类','最近学期和自定义文件夹始终在左边。','<button class="btn primary" data-action="new-folder">新建文件夹</button>')+`<div class="a-layout"><aside class="a-rail panel"><div class="rail-title"><h2>试卷文件夹</h2><span class="pill">${state.papers.length} 份</span></div>${folderButtons()}<button class="btn small" style="width:100%;margin-top:12px" data-action="new-folder">＋ 新建文件夹</button></aside><section class="a-main panel"><div class="tools"><input class="search" data-search value="${esc(state.search)}" placeholder="搜索全部试卷"/><button class="btn">最近更新</button></div><div class="note" style="margin-top:12px">移动到自定义文件夹后，试卷只在新位置出现；删除文件夹会回到原学期。</div><div class="section-head"><h2>${state.folder==='all'?'全部试卷':esc(state.folder.replace(/^auto:|^custom:/,''))}</h2><span class="pill">${visiblePapers().length} 份</span></div>${paperCards()}</section></div>`;

      return head('方案 A · 合并设置中心','一个入口说清 AI 和数据保护','日常信息在前，高级技术参数在后。','<span class="pill">系统运行正常</span>')+`<div class="settings-a"><aside class="settings-menu panel"><button class="${state.settingsTab==='ai'?'active':''}" data-action="settings" data-tab="ai">AI 服务</button><button class="${state.settingsTab==='backup'?'active':''}" data-action="settings" data-tab="backup">备份与恢复</button><button class="${state.settingsTab==='check'?'active':''}" data-action="settings" data-tab="check">检查与维护</button></aside><section class="settings-content panel">${settingsContentA()}</section></div>`;

        const auto=folderCounts();
        const focused=state.folder!=='all'||Boolean(state.search.trim());
        const focusedRows=visiblePapers();
        const focusedTitle=state.search.trim()?`搜索“${esc(state.search.trim())}”`:esc(state.folder.replace(/^auto:|^custom:/,''));
        const grouped=Object.entries(auto).map(([name,count],i)=>`<div class="flow-row"><div class="flow-label">${i?'旧学期':'当前学期'}</div><div class="flow-main"><details ${i?'':'open'}><summary><b>${esc(name)}</b> · ${count} 份</summary>${state.papers.filter(p=>!p.folder&&autoKey(p)===name).map(p=>`<div class="paper-line"><span>${esc(p.title)} <small class="muted">${p.count} 题</small></span><button class="btn small" data-action="move" data-id="${p.id}">移动归类</button></div>`).join('')}</details></div><div class="flow-actions"><button class="btn small" data-action="folder" data-folder="auto:${esc(name)}">只看这里</button></div></div>`).join('');

        return head('方案 B · 老师任务清单','按“正在做什么”展开试卷','不用一直看文件夹树，旧学期默认收起。','<button class="btn primary" data-action="new-folder">新建我的归类</button>')+`<section class="b-board"><div class="b-toolbar"><input class="search" data-search value="${esc(state.search)}" placeholder="搜索全部学期和自定义文件夹"><span class="muted">搜索后只显示命中结果</span></div>${focused?focusedList:grouped}<div class="flow-row"><div class="flow-label">我的归类</div><div class="flow-main"><div class="chip-row">${state.customFolders.map(f=>`<button class="route-chip" data-action="folder" data-folder="custom:${esc(f)}">${esc(f)} · ${state.papers.filter(p=>p.folder===f).length}</button>`).join('')}</div><p class="muted" style="margin:9px 0 0">自定义归类中的试卷不在学期分组重复出现。</p></div><div class="flow-actions"><button class="btn small" data-action="new-folder">管理</button></div></div></section>`;
      }
      if(screen==='assembly')return head('方案 B · 一条选题清单','目录慢，不耽误先看到题','筛选条件在上方逐步补齐，知识点只显示末级名称。','<button class="btn" data-action="replay">重放加载顺序</button>')+`<section class="b-board"><div class="b-toolbar">${loadingStory()}<span class="pill">已选 ${state.basket} 题</span></div>${knowledge.slice(0,2).map((k,i)=>`<div class="flow-row"><div class="flow-label">第 ${i?14:6} 题</div><div class="flow-main"><h3>${i?'数轴上点 A 表示 −3，点 B 与 A 的距离为 5……':'下列各数中，绝对值最小的是（　）。'}</h3><div class="chip-row">${leafTag(k)}${i?'':leafTag(knowledge[2])}</div></div><div class="flow-actions"><button class="btn small primary" data-action="add">加入试卷</button></div></div>`).join('')}</section>`;
      if(screen==='class')return head('方案 B · 先选要完成的事','六个场景，三个明确去处','每一行先说明老师的目标，再提供入口。')+(state.destination?classDestination():`<section class="b-board"><div class="flow-row"><div class="flow-label">了解与支持学生</div><div class="flow-main"><h2>成长记录 · 学生支持</h2><p>进入学生工作区，再选择具体学生和对应面板。</p><div class="chip-row">${domains.slice(0,2).map(d=>`<button class="route-chip" data-action="domain" data-name="${d[0]}" data-target="${d[1]}">${d[0]}</button>`).join('')}</div></div><div class="flow-actions"><span class="pill">学生</span></div></div><div class="flow-row"><div class="flow-label">处理具体事务</div><div class="flow-main"><h2>冲突安全 · 学校协同</h2><p>进入事务工作区，保留事实记录和教师确认边界。</p><div class="chip-row">${[domains[2],domains[5]].map(d=>`<button class="route-chip" data-action="domain" data-name="${d[0]}" data-target="${d[1]}">${d[0]}</button>`).join('')}</div></div><div class="flow-actions"><span class="pill">事务</span></div></div><div class="flow-row"><div class="flow-label">安排班级工作</div><div class="flow-main"><h2>班级日常 · 活动文化</h2><p>进入日历与计划，按所选领域带入提示。</p><div class="chip-row">${domains.slice(3,5).map(d=>`<button class="route-chip" data-action="domain" data-name="${d[0]}" data-target="${d[1]}">${d[0]}</button>`).join('')}</div></div><div class="flow-actions"><span class="pill">日历</span></div></div></section>`);
      return head('方案 B · 老师问题清单','设置中心只回答四个问题','想改哪里就展开哪里，不必先理解技术架构。','<span class="pill">数据保护正常</span>')+`<section class="b-board"><div class="flow-row"><div class="flow-label">AI 用谁来做？</div><div class="flow-main"><h2>按用途核对当前模型</h2>${purposeTable()}<details class="inline"><summary>服务地址、密钥和调用速度</summary><p>仅在更换服务商或排查连接时打开。</p></details></div><div class="flow-actions"><button class="btn small">修改</button></div></div><div class="flow-row"><div class="flow-label">备份保护什么？</div><div class="flow-main"><h2>考试、题库和当前班主任数据会进入</h2><p>API 密钥、日志和备课资料库不会进入。</p><details class="inline"><summary>查看完整范围</summary>${scopes()}</details></div><div class="flow-actions"><button class="btn small primary" data-action="backup">查看清单</button></div></div><div class="flow-row"><div class="flow-label">怎样恢复？</div><div class="flow-main"><h2>先选备份，再看影响，最后确认</h2><p>恢复、迁移、导入都需要重启或改变数据，仍会逐次请求授权。</p></div><div class="flow-actions"><button class="btn small danger">恢复说明</button></div></div><div class="flow-row"><div class="flow-label">哪里有问题？</div><div class="flow-main"><h2>平时只显示“正常 / 需处理”</h2><p>原始请求、响应和数据库路径放在高级问题排查中。</p></div><div class="flow-actions"><button class="btn small">查看状态</button></div></div></section>`;
    }

    function VariantC(screen){
      if(screen==='bank')return head('方案 C · 高密度控制台','文件夹、试卷和详情同时在场','适合熟悉系统后快速整理。','<button class="btn primary" data-action="new-folder">新建文件夹</button>')+`<div class="c-console"><aside class="c-left"><h2>文件夹</h2>${folderButtons()}</aside><section class="c-center"><div class="tools"><input class="search" data-search value="${esc(state.search)}" placeholder="搜索试卷"><span class="pill">${visiblePapers().length} 份</span></div><table class="dense-table" style="margin-top:12px"><thead><tr><th>试卷</th><th>位置</th><th>题量</th><th></th></tr></thead><tbody>${visiblePapers().map(p=>`<tr><td><b>${esc(p.title)}</b><br><small class="muted">${p.grade}</small></td><td>${esc(p.folder||autoKey(p))}</td><td>${p.count}</td><td><button class="btn small" data-action="move" data-id="${p.id}">移动</button></td></tr>`).join('')}</tbody></table></section><aside class="c-right"><span class="eyebrow">归类规则</span><h2>只显示一次</h2><p class="muted">自定义文件夹优先；没有自定义归类时才显示在学期中。</p><div class="c-stat"><strong>${state.customFolders.length}</strong><small>我的文件夹</small></div><div class="c-stat"><strong>${state.papers.filter(p=>p.folder).length}</strong><small>已人工归类</small></div><button class="btn danger small" style="margin-top:14px" data-action="delete-folder">删除“下周要讲”</button></aside></div>`;
      if(screen==='assembly')return head('方案 C · 选题控制台','题目先到，完整路径放在右侧核对','列表保持短，路径不会丢。','<button class="btn" data-action="replay">重放加载顺序</button>')+`<div class="c-console"><aside class="c-left"><h2>教材目录</h2><button class="active">七年级上册</button><button>第二章 有理数</button><button>2 数轴</button><button>3 绝对值</button></aside><section class="c-center"><table class="dense-table"><thead><tr><th>题号</th><th>题目</th><th>末级知识点</th><th></th></tr></thead><tbody>${knowledge.slice(0,2).map((k,i)=>`<tr><td>${i?14:6}</td><td>${i?'数轴上 A、B 两点的距离……':'下列各数中绝对值最小的是……'}</td><td>${leafTag(k)}</td><td><button class="btn small primary" data-action="add">加入</button></td></tr>`).join('')}</tbody></table></section><aside class="c-right"><span class="eyebrow">读取状态</span>${loadingStory()}<div class="c-stat"><strong>${state.basket}</strong><small>已选题目</small></div><div class="selection" style="margin-top:13px"><b>完整知识位置</b><p class="path">${esc(state.selectedPath)}</p></div></aside></div>`;
      if(screen==='class')return head('方案 C · 路由控制台','场景在左，实际工作面在中间','右侧持续说明 AI 与教师的责任边界。')+(state.destination?classDestination():`<div class="c-console"><aside class="c-left route-matrix"><h2>班务场景</h2>${domains.map(d=>`<button data-action="domain" data-name="${d[0]}" data-target="${d[1]}">${d[0]}</button>`).join('')}</aside><section class="c-center"><h2>场景与现有页面对应</h2><table class="dense-table"><thead><tr><th>场景</th><th>进入页面</th></tr></thead><tbody>${domains.map(d=>`<tr><td>${d[0]}</td><td><b>${d[1]}</b></td></tr>`).join('')}</tbody></table></section><aside class="c-right"><span class="eyebrow">不变的边界</span><h2>教师做最终决定</h2><p class="muted">AI 不作诊断、欺凌认定、惩戒决定、紧急裁决、自动外发或自动结案。</p><div class="note">紧急风险先人工处理，不等待 AI。</div></aside></div>`);
      return head('方案 C · 一屏总览','模型安排和数据保护并排核对','最少跳转，但信息密度最高。','<button class="btn">高级技术设置</button>')+`<div class="c-console"><aside class="c-left"><h2>设置中心</h2><button class="active">总览</button><button>AI 服务</button><button>备份与恢复</button><button>检查与维护</button></aside><section class="c-center"><div class="console-section"><h2>AI 用途</h2>${purposeTable()}</div><div class="console-section"><h2>备份范围</h2>${scopes()}</div></section><aside class="c-right"><span class="eyebrow">保护状态</span><div class="c-stat"><strong>正常</strong><small>系统自检</small></div><div class="c-stat"><strong>3 天前</strong><small>最近完整备份</small></div><button class="btn primary" style="width:100%;margin-top:14px" data-action="backup">查看本次备份清单</button><details class="inline"><summary>高级问题排查</summary><p class="muted">连接诊断、原始响应、迁移和导入导出。</p></details></aside></div>`;
    }
    function selectedAssembly(){return head('已选组合 · 保持现有组卷布局','页面结构不改，只修速度和知识点文字','题目先显示；目录统计后台补齐；知识点只显示最细节点。','<button class="btn" data-action="replay">模拟优化后的加载顺序</button>')+`<div class="note" style="margin-bottom:12px"><b>这不是组卷页面改版：</b>筛选区、题目列表和试卷篮继续保持现有位置。</div>${loadingStory()}<div class="assembly-a" style="margin-top:12px"><aside class="filter-panel panel"><span class="eyebrow">现有筛选区</span><h2>教材目录</h2><div class="tree"><button class="active">七年级上册</button><button>第四章 三角形</button><button>3 探索三角形全等的条件</button></div><h3 style="margin-top:14px">知识点</h3>${knowledge.map(leafTag).join(' ')}</aside><section class="question-list panel">${questionsAsCards()}</section><aside class="basket panel"><span class="eyebrow">现有试卷篮</span><div class="basket-number">${state.basket}</div><p class="muted">已选题目</p><button class="btn primary" style="width:100%">进入编辑</button></aside></div>`;}
    function VariantD(screen){
      if(screen==='bank')return VariantA('bank').replace('方案 A · 教师工作台','已选组合 · 题库采用 A');
      if(screen==='assembly')return selectedAssembly();
      if(screen==='class')return head('已选组合 · 班主任采用 A','完整对话区保留，下方卡片全部可点击','不会删除你的对话框、输入区、今日事项或最近会话。')+(state.destination?classDestination():conversationDesk()+domainCards());
      return selectedSettings();
    }
    function render(){
      const html=state.variant==='A'?VariantA(state.screen):state.variant==='B'?VariantB(state.screen):state.variant==='C'?VariantC(state.screen):VariantD(state.screen);document.querySelector('#app').innerHTML=`<section class="surface active">${html}</section>`;
      document.querySelectorAll('[data-screen]').forEach(b=>b.classList.toggle('active',b.dataset.screen===state.screen));document.querySelector('.variant-label').textContent=`${state.variant} — ${variants[state.variant]}`;
      document.querySelector('#state-output').textContent=JSON.stringify({方案:state.variant,页面:state.screen,当前文件夹:state.folder,搜索:state.search||'无',自定义文件夹:state.customFolders,试卷归类:Object.fromEntries(state.papers.map(p=>[p.title,p.folder||autoKey(p)])),组卷篮:state.basket,知识点完整位置:state.selectedPath,班主任到达:state.destination?.[1]||'尚未选择',API站点:state.apiSites.map(site=>site.name),任务绑定:Object.fromEntries(state.taskRoutes.map(route=>[route.label,{站点:state.apiSites.find(site=>site.id===route.siteId)?.name,模型:route.model}])),备份选择:selectedScopeKeys().map(key=>backupGroups[key].label)},null,2);urlSync();
    }
    function openDialog(type,paperId){
      const box=document.querySelector('#dialog'),content=document.querySelector('#dialog-content');box.classList.add('show');
      if(type==='folder'){content.innerHTML=`<span class="eyebrow">模拟操作</span><h2 id="dialog-title">新建自定义文件夹</h2><p class="muted">只建立一层文件夹，不复制试卷。</p><label>文件夹名称<input id="folder-name" value="下周复习"></label><div class="dialog-actions"><button class="btn" data-action="close">取消</button><button class="btn primary" data-action="save-folder">创建</button></div>`;setTimeout(()=>document.querySelector('#folder-name')?.focus(),0);}
      if(type==='move'){const paper=state.papers.find(p=>p.id===paperId);content.innerHTML=`<span class="eyebrow">模拟操作</span><h2 id="dialog-title">移动“${esc(paper.title)}”</h2><p class="muted">移动后只在新位置显示。选择“按学期自动归类”可放回原学期。</p><input type="hidden" id="move-id" value="${paper.id}"><label>目标位置<select id="move-target"><option value="">按学期自动归类</option>${state.customFolders.map(f=>`<option ${paper.folder===f?'selected':''}>${esc(f)}</option>`).join('')}</select></label><div class="dialog-actions"><button class="btn" data-action="close">取消</button><button class="btn primary" data-action="save-move">确认移动</button></div>`;}
      if(type==='backup'){content.innerHTML=`<span class="eyebrow">备份前预检</span><h2 id="dialog-title">确认这次备份的范围</h2>${scopes()}<div class="note" style="margin-top:12px">原型不会创建备份。正式执行前仍会显示保存位置和失败影响。</div><div class="dialog-actions"><button class="btn" data-action="close">关闭</button><button class="btn primary" data-action="fake-backup">我已看懂，模拟继续</button></div>`;}
      if(type==='backup-selected'){const keys=selectedScopeKeys();content.innerHTML=`<span class="eyebrow">备份前预检</span><h2 id="dialog-title">这次将备份 ${keys.length} 类数据</h2><div class="backup-options">${keys.map(key=>{const item=backupGroups[key];return `<section class="scope-option selected"><strong>✓ ${item.label}</strong><small>${item.detail}</small><span class="pill" style="margin-top:8px">${item.size}</span></section>`}).join('')}</div><div class="note" style="margin-top:12px">不包含 API 密钥和普通日志。恢复时会再次显示此范围；本原型不会创建任何文件。</div><div class="dialog-actions"><button class="btn" data-action="close">返回修改</button><button class="btn primary" data-action="fake-backup">范围正确，模拟开始</button></div>`;}
      if(type==='site'){const site=state.apiSites.find(item=>item.id===paperId);content.innerHTML=`<span class="eyebrow">${site?'修改':'新增'} API 站点</span><h2 id="dialog-title">一个站点保存一组连接信息</h2><p class="muted">保存站点后，再在任务表中选择由哪个站点承担工作。</p><input type="hidden" id="site-id" value="${site?.id||''}"><label>站点名称<input id="site-name" value="${esc(site?.name||'备用站点 D')}"></label><label>Base URL<input id="site-url" value="${esc(site?.baseUrl||'https://api-d.example.com/v1')}"></label><label>API Key<input id="site-key" type="password" value="" placeholder="${site?'留空表示保持现有密钥':'输入新站点密钥'}"></label><div class="dialog-actions"><button class="btn" data-action="close">取消</button><button class="btn primary" data-action="save-site">保存站点</button></div>`;setTimeout(()=>document.querySelector('#site-name')?.focus(),0);}
      if(type==='name-batch'){content.innerHTML=`<span class="eyebrow">姓名识别提速方案</span><h2 id="dialog-title">只把需要模型兜底的姓名框合并请求</h2><ol><li>每份答卷先按模板裁切姓名框，并优先使用本机文字识别。</li><li>本机无法可靠匹配名单的姓名框，按 8～12 个组成一张带编号拼图。</li><li>调用“识别姓名与批改试卷”所绑定的站点和模型，一次返回编号对应的 JSON 姓名。</li><li>逐项和学生名单核对；缺项、重名或低可信结果进入人工核对，不自动认领。</li><li>整批失败时先拆成小批；仍失败才退回单张请求，不自动重复产生费用。</li></ol><div class="note">这样减少的是模型兜底请求数量。本机已经识别成功的姓名不会再发送给模型。</div><div class="dialog-actions"><button class="btn primary" data-action="close">看懂了</button></div>`;}
    }
    document.addEventListener('click',e=>{
      const screen=e.target.closest('[data-screen]');if(screen){state.screen=screen.dataset.screen;state.destination=null;render();return;}
      const cycle=e.target.closest('[data-cycle]');if(cycle){const keys=Object.keys(variants),i=keys.indexOf(state.variant);state.variant=keys[(i+Number(cycle.dataset.cycle)+keys.length)%keys.length];render();notify(`已切换到方案 ${state.variant}`);return;}
      const a=e.target.closest('[data-action]');if(!a)return;const action=a.dataset.action;
      if(action==='folder'){state.folder=a.dataset.folder;render();}
      if(action==='clear-bank-focus'){state.folder='all';state.search='';render();}
      if(action==='new-folder')openDialog('folder');
      if(action==='move')openDialog('move',a.dataset.id);
      if(action==='new-site')openDialog('site');
      if(action==='edit-site')openDialog('site',a.dataset.site);
      if(action==='close')document.querySelector('#dialog').classList.remove('show');
      if(action==='save-folder'){const name=document.querySelector('#folder-name').value.trim();if(name&&!state.customFolders.includes(name)){state.customFolders.push(name);state.folder=`custom:${name}`;}document.querySelector('#dialog').classList.remove('show');render();notify(`已模拟创建“${name||'未命名文件夹'}”`);}
      if(action==='save-move'){const p=state.papers.find(x=>x.id===document.querySelector('#move-id').value);p.folder=document.querySelector('#move-target').value||null;document.querySelector('#dialog').classList.remove('show');render();notify(`已移动；这张试卷现在只显示在“${p.folder||autoKey(p)}”`);}
      if(action==='save-site'){const id=document.querySelector('#site-id').value||`site-${Date.now()}`;const existing=state.apiSites.find(site=>site.id===id);const next={id,name:document.querySelector('#site-name').value.trim()||'未命名站点',baseUrl:document.querySelector('#site-url').value.trim(),keyState:'密钥已保存',status:'正常'};if(existing)Object.assign(existing,next);else state.apiSites.push(next);document.querySelector('#dialog').classList.remove('show');render();notify(`已模拟保存“${next.name}”`);}
      if(action==='delete-folder'){const name='下周要讲';state.papers.forEach(p=>{if(p.folder===name)p.folder=null});state.customFolders=state.customFolders.filter(f=>f!==name);if(state.folder===`custom:${name}`)state.folder='all';render();notify('文件夹已模拟删除，里面的试卷已回到原学期');}
      if(action==='path'){state.selectedPath=a.dataset.path;render();notify('右侧已显示完整教材位置');}
      if(action==='add'){state.basket+=1;render();notify(`已模拟加入试卷，当前 ${state.basket} 题`);}
      if(action==='domain'){state.destination=[a.dataset.name,a.dataset.target];render();}
      if(action==='back-domains'){state.destination=null;render();}
      if(action==='settings'){state.settingsTab=a.dataset.tab;render();}
      if(action==='backup')openDialog('backup');
      if(action==='backup-selected')openDialog('backup-selected');
      if(action==='name-batch-detail')openDialog('name-batch');
      if(action==='send-chat')notify('已模拟发送；对话框和输入内容不会被卡片入口替代');
      if(action==='fake-backup'){document.querySelector('#dialog').classList.remove('show');notify('这是原型：没有读取数据，也没有创建备份');}
      if(action==='replay'){state.load={questions:'读取中',catalog:'等待中',facets:'等待中'};render();setTimeout(()=>{state.load.questions='已显示';render()},180);setTimeout(()=>{state.load.catalog='已补齐';render()},850);setTimeout(()=>{state.load.facets='已补齐';render();notify('题目先显示，目录与统计随后补齐')},1400);}
    });
    document.addEventListener('input',e=>{if(e.target.matches('[data-search]')){state.search=e.target.value;render();const next=document.querySelector('[data-search]');next.focus();next.setSelectionRange(next.value.length,next.value.length);}});
    document.addEventListener('change',e=>{
      if(e.target.matches('[data-backup-scope]')){state.backupScopes[e.target.dataset.backupScope]=e.target.checked;render();notify(`当前选择 ${selectedScopeKeys().length} 类备份数据`);}
      if(e.target.matches('[data-task-site]')){const route=state.taskRoutes.find(item=>item.id===e.target.dataset.taskSite);if(route)route.siteId=e.target.value;render();notify(`已修改“${route?.label}”使用的 API 站点`);}
      if(e.target.matches('[data-task-model]')){const route=state.taskRoutes.find(item=>item.id===e.target.dataset.taskModel);if(route)route.model=e.target.value.trim();render();notify(`已修改“${route?.label}”的模型名称`);}
    });
    document.querySelector('#dialog').addEventListener('click',e=>{if(e.target.id==='dialog')e.currentTarget.classList.remove('show');});
    document.addEventListener('keydown',e=>{const tag=e.target.tagName;if(['INPUT','TEXTAREA','SELECT'].includes(tag)||e.target.isContentEditable)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){const keys=Object.keys(variants),i=keys.indexOf(state.variant);state.variant=keys[(i+(e.key==='ArrowRight'?1:-1)+keys.length)%keys.length];render();}if(e.key==='Escape')document.querySelector('#dialog').classList.remove('show');});
    render();
  </script>
</body>
</html>
