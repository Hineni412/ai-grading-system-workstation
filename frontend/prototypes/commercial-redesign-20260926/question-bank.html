<style>
.main { display: flex; flex-direction: column; overflow: hidden; }
.qb { flex: 1; min-height: 0; display: grid; grid-template-columns: 240px minmax(0, 1fr) 420px; gap: 14px; padding: 14px 24px 18px; overflow: hidden; }
/* 左：筛选面 */
.qb-facets { overflow-y: auto; min-height: 0; }
.qb-facets .card { padding: 12px; }
.facet-head { display: flex; align-items: center; margin-bottom: 10px; }
.facet-head b { font-size: 13px; }
.facet-head button { margin-left: auto; font-size: 12px; color: var(--accent); }
.facet-sec { border-top: 1px solid var(--line-soft); padding: 10px 0 4px; }
.facet-sec:first-of-type { border-top: none; }
.facet-sec > h4 { margin: 0 0 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.05em; color: var(--ink-3); }
.facet-item { display: flex; align-items: center; gap: 7px; width: 100%; padding: 4px 4px; border-radius: 6px; font-size: 12.5px; color: var(--ink-2); text-align: left; }
.facet-item:hover { background: var(--surface-hover); color: var(--ink-1); }
.facet-item .n { margin-left: auto; font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.facet-item input[type="checkbox"] { accent-color: var(--accent); }
.facet-item .ic { width: 12px; height: 12px; color: var(--ink-3); }
.facet-sub { padding-left: 20px; }
/* 中：列表 */
.qb-mid { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.qb-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.qb-toolbar .count { margin-left: auto; font-size: 12px; color: var(--ink-3); }
.qb-rows { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 2px; }
.prow {
  position: relative; display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; gap: 4px 10px;
  align-items: center; padding: 9px 12px 9px 14px; cursor: pointer;
  transition: border-color var(--d-fast) ease, background var(--d-fast) ease, box-shadow var(--d-base) var(--ease-out);
}
.prow::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: transparent; }
.prow:hover { border-color: var(--line-strong); }
.prow.sel { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); background: var(--accent-subtle); }
.prow.sel::before { background: var(--accent); }
.prow__cb { opacity: 0; transition: opacity var(--d-fast) ease; }
.prow:hover .prow__cb, .prow.chk .prow__cb { opacity: 1; }
.prow__cb input { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }
.fmt { font-size: 10px; font-weight: 700; letter-spacing: 0.04em; padding: 2px 6px; border-radius: 4px; }
.fmt--doc { color: #2f6ea5; background: #e9f1f9; }
.fmt--pdf { color: #b04444; background: #faecec; }
.prow__main { min-width: 0; }
.prow__title { font-size: 13px; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow__meta { margin-top: 2px; font-size: 11.5px; color: var(--ink-3); display: flex; gap: 8px; align-items: center; }
.prow__meta span { white-space: nowrap; }
.prow__right { text-align: right; display: flex; flex-direction: column; gap: 5px; align-items: flex-end; }
.prow__tagline { font-size: 11px; color: var(--ink-2); display: flex; align-items: center; gap: 7px; }
.prow__tagline .bar { width: 64px; height: 4px; }
.prow__tagline .full { color: var(--st-done); font-weight: 550; }
.prow__qs { font-size: 11.5px; color: var(--ink-3); }
/* 右：预览 */
.qb-preview { overflow-y: auto; min-height: 0; }
.qb-preview .card { padding: 16px; }
.pv-title { font-size: 16px; font-weight: 650; line-height: 1.35; margin: 0; }
.pv-chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 12px; }
.pv-top { display: flex; align-items: center; gap: 14px; }
.pv-ring { position: relative; width: 56px; height: 56px; flex: none; }
.pv-ring svg { width: 56px; height: 56px; }
.pv-ring .track { fill: none; stroke: var(--line-soft); stroke-width: 5; }
.pv-ring .val { fill: none; stroke: var(--st-done); stroke-width: 5; stroke-linecap: round; transform: rotate(-90deg); transform-origin: center; }
.pv-ring span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; font-weight: 650; }
.pv-top .txt { font-size: 12px; color: var(--ink-2); line-height: 1.5; }
.pv-actions { display: flex; gap: 8px; margin: 14px 0; }
.pv-qh { display: flex; align-items: center; margin: 6px 0 8px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.pv-qh span { margin-left: auto; font-weight: 400; font-size: 11.5px; color: var(--ink-3); }
.qcard { border: 1px solid var(--line-soft); border-radius: 9px; padding: 9px 11px; margin-bottom: 8px; transition: border-color var(--d-fast) ease; }
.qcard:hover { border-color: var(--line-strong); }
.qcard__top { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
.qcard__no { font-size: 12px; font-weight: 650; }
.qcard__stem { font-size: 12.5px; line-height: 1.5; color: var(--ink-1); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.qcard__kps { display: flex; gap: 5px; margin-top: 7px; flex-wrap: wrap; }
.kp { font-size: 10.5px; padding: 1px 7px; border-radius: var(--r-pill); background: var(--surface-muted); border: 1px solid var(--line-soft); color: var(--ink-2); }
/* 批量条 */
.bulkbar {
  position: fixed; left: calc(50% + 112px); bottom: 20px; transform: translateX(-50%); z-index: 90;
  display: flex; align-items: center; gap: 6px; padding: 8px 10px;
  background: var(--ink-1); color: #fff; border-radius: 12px; box-shadow: var(--shadow-pop);
  animation: bulkIn 220ms var(--ease-drawer) both;
}
[data-theme="b"] .bulkbar {
  background: linear-gradient(135deg, #15323a, #0e2026);
  border: 1px solid rgba(47,185,198,0.35);
  box-shadow: 0 10px 28px -8px rgba(9,50,57,0.55);
}
.bulkbar .n { font-size: 13px; font-weight: 600; padding: 0 8px; white-space: nowrap; }
.bulkbar button { display: inline-flex; align-items: center; gap: 5px; padding: 6px 11px; border-radius: 8px; font-size: 12.5px; color: #dfe7ea; }
.bulkbar button:hover { background: rgba(255,255,255,0.10); color: #fff; }
.bulkbar button.danger:hover { background: rgba(224,121,121,0.18); color: #f0a9a9; }
.bulkbar[hidden] { display: none; }
.bulkbar .ic { width: 14px; height: 14px; }
.bulkbar .sep { width: 1px; height: 18px; background: rgba(255,255,255,0.16); margin: 0 4px; }
</style>
</head>

  '下列各数中，是无理数的是（　　）',

function ringHtml(pct, size) {
  var r = 20, c = 2 * Math.PI * r;
  var off = c * (1 - pct / 100);
  return '<div class="pv-ring"><svg viewBox="0 0 56 56"><circle class="track" cx="28" cy="28" r="' + r + '"/><circle class="val" cx="28" cy="28" r="' + r + '" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '"/></svg><span>' + pct + '%</span></div>';
}
function renderRows() {
  var box = document.getElementById('qbRows');
  box.innerHTML = PAPERS.map(function (p, i) {
    var pct = Math.round(p.done / p.qs * 100);
    return '<div class="card prow" data-i="' + i + '" role="button" tabindex="0">'
      + '<span class="prow__cb"><input type="checkbox" data-cb="' + i + '" aria-label="选择 ' + p.t + '"></span>'
      + '<span class="fmt fmt--' + p.fmt + '">' + (p.fmt === 'doc' ? 'WORD' : 'PDF') + '</span>'
      + '<span class="prow__main"><span class="prow__title">' + p.t + '</span>'
      + '<span class="prow__meta"><span>' + p.region + '</span><span>·</span><span>' + p.year + '</span><span>·</span><span>' + p.type + '</span><span>·</span><span>更新 ' + p.up + '</span></span></span>'
      + '<span class="prow__right"><span class="prow__tagline">' + (pct === 100 ? '<span class="full">标注完整</span>' : '标注 ' + p.done + '/' + p.qs) + '<span class="bar' + (pct === 100 ? ' bar--done' : ' bar--rev') + '"><i style="width:' + pct + '%"></i></span></span>'
      + '<span class="prow__qs">' + p.qs + ' 题</span></span></div>';
  }).join('');
  box.querySelectorAll('.prow').forEach(function (row) {
    row.addEventListener('click', function (e) {
      if (e.target.closest('.prow__cb')) return;
      selectPaper(Number(row.getAttribute('data-i')));
    });
    row.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.target.closest('.prow__cb')) selectPaper(Number(row.getAttribute('data-i')));
    });
  });
  box.querySelectorAll('input[data-cb]').forEach(function (cb) {
    cb.addEventListener('change', function () {
      cb.closest('.prow').classList.toggle('chk', cb.checked);
      syncBulk();
    });
  });
}
var selected = 1;
function selectPaper(i) {
  selected = i;
  document.querySelectorAll('.prow').forEach(function (r) { r.classList.toggle('sel', Number(r.getAttribute('data-i')) === i); });
  renderPreview(i);
}
function renderPreview(i) {
  var p = PAPERS[i];
  var pct = Math.round(p.done / p.qs * 100);
  var qcards = '';
  for (var q = 0; q < 6; q++) {
    var kps = KPS[(i + q) % KPS.length];
    qcards += '<div class="qcard"><div class="qcard__top"><span class="qcard__no">第 ' + (q + 1) + ' 题</span>'
      + '<span class="chip chip--plain" style="height:17px;font-size:10px;padding:0 6px">' + QTYPE[q % 3] + '</span>'
      + '<span class="chip chip--ai" style="height:17px;font-size:10px;padding:0 6px">难度 ' + (1.0 + ((i + q) % 8) * 0.6).toFixed(1) + '</span></div>'
      + '<div class="qcard__stem">' + STEMS[(i + q) % STEMS.length] + '</div>'
      + '<div class="qcard__kps">' + kps.map(function (k) { return '<span class="kp">' + k + '</span>'; }).join('') + '</div></div>';
  }
  document.getElementById('pvCard').innerHTML =
    '<h3 class="pv-title">' + p.t + '</h3>'
    + '<div class="pv-chips"><span class="chip chip--plain">' + p.region + '</span><span class="chip chip--plain">' + p.year + '</span><span class="chip chip--plain">' + p.type + '</span><span class="chip chip--plain">' + p.qs + ' 题</span></div>'
    + '<div class="pv-top">' + ringHtml(pct)
    + '<div class="txt"><b style="color:var(--ink-1)">联合分析 ' + p.done + ' / ' + p.qs + '</b><br>' + (pct === 100 ? '标签、判定点与标准答案均已确认，可直接用于组卷与训练。' : '部分题目缺少标签或判定点，补齐后计入完整进度。') + '</div></div>'
    + '<div class="pv-actions"><button class="btn btn--primary" style="flex:1"><i class="ic" data-icon="book-open"></i>打开试卷</button><button class="btn"><i class="ic" data-icon="plus"></i>加入试卷篮</button></div>'
    + '<div class="pv-qh">试题预览<span>前 6 题</span></div>' + qcards;
  injectIcons(document.getElementById('pvCard'));
}
function syncBulk() {
  var n = document.querySelectorAll('#qbRows input[data-cb]:checked').length;
  document.getElementById('bulkCount').textContent = '已选 ' + n + ' 份';
  document.getElementById('bulkbar').hidden = n === 0;
}
document.addEventListener('DOMContentLoaded', function () {
  renderRows();
  selectPaper(selected);
  document.getElementById('bulkCancel').addEventListener('click', function () {
    document.querySelectorAll('#qbRows input[data-cb]:checked').forEach(function (cb) { cb.checked = false; cb.closest('.prow').classList.remove('chk'); });
    syncBulk();
  });
  initDropdown('moreBtn', 'moreMenu');
});
</script>
</body>
</html>
