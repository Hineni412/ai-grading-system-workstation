<!DOCTYPE html>
<!--
  原型（一次性，验证后即弃）：班主任工作台「交互精简」方案
  问题：现行多轮对话录入 + 机制长文案的交互是否应改为
        「单行快速录入 → 默认进草稿箱 → 分诊队列核对 + 撤销替代确认」。
  三个首页变体（?variant=A|B|C，底部浮动条或 ← → 切换），草稿分诊屏与对话屏共用：
    A — 录入即首页（Todoist 风格：录入框是主角，今日/待核对退为卡片）
    B — 分诊优先（Linear Triage 风格：进门就是待核对队列）
    C — 今日仪表（录入框置顶 + 今日时间轴 + 待核对数卡，现行信息架构的极简化）
  数据为假数据，「今天」固定为 2026-09-01（周二）。解析高亮为演示用规则匹配，非真实模型。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 班主任工作台交互精简</title>
<style>
:root{
  --bg:#f4f5f6; --surface:#fff; --subtle:#f7f8f8; --selected:#e8f1f1;
  --border-subtle:#eceeef; --border:#e2e4e7; --border-strong:#c6cbd0;
  --text:#1c2733; --text-2:#5c6672; --text-3:#87909b;
  --accent:#135e6b; --accent-subtle:#e8f2f2;
  --success:#2f7a55; --success-subtle:#eaf5ef;
  --warning:#9a6718; --warning-subtle:#fff4da;
  --danger:#b04444; --danger-subtle:#faecec;
  --info:#496579; --ai:#5e628d;
  --radius:8px; --radius-panel:12px;
  --shadow-pop:0 4px 10px rgba(28,39,51,.10),0 16px 40px -12px rgba(28,39,51,.22);
  --sans:Inter,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:var(--sans);color:var(--text);font-size:14px}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:left}
input,select{font:inherit;color:inherit}

/* ===== 外壳 ===== */
.shell{display:grid;grid-template-columns:56px minmax(0,1fr);min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--border-subtle);display:flex;flex-direction:column;align-items:center;gap:18px;padding:14px 0}
.rail .logo{width:30px;height:30px;border-radius:8px;background:var(--text);color:#fff;display:grid;place-items:center;font-size:13px}
.rail .ic{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--border-strong)}
.rail .ic.on{background:var(--accent-subtle);border-color:var(--accent)}
.main{display:flex;flex-direction:column;min-width:0}
.topbar{height:64px;background:var(--surface);border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.topbar h1{font-size:18px;margin:0;font-weight:700}
.topbar p{margin:2px 0 0;font-size:12px;color:var(--text-2)}
.content{flex:1;padding:20px 24px 96px;min-width:0}

/* ===== 快速录入框（共用核心元件） ===== */
.qa-box{position:relative;background:var(--surface);border:1.5px solid var(--border-strong);border-radius:var(--radius-panel);transition:border-color .15s}
.qa-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(19,94,107,.14)}
.qa-mirror{position:absolute;inset:0;padding:16px 18px;font-size:16px;line-height:1.5;white-space:pre-wrap;word-break:break-all;pointer-events:none;color:var(--text)}
.qa-mirror .hl-date{background:var(--accent-subtle);color:var(--accent);border-radius:4px;font-weight:700}
.qa-mirror .hl-stu{background:#efeff7;color:var(--ai);border-radius:4px;font-weight:700}
.qa-mirror .hl-type{background:var(--warning-subtle);color:var(--warning);border-radius:4px;font-weight:700}
.qa-input{position:relative;width:100%;padding:16px 18px;border:0;background:transparent;font-size:16px;line-height:1.5;color:transparent;caret-color:var(--accent);resize:none;outline:none;font-family:inherit}
.qa-input::placeholder{color:var(--text-3)}
.qa-parsed{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 12px;font-size:12px}
.qa-parsed span{padding:3px 10px;border-radius:999px;background:var(--subtle);border:1px solid var(--border);color:var(--text-2)}
.qa-parsed span b{color:var(--text)}
.qa-hint{padding:0 18px 12px;font-size:11px;color:var(--text-3)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:7px 14px;border:1px solid var(--border);border-radius:999px;background:var(--surface);font-size:12.5px;color:var(--text-2)}
.chips button:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-subtle)}

/* ===== 变体 A：录入即首页 ===== */
.va-wrap{max-width:720px;margin:6vh auto 0;display:flex;flex-direction:column;gap:18px}
.va-wrap .hello{font-size:22px;font-weight:700;text-align:center}
.va-wrap .hello small{display:block;margin-top:4px;font-size:13px;font-weight:400;color:var(--text-2)}
.va-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.va-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-panel);padding:14px 16px}
.va-card h3{margin:0 0 8px;font-size:13px;color:var(--text-2);font-weight:600}
.va-today-item{display:flex;gap:8px;padding:5px 0;font-size:13px;border-bottom:1px dashed var(--border-subtle)}
.va-today-item:last-child{border-bottom:0}
.va-today-item .od{color:var(--danger);font-weight:700;white-space:nowrap}
.va-today-item .tm{color:var(--text-3);white-space:nowrap}
.va-inbox{display:flex;align-items:center;justify-content:space-between;gap:10px}
.va-inbox strong{font-size:26px;color:var(--accent)}
.va-inbox .go{padding:8px 16px;border-radius:8px;background:var(--accent);color:#fff;font-size:13px;font-weight:600;text-align:center}
.va-chat-link{text-align:center;font-size:12.5px;color:var(--text-2)}
.va-chat-link button{color:var(--accent);font-weight:600;text-decoration:underline}

/* ===== 变体 B：分诊优先 ===== */
.vb-wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.vb-topbar{display:flex;gap:10px;align-items:stretch}
.vb-topbar .qa-box{flex:1}
.vb-topbar .qa-mirror,.vb-topbar .qa-input{padding:11px 14px;font-size:14px}
.vb-topbar .qa-hint{display:none}

/* ===== 变体 C：今日仪表 ===== */
.vc-wrap{display:flex;flex-direction:column;gap:14px;max-width:1000px;margin:0 auto}
.vc-grid{display:grid;grid-template-columns:minmax(0,1.6fr) 300px;gap:14px;align-items:start}
.vc-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-panel);padding:14px 16px}
.vc-panel h3{margin:0 0 8px;font-size:13px;color:var(--text-2);font-weight:600}
.vc-tl-item{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:8px;padding:6px 0;border-bottom:1px dashed var(--border-subtle);font-size:13px;align-items:center}
.vc-tl-item:last-child{border-bottom:0}
.vc-tl-item .d{font-size:11px;font-weight:700;color:var(--text-3)}
.vc-tl-item .d.od{color:var(--danger)}
.vc-num{font-size:30px;font-weight:700;color:var(--accent)}
.vc-go{display:block;margin-top:8px;padding:9px;border-radius:8px;background:var(--accent);color:#fff;font-size:13px;font-weight:600;text-align:center}

/* ===== 分诊屏 ===== */
.tr-wrap{max-width:920px;margin:0 auto;display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;align-items:start}
.tr-queue{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-panel);overflow:hidden}
.tr-queue>header{padding:12px 14px;border-bottom:1px solid var(--border-subtle);font-size:13px;font-weight:700;display:flex;justify-content:space-between}
.tr-queue>header span{color:var(--text-3);font-weight:400}
.tr-q-item{display:block;width:100%;padding:10px 14px;border-bottom:1px solid var(--border-subtle);font-size:13px}
.tr-q-item:hover{background:var(--selected)}
.tr-q-item.on{background:var(--accent-subtle);border-left:3px solid var(--accent);padding-left:11px}
.tr-q-item small{display:block;color:var(--text-3);font-size:11px;margin-top:2px}
.tr-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-panel);overflow:hidden}
.tr-card>header{padding:16px 18px 0;display:flex;justify-content:space-between;align-items:center}
.tr-card>header .cnt{font-size:12px;color:var(--text-3)}
.tr-title{margin:8px 18px 4px;font-size:19px;font-weight:700;line-height:1.4}
.tr-meta{display:flex;flex-wrap:wrap;gap:8px;padding:6px 18px 14px}
.tr-meta span{padding:3px 10px;border-radius:999px;font-size:12px;background:var(--subtle);border:1px solid var(--border);color:var(--text-2)}
.tr-meta span b{color:var(--text)}
.tr-edit{margin:4px 18px 14px;display:grid;gap:8px}
.tr-edit input,.tr-edit select{padding:8px 10px;border:1px solid var(--border);border-radius:8px}
.tr-actions{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--border)}
.tr-actions button{padding:13px 0;text-align:center;font-size:13.5px;font-weight:600;border-right:1px solid var(--border)}
.tr-actions button:last-child{border-right:0}
.tr-actions .ok{color:var(--success)}.tr-actions .ok:hover{background:var(--success-subtle)}
.tr-actions .ed{color:var(--accent)}.tr-actions .ed:hover{background:var(--accent-subtle)}
.tr-actions .snz{color:var(--warning)}.tr-actions .snz:hover{background:var(--warning-subtle)}
.tr-actions .del{color:var(--danger)}.tr-actions .del:hover{background:var(--danger-subtle)}
.tr-actions small{display:block;font-size:10px;color:var(--text-3);font-weight:400;margin-top:2px}
.tr-snooze{position:relative}
.tr-snooze-menu{position:absolute;bottom:56px;left:25%;right:25%;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-pop);overflow:hidden;z-index:5}
.tr-snooze-menu button{display:block;width:100%;padding:10px 14px;font-size:13px}
.tr-snooze-menu button:hover{background:var(--selected)}
.tr-empty{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-panel);padding:48px 24px;text-align:center}
.tr-empty p{color:var(--text-2);margin:0 0 14px}
.tr-empty button{padding:9px 18px;border-radius:8px;background:var(--accent);color:#fff;font-weight:600}
.tr-snoozed{max-width:920px;margin:14px auto 0;font-size:12px;color:var(--text-3)}
.tr-snoozed summary{cursor:pointer}

/* ===== 对话屏（次级入口） ===== */
.ch-wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.ch-note{font-size:12.5px;color:var(--text-2);background:var(--warning-subtle);border:1px solid #ecd9a8;border-radius:8px;padding:8px 12px}
.ch-msg{max-width:85%;padding:8px 12px;border-radius:10px;font-size:13.5px;line-height:1.55}
.ch-msg.me{margin-left:auto;background:var(--accent-subtle)}
.ch-msg.ai{border:1px solid var(--border);border-left:3px solid var(--accent);background:var(--surface)}
.ch-msg span{display:block;font-size:11px;font-weight:700;color:var(--accent);margin-bottom:3px}
.ch-input{display:flex;gap:8px}
.ch-input input{flex:1;padding:11px 14px;border:1.5px solid var(--border-strong);border-radius:10px}
.ch-input button{padding:0 20px;border-radius:10px;background:var(--accent);color:#fff;font-weight:600}

/* ===== snackbar（撤销条） ===== */
.snack{position:fixed;left:50%;bottom:78px;transform:translateX(-50%) translateY(20px);z-index:98;display:flex;align-items:center;gap:14px;background:#1c2733;color:#fff;border-radius:10px;padding:11px 18px;font-size:13px;box-shadow:var(--shadow-pop);opacity:0;transition:all .18s}
.snack.show{opacity:1;transform:translateX(-50%) translateY(0)}
.snack button{color:#7fd3c3;font-weight:700}
.snack .count{color:var(--text-3);font-size:11px}

/* ===== 变体切换条 ===== */
.switcher{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:99;display:flex;align-items:center;gap:14px;background:#1c2733;color:#fff;border-radius:999px;padding:9px 18px;box-shadow:0 8px 24px rgba(0,0,0,.28);font-size:13px}
.switcher button{color:#fff;font-size:16px;padding:0 8px}
.switcher .lab{min-width:250px;text-align:center}
.switcher .lab small{opacity:.6;margin-left:6px}
/* ===== 变体 D：增强现行版 ===== */
.vd-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;max-width:1180px;margin:0 auto}
.vd-main{display:flex;flex-direction:column;gap:14px;min-width:0}
.vd-strip{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-panel);padding:12px 16px}
.vd-strip>header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.vd-strip>header strong{font-size:13px}
.vd-strip__more{font-size:12px;color:var(--accent);font-weight:600;cursor:pointer}
.vd-strip__row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--border-subtle);font-size:13px}
.vd-strip__row:last-child{border-bottom:0}
.vd-strip__row .d{flex:0 0 52px;font-size:11px;font-weight:700;color:var(--text-3)}
.vd-strip__row .d.od{color:var(--danger)}
.vd-strip__row .t{flex:1;min-width:0}
.qa2{display:flex;gap:4px}
.qa2 button{width:22px;height:22px;border:1px solid var(--border-strong);border-radius:6px;font-size:12px;display:grid;place-items:center;color:var(--text-2)}
.qa2 button:first-child{color:var(--success);border-color:var(--success)}
.qa2 button:first-child:hover{background:var(--success-subtle)}
.qa2 button:last-child:hover{color:var(--danger);border-color:var(--danger);background:var(--danger-subtle)}
.vd-conv{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-panel);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.vd-composer{border-top:1px solid var(--border);padding-top:12px}
.vd-composer__bar{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.vd-composer__bar small{color:var(--text-3)}
.vd-composer__bar>span{display:flex;gap:8px}
.vd-btn{padding:8px 18px;border-radius:8px;background:var(--accent);color:#fff;font-size:13px;font-weight:600;text-align:center}
.vd-btn.ghost{background:var(--surface);color:var(--text-2);border:1px solid var(--border)}
.vd-side{display:flex;flex-direction:column;gap:12px}
.vd-recent{display:block;width:100%;padding:8px 0;border-bottom:1px solid var(--border-subtle);font-size:13px}
.vd-recent:last-child{border-bottom:0}
.vd-recent:hover{color:var(--accent)}
@media(max-width:980px){.tr-wrap,.vc-grid,.va-cards,.vd-wrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
  <nav class="rail"><div class="logo">阅</div><div class="ic"></div><div class="ic on"></div><div class="ic"></div><div class="ic"></div></nav>
  <div class="main">
    <div class="topbar"><div><h1>班主任工作台</h1><p>初二（3）班 · 王老师 · 9月1日 周二</p></div></div>
    <div class="content" id="app"></div>
  </div>
</div>
<div class="snack" id="snack"><span id="snackText"></span><button id="snackUndo">撤销</button><span class="count" id="snackCount"></span></div>
<div class="switcher">
  <button id="prev" aria-label="上一个变体">←</button>
  <div class="lab" id="lab"></div>
  <button id="next" aria-label="下一个变体">→</button>
</div>
<script>
'use strict';
/* ===== 假数据 ===== */
const TODAY_LABEL = '9月1日 周二';
let drafts = [
  { id: 'd1', title: '明天放学前收齐《防溺水承诺书》回执', type: '收缴', date: '9月2日', student: null },
  { id: 'd2', title: '周五下午 3 点开家长会，提前发通知', type: '沟通', date: '9月5日', student: null },
  { id: 'd3', title: '张立璞最近情绪起伏大，安排一次课后谈话', type: '学生支持', date: null, student: '张立璞', restricted: true },
  { id: 'd4', title: '中秋主题班会需要排流程、分配任务', type: '计划', date: null, student: null, complex: true },
];
let snoozed = [];
let triageIdx = 0;
let editing = false;
const todayItems = [
  { date: '昨天', od: true, title: '收校服费（已完成 34/47）' },
  { date: '今天', od: false, title: '早读巡视与仪容检查' },
  { date: '今天', od: false, title: '物理竞赛报名名单确认' },
];
const CHIPS = ['明天放学前收××回执', '周五下午开家长会', '提醒××同学……', '下周安排一次班会'];

/* ===== 录入解析（演示用规则匹配，非真实模型） ===== */
const DATE_RE = /(今天|明天|后天|下周[一二三四五六日]?|周[一二三四五六日]|\d{1,2}月\d{1,2}日)/;
const STU_RE = /(张立璞|钱肖白|何辰萱|余天策)/;
const TYPE_RULES = [
  [/收.*?(回执|费|表|材料)/, '收缴'],
  [/(通知|家长会|沟通|谈话)/, '沟通'],
  [/(班会|活动|策划)/, '活动'],
];
function parseText(text) {
  const date = (text.match(DATE_RE) || [])[0] || null;
  const student = (text.match(STU_RE) || [])[0] || null;
  let type = '任务';
  for (const [re, name] of TYPE_RULES) { if (re.test(text)) { type = name; break; } }
  return { date, student, type };
}
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
function mirrorHTML(text) {
  if (!text) return '';
  let html = esc(text);
  html = html.replace(DATE_RE, '<span class="hl-date">$1</span>');
  html = html.replace(STU_RE, '<span class="hl-stu">$1</span>');
  for (const [re] of TYPE_RULES) html = html.replace(re, (m) => `<span class="hl-type">${m}</span>`);
  return html;
}

/* ===== snackbar（撤销条，5 秒） ===== */
let snackTimer = null, snackAction = null;
function snack(text, undo) {
  const el = document.getElementById('snack');
  document.getElementById('snackText').textContent = text;
  snackAction = undo || null;
  document.getElementById('snackUndo').style.display = undo ? '' : 'none';
  el.classList.add('show');
  clearTimeout(snackTimer);
  let left = 5;
  const cnt = document.getElementById('snackCount');
  cnt.textContent = left + 's';
  snackTimer = setInterval(() => {
    left -= 1;
    if (left <= 0) { clearInterval(snackTimer); el.classList.remove('show'); return; }
    cnt.textContent = left + 's';
  }, 1000);
}
document.getElementById('snackUndo').onclick = () => {
  if (snackAction) snackAction();
  clearInterval(snackTimer);
  document.getElementById('snack').classList.remove('show');
  render();
};

/* ===== 全局导航状态 ===== */
let screen = 'home'; // home | triage | chat
const app = document.getElementById('app');
function go(name) { screen = name; editing = false; render(); }

/* ===== 录入框元件（变体共用） ===== */
function quickAddHTML(big) {
  return `
  <div class="qa-box">
    <div class="qa-mirror" id="qaMirror"></div>
    <textarea class="qa-input" id="qaInput" rows="${big ? 2 : 1}" placeholder="记一件班务：明天放学前收防溺水回执"></textarea>
    <div class="qa-parsed" id="qaParsed"></div>
    ${big ? '<div class="qa-hint">回车录入，进待核对；分类、日期由 AI 预填，核对时再确认</div>' : ''}
  </div>
  <div class="chips" style="margin-top:10px">${CHIPS.map((c) => `<button data-chip="${esc(c)}">${esc(c)}</button>`).join('')}</div>`;
}
function bindQuickAdd() {
  const input = document.getElementById('qaInput');
  if (!input) return;
  const mirror = document.getElementById('qaMirror');
  const parsed = document.getElementById('qaParsed');
  const sync = () => {
    mirror.innerHTML = mirrorHTML(input.value) + '\n';
    const p = input.value.trim() ? parseText(input.value) : null;
    parsed.innerHTML = p && input.value.trim()
      ? `${p.date ? `<span>时间 <b>${p.date}</b></span>` : ''}<span>类型 <b>${p.type}</b></span>${p.student ? `<span>涉及 <b>${p.student}</b></span>` : ''}`
      : '';
  };
  input.addEventListener('input', sync);
  input.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || e.shiftKey) return;
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    const p = parseText(text);
    const draft = { id: 'd' + Date.now(), title: text, type: p.type, date: p.date, student: p.student };
    drafts.unshift(draft);
    snack('已录入待核对', () => { drafts = drafts.filter((d) => d.id !== draft.id); triageIdx = 0; });
    input.value = ''; sync();
    render();
  });
  document.querySelectorAll('[data-chip]').forEach((b) => b.addEventListener('click', () => {
    input.value = b.dataset.chip; sync(); input.focus();
  }));
}

/* ===== 待核对入口卡（变体共用） ===== */
function inboxCardHTML() {
  return `<div class="va-inbox"><div><strong>${drafts.length}</strong><div style="font-size:12px;color:var(--text-2)">条班务待核对</div></div>
  <button class="go" data-go="triage" ${drafts.length ? '' : 'disabled style="opacity:.5"'}>开始核对 ›</button></div>`;
}
</script>
<script>
'use strict';
/* ===== 首页变体 A：录入即首页 ===== */
function renderHomeA() {
  app.innerHTML = `
  <div class="va-wrap">
    <p class="hello">今天班务，记一句就行<small>${TODAY_LABEL} · 录入后 AI 预填分类，核对时才确认</small></p>
    ${quickAddHTML(true)}
    <div class="va-cards">
      <div class="va-card"><h3>今天</h3>
        ${todayItems.map((i) => `<div class="va-today-item"><span class="${i.od ? 'od' : 'tm'}">${i.od ? '逾期' : i.date}</span><span>${esc(i.title)}</span></div>`).join('')}
      </div>
      <div class="va-card"><h3>待核对</h3>${inboxCardHTML()}</div>
    </div>
    <p class="va-chat-link">一句话说不清的事？<button data-go="chat">进入详细说明</button></p>
  </div>`;
  bindQuickAdd(); bindNav();
}

/* ===== 首页变体 B：分诊优先 ===== */
function renderHomeB() {
  app.innerHTML = `
  <div class="vb-wrap">
    <div class="vb-topbar">${quickAddHTML(false)}</div>
    ${drafts.length ? triageCardHTML(true) : `
      <div class="tr-empty"><p>目前没有待核对的班务。在上方输入框记一件试试。</p></div>`}
    ${snoozedHTML()}
  </div>`;
  bindQuickAdd(); bindNav(); bindTriage();
}

/* ===== 首页变体 C：今日仪表 ===== */
function renderHomeC() {
  app.innerHTML = `
  <div class="vc-wrap">
    ${quickAddHTML(false)}
    <div class="vc-grid">
      <div class="vc-panel"><h3>今日与逾期</h3>
        ${todayItems.map((i) => `<div class="vc-tl-item"><span class="d ${i.od ? 'od' : ''}">${i.od ? '已逾期' : i.date}</span><span>${esc(i.title)}</span><span style="color:var(--text-3);font-size:11px">›</span></div>`).join('')}
      </div>
      <div>
        <div class="vc-panel"><h3>待核对</h3>
          <div class="vc-num">${drafts.length} 条</div>
          <button class="vc-go" data-go="triage">开始核对 ›</button>
        </div>
        <div class="vc-panel" style="margin-top:12px"><h3>复杂事项</h3>
          <p style="margin:0;font-size:12.5px;color:var(--text-2)">涉及多人、多步骤的事<br><button data-go="chat" style="color:var(--accent);font-weight:600;text-decoration:underline">进入详细说明 ›</button></p>
        </div>
      </div>
    </div>
  </div>`;
  bindQuickAdd(); bindNav();
}

/* ===== 分诊卡片（变体 B 内嵌 + 独立分诊屏共用） ===== */
function triageCardHTML(embedded) {
  const d = drafts[triageIdx] || drafts[0];
  if (!d) return '';
  const head = `<div class="tr-card">
    <header><span class="cnt">待核对 · 还剩 ${drafts.length} 条</span>${embedded ? '<button data-go="triage" style="color:var(--accent);font-size:12px;font-weight:600">全屏核对 ›</button>' : '<button data-go="home" style="color:var(--text-2);font-size:12px">‹ 回首页</button>'}</header>
    ${editing ? `
      <div class="tr-edit">
        <input id="editTitle" value="${esc(d.title)}">
        <div style="display:flex;gap:8px">
          <select id="editType">${['任务', '收缴', '沟通', '活动', '计划', '学生支持'].map((t) => `<option ${t === d.type ? 'selected' : ''}>${t}</option>`).join('')}</select>
          <input id="editDate" placeholder="时间（如 9月5日）" value="${esc(d.date || '')}">
        </div>
        <button class="vc-go" id="editSave" style="margin:0">保存修改</button>
      </div>` : `
      <h2 class="tr-title">${esc(d.title)}</h2>
      <div class="tr-meta">
        <span>类型 <b>${d.type}</b></span>
        <span>时间 <b>${d.date || '未定'}</b></span>
        ${d.student ? `<span>涉及 <b>${d.student}</b></span>` : ''}
        ${d.restricted ? '<span style="color:var(--danger)">🔒 学生事项，入库后仅本人可见</span>' : ''}
        ${d.complex ? '<span style="color:var(--warning)">多步骤，建议入库后拆解</span>' : ''}
      </div>`}
    <div class="tr-actions">
      <button class="ok" data-act="accept">入库<small>直接生效 · 可撤销</small></button>
      <button class="ed" data-act="edit">${editing ? '完成' : '修改'}<small>改类型/时间</small></button>
      <button class="snz" data-act="snooze">稍后<small>明天或下周再核对</small></button>
      <button class="del" data-act="drop">删除<small>可撤销</small></button>
    </div>
    <div class="tr-snooze" id="snoozeSlot"></div>
  </div>`;
  if (embedded) return head;
  return `<div class="tr-wrap">
    <div class="tr-queue"><header>草稿箱<span>${drafts.length} 条</span></header>
      ${drafts.map((item, i) => `<button class="tr-q-item ${i === triageIdx ? 'on' : ''}" data-q="${i}">${esc(item.title)}<small>${item.type}${item.date ? ' · ' + item.date : ''}</small></button>`).join('')}
    </div>
    <div>${head}</div>
  </div>${snoozedHTML()}`;
}
function snoozedHTML() {
  if (!snoozed.length) return '';
  return `<details class="tr-snoozed"><summary>稍后处理（${snoozed.length} 条，到时间自动回到草稿箱）</summary>
    ${snoozed.map((s) => `<div style="padding:4px 0">${esc(s.title)} · ${s.until} 回来</div>`).join('')}</details>`;
}

/* ===== 分诊屏 ===== */
function renderTriage() {
  if (!drafts.length) {
    app.innerHTML = `<div class="tr-empty" style="max-width:560px">
      <p>草稿箱清空了。</p><button data-go="home">回首页记一件新班务</button></div>${snoozedHTML()}`;
    bindNav(); return;
  }
  if (triageIdx >= drafts.length) triageIdx = 0;
  app.innerHTML = triageCardHTML(false);
  bindNav(); bindTriage();
}
function bindTriage() {
  document.querySelectorAll('[data-q]').forEach((b) => b.addEventListener('click', () => { triageIdx = +b.dataset.q; editing = false; render(); }));
  document.querySelectorAll('[data-act]').forEach((b) => b.addEventListener('click', () => triageAction(b.dataset.act)));
  const save = document.getElementById('editSave');
  if (save) save.addEventListener('click', () => {
    const d = drafts[triageIdx];
    d.title = document.getElementById('editTitle').value.trim() || d.title;
    d.type = document.getElementById('editType').value;
    d.date = document.getElementById('editDate').value.trim() || null;
    editing = false;
    snack('已修改', null);
    render();
  });
}
function triageAction(act) {
  const d = drafts[triageIdx];
  if (!d) return;
  if (act === 'edit') { editing = !editing; render(); return; }
  if (act === 'snooze') {
    const slot = document.getElementById('snoozeSlot');
    if (slot) slot.innerHTML = `<div class="tr-snooze-menu">
      <button data-until="明天">明天再核对</button><button data-until="下周一">下周一再核对</button></div>`;
    document.querySelectorAll('[data-until]').forEach((b) => b.addEventListener('click', () => {
      drafts.splice(triageIdx, 1);
      snoozed.push({ ...d, until: b.dataset.until });
      if (triageIdx >= drafts.length) triageIdx = 0;
      snack(`已暂缓，${b.dataset.until}回到草稿箱`, () => {
        snoozed = snoozed.filter((s) => s.id !== d.id); drafts.unshift(d);
      });
      render();
    }));
    return;
  }
  if (act === 'accept' || act === 'drop') {
    drafts.splice(triageIdx, 1);
    if (triageIdx >= drafts.length) triageIdx = 0;
    snack(act === 'accept' ? '已入库' : '已删除', () => { drafts.unshift(d); });
    render();
  }
}

/* ===== 对话屏（次级入口） ===== */
function renderChat() {
  app.innerHTML = `
  <div class="ch-wrap">
    <button data-go="home" style="color:var(--text-2);font-size:12.5px">‹ 回首页</button>
    <p class="ch-note">这里处理一句话说不清的事：涉及多名学生、多步骤安排、需要 AI 追问细节的情况。日常班务在首页记一句即可。</p>
    <div class="ch-msg me">中秋主题班会需要排流程、分配任务</div>
    <div class="ch-msg ai"><span>AI</span>好的，班会打算哪天开、多长课时？需要我把流程拆成准备步骤吗？</div>
    <div class="ch-input"><input placeholder="继续补充……"><button>发送</button></div>
  </div>`;
  bindNav();
}

/* ===== 渲染调度与变体切换 ===== */
/* ===== 首页变体 D：增强现行版（功能全保留，叠加简化） ===== */
function renderHomeD() {
  app.innerHTML = `
  <div class="vd-wrap">
    <div class="vd-main">
      <section class="vd-strip">
        <header><strong>本周事务 · 未完成 3 项</strong><span class="vd-strip__more">进入日历页 ›</span></header>
        <div class="vd-strip__row"><span class="d od">已逾期</span><span class="t">收校服费（已完成 34/47）</span><span class="qa2"><button title="完成并归档">✓</button><button title="删除">✕</button></span></div>
        <div class="vd-strip__row"><span class="d">今天</span><span class="t">早读巡视与仪容检查</span><span class="qa2"><button title="完成并归档">✓</button><button title="删除">✕</button></span></div>
        <div class="vd-strip__row"><span class="d">今天</span><span class="t">物理竞赛报名名单确认</span><span class="qa2"><button title="完成并归档">✓</button><button title="删除">✕</button></span></div>
      </section>

      <section class="vd-conv">
        <div class="ch-msg me" style="font-size:13px">周五下午 3 点开家长会，提前发通知</div>
        <div class="ch-msg ai" style="font-size:13px"><span>AI</span>已按沟通类整理为草稿，待你核对后入库。</div>
        <div class="vd-composer">
          ${quickAddHTML(true)}
          <div class="vd-composer__bar">
            <small>回车直接发送 · Shift+回车换行</small>
            <span><button class="vd-btn ghost">语音输入</button><button class="vd-btn" id="vdSend">发送并整理</button></span>
          </div>
        </div>
      </section>
    </div>
    <aside class="vd-side">
      <section class="vc-panel"><h3>待核对</h3>
        <div class="vc-num">${drafts.length} 条</div>
        <button class="vc-go" data-go="triage">开始核对 ›</button>
      </section>
      <section class="vc-panel"><h3>最近会话</h3>
        <button class="vd-recent">中秋主题班会准备工作</button>
        <button class="vd-recent">张立璞同学的情况记录</button>
        <button class="vd-recent">开学前的准备工作安排</button>
      </section>
    </aside>
  </div>`;
  bindQuickAdd(); bindNav();
  const send = document.getElementById('vdSend');
  const input = document.getElementById('qaInput');
  if (send && input) send.addEventListener('click', () => {
    const text = input.value.trim();
    if (!text) return;
    const p = parseText(text);
    const draft = { id: 'd' + Date.now(), title: text, type: p.type, date: p.date, student: p.student };
    drafts.unshift(draft);
    snack('已发送整理，进待核对', () => { drafts = drafts.filter((d) => d.id !== draft.id); triageIdx = 0; });
    input.value = ''; input.dispatchEvent(new Event('input'));
    render();
  });
}

const VARIANTS = {
  D: { name: '增强现行版（功能全保留）', fn: renderHomeD },
  A: { name: '录入即首页', fn: renderHomeA },
  B: { name: '分诊优先', fn: renderHomeB },
  C: { name: '今日仪表', fn: renderHomeC },
};
const KEYS = Object.keys(VARIANTS);
function currentVariant() { const v = new URLSearchParams(location.search).get('variant'); return KEYS.includes(v) ? v : 'D'; }
function render() {
  const v = currentVariant();
  document.getElementById('lab').innerHTML = screen === 'home'
    ? `${v} — ${VARIANTS[v].name}<small>原型 · ${KEYS.indexOf(v) + 1}/4</small>`
    : `${screen === 'triage' ? '分诊屏' : '对话屏（次级入口）'}<small>共用 · 当前首页变体 ${v}</small>`;
  if (screen === 'triage') renderTriage();
  else if (screen === 'chat') renderChat();
  else VARIANTS[v].fn();
  window.scrollTo(0, 0);
}
function bindNav() { document.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => go(b.dataset.go))); }
function goVariant(step) {
  const i = (KEYS.indexOf(currentVariant()) + step + KEYS.length) % KEYS.length;
  const u = new URL(location.href); u.searchParams.set('variant', KEYS[i]);
  history.replaceState(null, '', u); screen = 'home'; editing = false; render();
}
document.getElementById('prev').onclick = () => goVariant(-1);
document.getElementById('next').onclick = () => goVariant(1);
document.addEventListener('keydown', (e) => {
  if (e.target.matches('input,textarea,select,[contenteditable]')) return;
  if (e.key === 'ArrowLeft') goVariant(-1);
  if (e.key === 'ArrowRight') goVariant(1);
});
render();
</script>
