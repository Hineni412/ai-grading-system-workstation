<!DOCTYPE html>
<!--
  原型（一次性，验证后即弃）：班主任工作台「日历」页改版
  三个结构不同的变体，通过 ?variant=A|B|C 切换，底部浮动条或 ← → 键切换：
    A — 周日历 + 待办侧栏（Google 日历 + Classroom 待办式）
    B — 日程流（agenda 优先，逾期置顶，迷你月历导航）
    C — 月历全貌 + 日详情抽屉（FullCalendar 式密度控制）
  数据为假数据，「今天」固定为 2026-09-01（周二）。
  改版原则（来自 scratch/日历展示调研-20260901.md）：
    · 同一天最多显示 2~3 条，超出折叠为「+N 更多」，点击弹出当日全量；
    · 一种工作类型一个颜色，单事件只显一个主色，逾期/今天用标记而非颜色区分；
    · 日历只表达「什么时候发生」，「要我做什么」收进待办清单；
    · 工作关系不再整页重复列出，收进节点详情。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 班主任工作台日历页改版</title>
<style>
:root{
  --bg:#f4f5f6; --surface:#fff; --subtle:#f7f8f8; --selected:#e8f1f1;
  --border-subtle:#eceeef; --border:#e2e4e7; --border-strong:#c6cbd0;
  --text:#1c2733; --text-2:#5c6672; --text-3:#87909b;
  --accent:#135e6b; --accent-subtle:#e8f2f2;
  --success:#2f7a55; --warning:#9a6718; --warning-subtle:#fff4da;
  --danger:#b04444; --danger-subtle:#faecec;
  --info:#496579; --info-subtle:#edf3f7;
  --radius:8px; --radius-panel:12px;
  --shadow-hover:0 2px 4px rgba(28,39,51,.06),0 12px 28px -10px rgba(28,39,51,.14);
  --shadow-pop:0 4px 10px rgba(28,39,51,.10),0 16px 40px -12px rgba(28,39,51,.22);
  --sans:Inter,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
  /* 工作类型色（一类一色） */
  --k-goal:#2f7a55; --k-task:#135e6b; --k-waiting:#9a6718; --k-decision:#5e628d;
  --k-collection:#496579; --k-communication:#b25b21; --k-sop:#64748b; --k-restricted:#b04444;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:var(--sans);color:var(--text);font-size:14px}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:left}

/* ===== 应用外壳（模拟真实工作台环境，所有变体共用） ===== */
.shell{display:grid;grid-template-columns:56px minmax(0,1fr);min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--border-subtle);display:flex;flex-direction:column;align-items:center;gap:18px;padding:14px 0}
.rail .logo{width:30px;height:30px;border-radius:8px;background:var(--text);color:#fff;display:grid;place-items:center;font-size:13px}
.rail .ic{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--border-strong)}
.rail .ic.on{background:var(--accent-subtle);border-color:var(--accent)}
.main{display:flex;flex-direction:column;min-width:0}
.topbar{height:68px;background:var(--surface);border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.topbar h1{font-size:19px;margin:0;font-weight:700}
.topbar p{margin:2px 0 0;font-size:12px;color:var(--text-2)}
.topbar .task-center{background:var(--accent);color:#fff;border-radius:999px;padding:7px 16px;font-size:13px;font-weight:600}
.tabs{background:var(--surface);border-bottom:1px solid var(--border-subtle);display:flex;gap:26px;padding:0 20px}
.tabs span{padding:12px 2px;font-size:14px;color:var(--text-2)}
.tabs span.on{color:var(--accent);font-weight:600;border-bottom:2px solid var(--accent)}
.content{padding:18px 24px 96px;display:flex;flex-direction:column;gap:14px;min-width:0}

/* ===== 共用元件 ===== */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-panel);overflow:hidden}
.kicker{margin:0 0 2px;color:var(--accent);font-size:11px;font-weight:700;letter-spacing:.12em}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{padding:7px 14px;font-size:13px;color:var(--text-2)}
.seg button.on{background:var(--accent-subtle);color:var(--accent);font-weight:600}
.navbtns{display:inline-flex;gap:6px}
.navbtns button{min-height:32px;padding:0 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-size:13px;color:var(--text)}
.navbtns button:hover{border-color:var(--accent);color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--text-2)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}

/* 事件 chip（格子内，A/C 共用） */
.chip{display:flex;align-items:center;gap:6px;width:100%;min-height:24px;padding:2px 6px;border-radius:6px;background:var(--subtle);border-left:3px solid var(--kc,var(--k-task));font-size:12px;line-height:1.35}
.chip:hover{background:var(--selected)}
.chip .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.done{opacity:.5}.chip.done .t{text-decoration:line-through}
.chip.od{background:var(--danger-subtle)}
.chip .odtag{flex:none;font-size:10px;color:var(--danger);font-weight:700}
.chip.rst{background:repeating-linear-gradient(45deg,var(--subtle),var(--subtle) 6px,#f2e9e9 6px,#f2e9e9 12px);border-left-color:var(--k-restricted)}
.more{width:100%;padding:2px 6px;font-size:11px;color:var(--accent);font-weight:600;border-radius:6px;text-align:left}
.more:hover{background:var(--accent-subtle)}

/* 当日弹层（+N 更多） */
.pop{position:absolute;z-index:30;width:240px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-pop);padding:10px;display:flex;flex-direction:column;gap:6px}
.pop h4{margin:0 0 2px;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.pop h4 button{color:var(--text-3);font-size:16px;line-height:1;padding:2px 6px}
.pop .chip{min-height:26px}

/* 状态小标签 */
.st{flex:none;font-size:10px;padding:1px 6px;border-radius:999px;border:1px solid var(--border);color:var(--text-2);white-space:nowrap}
.st.done{color:var(--success);border-color:var(--success)}
.st.od{color:var(--danger);border-color:var(--danger);font-weight:700}

/* ===== 变体 A：周日历 + 待办侧栏 ===== */
.va-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:14px 18px}
.va-head h2{margin:0;font-size:20px;font-weight:700}
.va-head .ctl{display:flex;align-items:center;gap:10px}
.va-body{display:grid;grid-template-columns:minmax(0,1fr) 320px;border-top:1px solid var(--border)}
.va-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-height:460px}
.va-day{position:relative;border-right:1px solid var(--border-subtle);padding:8px;display:flex;flex-direction:column;gap:4px;min-width:0}
.va-day:last-child{border-right:0}
.va-day.today{background:var(--accent-subtle)}
.va-day h3{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 4px;font-size:12px;color:var(--text-2)}
.va-day h3 b{font-size:14px;color:var(--text)}
.va-day.today h3 b{color:var(--accent)}
.va-day .empty{font-size:11px;color:var(--text-3);padding:4px 2px}
.va-side{border-left:1px solid var(--border);background:var(--subtle);display:flex;flex-direction:column;min-height:460px}
.va-side header{padding:12px 14px 8px}
.va-side header strong{font-size:13px}
.va-side header p{margin:2px 0 0;font-size:11px;color:var(--text-3)}
.va-todo{padding:4px 10px 12px;display:flex;flex-direction:column;gap:10px;overflow:auto}
.va-group{border:1px solid var(--border);border-radius:10px;background:var(--surface);overflow:hidden}
.va-group>header{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;font-size:12px;font-weight:700}
.va-group.od>header{color:var(--danger);background:var(--danger-subtle)}
.va-group.td>header{color:var(--accent);background:var(--accent-subtle)}
.va-group.wt>header{color:var(--warning);background:var(--warning-subtle)}
.va-group .cnt{font-weight:400;font-size:11px;color:var(--text-2)}
.va-item{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;border-top:1px solid var(--border-subtle);font-size:12.5px}
.va-item:hover{background:var(--selected)}
.va-item i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--kc)}
.va-item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.va-detail{margin:0 10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);padding:10px 12px;font-size:12.5px}
.va-detail h4{margin:0 0 6px;font-size:13px}
.va-detail dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;color:var(--text-2)}
.va-detail dt{color:var(--text-3)}
.va-detail .rel{margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);color:var(--text-2);font-size:12px}

/* ===== 变体 B：日程流（列表优先） ===== */
.vb-body{display:grid;grid-template-columns:264px minmax(0,1fr);gap:14px;align-items:start}
.vb-mini{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-panel);padding:14px;position:sticky;top:18px}
.vb-mini h3{margin:0 0 10px;font-size:14px;display:flex;justify-content:space-between;align-items:baseline}
.vb-mini h3 span{font-size:11px;color:var(--text-3);font-weight:400}
.vb-mini .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.vb-mini .grid .dw{font-size:10px;color:var(--text-3);padding:3px 0}
.vb-mini .d{position:relative;padding:5px 0 7px;font-size:12px;border-radius:8px;color:var(--text-2);width:100%}
.vb-mini .d:hover{background:var(--selected)}
.vb-mini .d.dim{color:var(--text-3);opacity:.5}
.vb-mini .d.today{background:var(--accent);color:#fff;font-weight:700}
.vb-mini .d .dots{position:absolute;left:0;right:0;bottom:2px;display:flex;justify-content:center;gap:2px}
.vb-mini .d .dots i{width:4px;height:4px;border-radius:50%;background:var(--kc)}
.vb-mini .d.today .dots i{background:#fff}
.vb-mini .note{margin-top:12px;padding-top:10px;border-top:1px solid var(--border-subtle);font-size:11px;color:var(--text-3);line-height:1.6}
.vb-stream{display:flex;flex-direction:column;gap:12px;min-width:0}
.vb-group{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-panel);overflow:hidden}
.vb-group>header{display:flex;align-items:baseline;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border-subtle);background:var(--subtle)}
.vb-group>header b{font-size:15px}
.vb-group>header span{font-size:12px;color:var(--text-2)}
.vb-group>header .cnt{margin-left:auto;font-size:11px;color:var(--text-3)}
.vb-group.today>header{background:var(--accent-subtle)}
.vb-group.today>header b{color:var(--accent)}
.vb-group.od>header{background:var(--danger-subtle)}
.vb-group.od>header b{color:var(--danger)}
.vb-row{display:flex;align-items:center;gap:10px;width:100%;padding:10px 16px;border-bottom:1px solid var(--border-subtle)}
.vb-row:last-child{border-bottom:0}
.vb-row:hover{background:var(--selected)}
.vb-row i.dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--kc)}
.vb-row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.vb-row .kind{flex:none;font-size:11px;color:var(--text-2)}
.vb-row.done .t{color:var(--text-3);text-decoration:line-through}
.vb-row .lock{flex:none;font-size:11px;color:var(--danger)}

/* ===== 变体 C：月历全貌 + 日详情抽屉 ===== */
.vc-wrap{position:relative}
.vc-month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--border)}
.vc-dw{padding:8px 10px;font-size:11px;font-weight:700;color:var(--text-2);border-right:1px solid var(--border-subtle);background:var(--subtle)}
.vc-cell{position:relative;min-height:104px;border-right:1px solid var(--border-subtle);border-top:1px solid var(--border-subtle);padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.vc-cell:hover{background:var(--subtle)}
.vc-cell.dim{background:#fafbfc;color:var(--text-3)}
.vc-cell .num{align-self:flex-start;width:24px;height:24px;display:grid;place-items:center;font-size:12.5px;border-radius:50%}
.vc-cell.today .num{background:var(--accent);color:#fff;font-weight:700}
.vc-cell.hasOd .num{color:var(--danger);font-weight:700}
.vc-cell.today.hasOd .num{color:#fff}
.vc-bar{display:flex;align-items:center;gap:5px;width:100%;height:20px;padding:0 6px;border-radius:5px;font-size:11px;color:#fff;background:var(--kc);overflow:hidden}
.vc-bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vc-bar.done{opacity:.45;text-decoration:line-through}
.vc-bar.rst{background:var(--surface);color:var(--danger);border:1px solid var(--danger)}
.vc-drawer{position:absolute;top:0;right:0;bottom:0;width:320px;background:var(--surface);border-left:1px solid var(--border);box-shadow:-12px 0 32px -16px rgba(28,39,51,.25);display:none;flex-direction:column;z-index:20}
.vc-drawer.open{display:flex}
.vc-drawer>header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border)}
.vc-drawer>header b{font-size:15px}
.vc-drawer>header button{color:var(--text-3);font-size:18px;padding:2px 8px}
.vc-drawer .list{overflow:auto;padding:8px 12px;display:flex;flex-direction:column;gap:6px}
.vc-drawer .empty{padding:24px 16px;color:var(--text-3);font-size:12.5px;text-align:center}

/* ===== 底部变体切换条（原型工具，不属于设计） ===== */
.switcher{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:99;display:flex;align-items:center;gap:14px;background:#1c2733;color:#fff;border-radius:999px;padding:9px 18px;box-shadow:0 8px 24px rgba(0,0,0,.28);font-size:13px}
.switcher button{color:#fff;font-size:16px;padding:0 8px}
.switcher .lab{min-width:230px;text-align:center}
.switcher .lab small{opacity:.6;margin-left:6px}
</style>
</head>
<body>
<div class="shell">
  <nav class="rail"><div class="logo">阅</div><div class="ic"></div><div class="ic on"></div><div class="ic"></div><div class="ic"></div></nav>
  <div class="main">
    <div class="topbar">
      <div><h1>班主任工作台</h1><p>初二（3）班 · 王老师</p></div>
      <button class="task-center">任务中心</button>
    </div>
    <div class="tabs"><span>首页</span><span>事务案头</span><span class="on">日历</span><span>学生工作</span><span>记录</span></div>
    <div class="content" id="app"></div>
  </div>
</div>
<div class="switcher">
  <button id="prev" aria-label="上一个变体">←</button>
  <div class="lab" id="lab"></div>
  <button id="next" aria-label="下一个变体">→</button>
</div>
<script>
'use strict';
/* ===== 假数据（结构对应 WorkNode / WorkSnapshot 契约） ===== */
const TODAY = '2026-09-01';
const KIND = {
  goal:{label:'目标',c:'var(--k-goal)'}, task:{label:'任务',c:'var(--k-task)'},
  waiting:{label:'等待',c:'var(--k-waiting)'}, decision:{label:'决策',c:'var(--k-decision)'},
  collection:{label:'收缴',c:'var(--k-collection)'}, communication:{label:'沟通',c:'var(--k-communication)'},
  sop:{label:'例行',c:'var(--k-sop)'}, restricted_projection:{label:'受限',c:'var(--k-restricted)'}
};
const STATUS = {draft:'草稿',pending:'待办',in_progress:'进行中',waiting:'等待中',completed:'已完成',cancelled:'已取消'};
const NODES = [
  {id:'n01',kind:'collection',cls:'ordinary',title:'收校服费（初二3班）',status:'pending',due:'2026-08-25'},
  {id:'n02',kind:'collection',cls:'ordinary',title:'图书角借阅登记催还',status:'completed',due:'2026-08-26'},
  {id:'n03',kind:'communication',cls:'ordinary',title:'与家长沟通：张梓涵近期状态',status:'in_progress',due:'2026-08-27'},
  {id:'n04',kind:'task',cls:'ordinary',title:'班会课教案定稿',status:'completed',due:'2026-08-28'},
  {id:'n05',kind:'decision',cls:'ordinary',title:'开学家长会场地与时间确认',status:'completed',due:'2026-08-29'},
  {id:'n06',kind:'task',cls:'ordinary',title:'开学第一周值日表排定',status:'completed',due:'2026-08-31'},
  {id:'n07',kind:'task',cls:'ordinary',title:'教师节班级活动策划·方案初稿',status:'in_progress',due:'2026-08-31'},
  {id:'n08',kind:'sop',cls:'ordinary',title:'早读巡视与仪容检查',status:'in_progress',due:'2026-09-01'},
  {id:'n09',kind:'collection',cls:'ordinary',title:'收《防溺水承诺书》回执',status:'pending',due:'2026-09-01'},
  {id:'n10',kind:'decision',cls:'ordinary',title:'物理竞赛报名名单确认',status:'pending',due:'2026-09-01'},
  {id:'n11',kind:'restricted_projection',cls:'restricted_projection',title:'敏感事务 · 受限事项',status:'in_progress',due:'2026-09-01',proj:'sensitive_affair'},
  {id:'n12',kind:'task',cls:'ordinary',title:'班干部改选第一轮提名',status:'pending',due:'2026-09-02'},

  {id:'n20',kind:'task',cls:'ordinary',title:'教师节活动彩排',status:'pending',due:'2026-09-08'},
  {id:'n21',kind:'task',cls:'ordinary',title:'黑板报评比准备',status:'pending',due:'2026-09-09'},
  {id:'n22',kind:'task',cls:'ordinary',title:'贫困生资助材料初审',status:'pending',due:'2026-09-09'},

  {id:'n24',kind:'communication',cls:'ordinary',title:'月考范围与各科老师对齐',status:'pending',due:'2026-09-11'},

  {id:'n27',kind:'collection',cls:'ordinary',title:'收月考诚信承诺书',status:'pending',due:'2026-09-15'},
  {id:'n28',kind:'restricted_projection',cls:'restricted_projection',title:'学生支持 · 受限事项',status:'in_progress',due:'2026-09-16',proj:'student_support'},
  {id:'n29',kind:'goal',cls:'ordinary',title:'月考（第一天）',status:'pending',due:'2026-09-18'},
  {id:'n30',kind:'goal',cls:'ordinary',title:'月考（第二天）',status:'pending',due:'2026-09-19'},
  {id:'n31',kind:'task',cls:'ordinary',title:'月考成绩分析会',status:'pending',due:'2026-09-21'},
  {id:'n32',kind:'task',cls:'ordinary',title:'秋季研学地点比选',status:'draft',due:null},
  {id:'n33',kind:'communication',cls:'ordinary',title:'家委会换届沟通',status:'draft',due:null}
];
const EDGES = [
  {s:'n20',r:'next',t:'n23'}, {s:'n24',r:'next',t:'n26'}, {s:'n26',r:'next',t:'n27'},
  {s:'n27',r:'next',t:'n29'}, {s:'n07',r:'contains',t:'n20'}, {s:'n29',r:'next',t:'n31'}
];
const REL = {contains:'包含',depends_on:'依赖',next:'接续',review_of:'复查'};

/* ===== 工具函数 ===== */
const byId = Object.fromEntries(NODES.map(n=>[n.id,n]));
function parse(d){ const [y,m,dd]=d.split('-').map(Number); return new Date(y,m-1,dd,12); }
function iso(dt){ return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`; }
function addDays(d,n){ const dt=parse(d); dt.setDate(dt.getDate()+n); return iso(dt); }
function weekStart(d){ const dt=parse(d); dt.setDate(dt.getDate()-((dt.getDay()+6)%7)); return iso(dt); }
const WD=['周一','周二','周三','周四','周五','周六','周日'];
function wdOf(d){ return WD[(parse(d).getDay()+6)%7]; }
function mdOf(d){ return `${Number(d.slice(5,7))}月${Number(d.slice(8))}日`; }
function nodesOn(d){ return NODES.filter(n=>n.due===d); }
function isOverdue(n){ return n.due && n.due<TODAY && n.status!=='completed' && n.status!=='cancelled'; }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function chipHTML(n){
  const k=KIND[n.kind], od=isOverdue(n);
  const cls=['chip']; if(n.status==='completed')cls.push('done'); if(od)cls.push('od'); if(n.cls==='restricted_projection')cls.push('rst');
  const lock = n.cls==='restricted_projection' ? '🔒 ' : '';
  return `<button class="${cls.join(' ')}" style="--kc:${k.c}" data-node="${n.id}" title="${esc(n.title)}"><span class="t">${lock}${esc(n.title)}</span>${od?'<span class="odtag">逾期</span>':''}</button>`;
}
function stTag(n){
  if(isOverdue(n)) return '<span class="st od">逾期</span>';
  if(n.status==='completed') return '<span class="st done">已完成</span>';
  return `<span class="st">${STATUS[n.status]}</span>`;
}
function relationsOf(id){
  return EDGES.filter(e=>e.s===id||e.t===id).map(e=>{
    const a=byId[e.s], b=byId[e.t];
    return `「${esc(a.title)}」${REL[e.r]}「${esc(b.title)}」`;
  });
}
</script>
<script>
'use strict';
const app = document.getElementById('app');
const MAX_CHIPS = 3;   // 格子内最多平铺条数，超出折叠为「+N 更多」

/* ========== 变体 A：周日历 + 待办侧栏 ========== */
let weekOffset = 0, openPop = null, detailId = null;

function vaTodoGroup(title, cls, items){
  if(!items.length) return '';
  return `<div class="va-group ${cls}"><header>${title}<span class="cnt">${items.length} 项</span></header>` +
    items.map(n=>`<button class="va-item" style="--kc:${KIND[n.kind].c}" data-node="${n.id}"><i></i><span class="t">${n.cls==='restricted_projection'?'🔒 ':''}${esc(n.title)}</span>${stTag(n)}</button>`).join('') + `</div>`;
}
function vaDetail(){
  if(!detailId) return '';
  const n = byId[detailId]; if(!n) return '';
  const rels = relationsOf(n.id);
  return `<div class="va-detail"><h4>${n.cls==='restricted_projection'?'🔒 ':''}${esc(n.title)}</h4><dl>
    <dt>类型</dt><dd>${KIND[n.kind].label}</dd><dt>状态</dt><dd>${STATUS[n.status]}${isOverdue(n)?'（已逾期）':''}</dd>
    <dt>日期</dt><dd>${n.due?mdOf(n.due)+' '+wdOf(n.due):'未定日期'}</dd></dl>
    ${rels.length?`<div class="rel"><b>工作关系</b><br>${rels.join('<br>')}</div>`:'<div class="rel">与其他工作暂无已确认关系。</div>'}</div>`;
}
function renderA(){
  const start = addDays(weekStart(TODAY), weekOffset*7);
  const days = Array.from({length:7},(_,i)=>addDays(start,i));
  const overdue = NODES.filter(isOverdue);
  const today = NODES.filter(n=>n.due===TODAY && n.status!=='completed');
  const waiting = NODES.filter(n=>n.status==='waiting');
  app.innerHTML = `
  <section class="panel">
    <div class="va-head">
      <div><p class="kicker">日历与唯一工作图</p><h2>${mdOf(days[0])} – ${mdOf(days[6])}${weekOffset===0?' · 本周':''}</h2></div>
      <div class="ctl">
        <span class="navbtns"><button data-mv="-1">上一周</button><button data-mv="0">本周</button><button data-mv="1">下一周</button></span>
      </div>
    </div>
    <div class="va-body">
      <div class="va-week">
        ${days.map(d=>{
          const items = nodesOn(d), shown = items.slice(0,MAX_CHIPS), rest = items.length - shown.length;
          return `<div class="va-day ${d===TODAY?'today':''}">
            <h3><b>${wdOf(d)}</b><span>${d.slice(5).replace('-','/')}</span></h3>
            ${shown.map(chipHTML).join('')}
            ${rest>0?`<button class="more" data-pop="${d}">+${rest} 更多</button>`:''}
            ${!items.length?'<span class="empty">—</span>':''}
            ${openPop===d?`<div class="pop"><h4>${mdOf(d)} ${wdOf(d)}<button data-popclose>×</button></h4>${items.map(chipHTML).join('')}</div>`:''}
          </div>`;
        }).join('')}
      </div>
      <aside class="va-side">
        <header><strong>待办清单</strong><p>日历只看时间；要处理的事在这里</p></header>
        <div class="va-todo">
          ${vaTodoGroup('已逾期','od',overdue)}
          ${vaTodoGroup('今天要办','td',today)}
          ${vaTodoGroup('等待他人','wt',waiting)}
        </div>
        ${vaDetail()}
      </aside>
    </div>
  </section>`;
  app.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{ weekOffset+=+b.dataset.mv||weekOffset*0; if(b.dataset.mv==='0')weekOffset=0; openPop=null; renderA(); });
  app.querySelectorAll('[data-pop]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); openPop=b.dataset.pop; renderA(); });
  app.querySelectorAll('[data-popclose]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); openPop=null; renderA(); });
  app.querySelectorAll('.pop').forEach(p=>p.onclick=e=>e.stopPropagation());
  app.querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>{ detailId=b.dataset.node; renderA(); });
}

/* ========== 变体 B：日程流（列表优先） ========== */
function vbRow(n){
  return `<button class="vb-row ${n.status==='completed'?'done':''}" style="--kc:${KIND[n.kind].c}">
    <i class="dot"></i><span class="t">${esc(n.title)}</span>
    <span class="kind">${n.cls==='restricted_projection'?'<span class="lock">🔒 受限</span>':KIND[n.kind].label}</span>${stTag(n)}</button>`;
}
function vbGroup(d, items, extraCls){
  const isT = d===TODAY;
  return `<div class="vb-group ${extraCls||(isT?'today':'')}" id="d-${d}">
    <header><b>${mdOf(d)}</b><span>${wdOf(d)}${isT?' · 今天':''}</span><span class="cnt">${items.length} 项</span></header>
    ${items.map(vbRow).join('')}</div>`;
}
function renderB(){
  // 迷你月历：2026 年 9 月
  const mStart = weekStart('2026-09-01');
  const cells = Array.from({length:35},(_,i)=>addDays(mStart,i));
  const overdue = NODES.filter(isOverdue);
  const futureDates = [...new Set(NODES.filter(n=>n.due&&n.due>=TODAY).map(n=>n.due))].sort();
  const undated = NODES.filter(n=>!n.due);
  app.innerHTML = `
  <div class="vb-body">
    <aside class="vb-mini">
      <h3>2026 年 9 月 <span>点日期跳转</span></h3>
      <div class="grid">${WD.map(w=>`<span class="dw">${w.slice(1)}</span>`).join('')}
        ${cells.map(d=>{
          const its=nodesOn(d), dim=d.slice(0,7)!=='2026-09';
          return `<button class="d ${dim?'dim':''} ${d===TODAY?'today':''}" data-jump="${d}">${Number(d.slice(8))}
            ${its.length?`<span class="dots">${its.slice(0,3).map(n=>`<i style="--kc:${KIND[n.kind].c}"></i>`).join('')}</span>`:''}</button>`;
        }).join('')}
      </div>
      <p class="note">列表按时间顺序展开全部工作，不存在「格子里放不下」的问题；彩色圆点=工作类型。</p>
    </aside>
    <div class="vb-stream">
      ${overdue.length?`<div class="vb-group od"><header><b>已逾期</b><span>需要最先处理</span><span class="cnt">${overdue.length} 项</span></header>${overdue.map(vbRow).join('')}</div>`:''}
      ${futureDates.map(d=>vbGroup(d,nodesOn(d))).join('')}
      ${undated.length?`<div class="vb-group"><header><b>未定日期</b><span>草稿与待安排</span><span class="cnt">${undated.length} 项</span></header>${undated.map(vbRow).join('')}</div>`:''}
    </div>
  </div>`;
  app.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{
    const t=document.getElementById('d-'+b.dataset.jump);
    if(t) t.scrollIntoView({behavior:'smooth',block:'start'});
  });
}

/* ========== 变体 C：月历全貌 + 日详情抽屉 ========== */
let drawerDate = null;
const MAX_BARS = 2;
function renderC(){
  const mStart = weekStart('2026-09-01');
  const cells = Array.from({length:35},(_,i)=>addDays(mStart,i));
  app.innerHTML = `
  <section class="panel">
    <div class="va-head">
      <div><p class="kicker">日历与唯一工作图</p><h2>2026 年 9 月</h2></div>
      <div class="legend">${Object.values(KIND).map(k=>`<span><i style="background:${k.c}"></i>${k.label}</span>`).join('')}</div>
    </div>
    <div class="vc-wrap">
      <div class="vc-month">
        ${WD.map(w=>`<div class="vc-dw">${w}</div>`).join('')}
        ${cells.map(d=>{
          const its=nodesOn(d), dim=d.slice(0,7)!=='2026-09';
          const shown=its.slice(0,MAX_BARS), rest=its.length-shown.length;
          const hasOd=its.some(isOverdue);
          return `<div class="vc-cell ${dim?'dim':''} ${d===TODAY?'today':''} ${hasOd?'hasOd':''}" data-day="${d}">
            <span class="num">${Number(d.slice(8))}</span>
            ${shown.map(n=>{const od=isOverdue(n);
              return `<button class="vc-bar ${n.status==='completed'?'done':''} ${n.cls==='restricted_projection'?'rst':''}" style="--kc:${KIND[n.kind].c}" data-node-day="${d}" title="${esc(n.title)}"><span>${n.cls==='restricted_projection'?'🔒 ':''}${od?'⚠ ':''}${esc(n.title)}</span></button>`;}).join('')}
            ${rest>0?`<button class="more" data-node-day="${d}">+${rest} 更多</button>`:''}
          </div>`;
        }).join('')}
      </div>
      <aside class="vc-drawer ${drawerDate?'open':''}">
        ${drawerDate?`<header><b>${mdOf(drawerDate)} ${wdOf(drawerDate)}${drawerDate===TODAY?' · 今天':''}</b><button data-close>×</button></header>
        <div class="list">${nodesOn(drawerDate).length?nodesOn(drawerDate).map(chipHTML).join(''):'<p class="empty">这一天没有安排。</p>'}</div>`:''}
      </aside>
    </div>
  </section>`;
  app.querySelectorAll('[data-node-day]').forEach(b=>b.onclick=()=>{ drawerDate=b.dataset.nodeDay; renderC(); });
  app.querySelectorAll('.vc-cell').forEach(c=>c.onclick=e=>{ if(e.target.closest('[data-node-day]'))return; drawerDate=c.dataset.day; renderC(); });
  app.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{ drawerDate=null; renderC(); });
}

/* ========== 变体切换 ========== */
const VARIANTS = {
  A:{name:'周日历 + 待办侧栏',fn:renderA},
  B:{name:'日程流（列表优先）',fn:renderB},
  C:{name:'月历全貌 + 日详情抽屉',fn:renderC}
};
const KEYS = Object.keys(VARIANTS);
function current(){ const v=new URLSearchParams(location.search).get('variant'); return KEYS.includes(v)?v:'A'; }
function show(v){
  document.getElementById('lab').innerHTML = `${v} — ${VARIANTS[v].name}<small>原型 · ${KEYS.indexOf(v)+1}/${KEYS.length}</small>`;
  VARIANTS[v].fn();
}
function go(step){
  const i = (KEYS.indexOf(current())+step+KEYS.length)%KEYS.length;
  const u = new URL(location.href); u.searchParams.set('variant',KEYS[i]);
  history.replaceState(null,'',u); show(KEYS[i]);
}
document.getElementById('prev').onclick=()=>go(-1);
document.getElementById('next').onclick=()=>go(1);
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,[contenteditable]'))return;
  if(e.key==='ArrowLeft')go(-1); if(e.key==='ArrowRight')go(1);
});
show(current());
</script>
</body>
</html>
