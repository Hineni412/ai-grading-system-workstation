<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>备课工作台 · 资料库改版原型</title>
  <!-- 原型：三个布局变体，?variant= 切换，不连接真实接口。 -->
  <style>
    :root {
      --paper: #f2f5f3;
      --surface: #ffffff;
      --surface-2: #f7faf8;
      --ink: #173139;
      --muted: #64777b;
      --line: #d8e2de;
      --teal: #0c646a;
      --teal-2: #dcefed;
      --yellow: #e9b949;
      --yellow-2: #fff3cf;
      --blue: #496d89;
      --blue-2: #e7eff5;
      --red: #b94f4a;
      --red-2: #fae9e6;
      --shadow: 0 14px 36px rgba(25, 56, 61, .08);
      --radius: 14px;
      color: var(--ink);
      background: var(--paper);
      font-family: "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 960px; background: var(--paper); }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, summary:focus-visible {
      outline: 3px solid rgba(12, 100, 106, .24); outline-offset: 2px;
    }
    .utility, .eyebrow, .tag, .count, .num { font-family: Bahnschrift, "Microsoft YaHei UI", sans-serif; }
    .prototype-ribbon {
      height: 30px; display: flex; align-items: center; justify-content: center;
      background: var(--ink); color: #e8f3f1; font-size: 12px; letter-spacing: .05em;
    }
    .appbar {
      height: 68px; padding: 0 26px; background: rgba(255,255,255,.96); border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark {
      width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
      background: var(--teal); color: white; font: 800 16px Bahnschrift, sans-serif;
      box-shadow: inset 0 -3px 0 rgba(0,0,0,.12);
    }
    .brand strong { display: block; font-size: 16px; }
    .brand small { color: var(--muted); }
    main { max-width: 1240px; margin: 0 auto; padding: 24px 24px 130px; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 6px; font-size: 26px; letter-spacing: -.02em; }
    h2 { margin-bottom: 8px; font-size: 19px; }
    h3 { margin-bottom: 6px; font-size: 15px; }
    .eyebrow { color: var(--teal); font-size: 12px; letter-spacing: .12em; font-weight: 800; }
    .muted { color: var(--muted); }
    .button { border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 10px; padding: 10px 14px; font-weight: 800; }
    .button:hover { border-color: #a8bdb8; }
    .button.primary { border-color: var(--teal); background: var(--teal); color: #fff; }
    .button.soft { border-color: transparent; background: var(--teal-2); color: var(--teal); }
    .button.danger { border-color: #efc8c3; background: var(--red-2); color: var(--red); }
    .button.small { padding: 7px 10px; font-size: 12px; }
    .button:disabled { opacity: .45; cursor: default; }
    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; border-radius: 999px; background: var(--teal-2); color: var(--teal); font-size: 12px; font-weight: 800; }
    .pill.grey { background: #edf1ef; color: var(--muted); }
    .pill.warn { background: var(--yellow-2); color: #624b16; }
    .pill.bad { background: var(--red-2); color: var(--red); }
    .badge { display: inline-grid; place-items: center; min-width: 22px; padding: 2px 7px; border-radius: 999px; background: #edf1ef; color: var(--muted); font: 800 11px Bahnschrift, sans-serif; white-space: nowrap; flex: none; }
    .note { padding: 12px 14px; border-left: 4px solid var(--yellow); background: var(--yellow-2); color: #624b16; line-height: 1.6; border-radius: 0 10px 10px 0; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
    .page-head { margin: 4px 0 18px; }
    .page-head p { color: var(--muted); margin-bottom: 0; }

    /* 紧凑文件网格：所有变体共用，一行多份小项 */
    .file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
    .file-cell { border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); padding: 9px 11px; font-size: 13px; line-height: 1.45; }
    .file-cell b { display: block; font-weight: 700; }
    .file-cell small { color: var(--muted); font-family: Bahnschrift, "Microsoft YaHei UI", sans-serif; }

    /* 失败记录：统一“说人话”样式 */
    .fail-box { border: 1px solid #efc8c3; background: #fdf6f4; border-radius: 12px; padding: 13px 15px; }
    .fail-box h3 { color: var(--red); display: flex; align-items: center; gap: 8px; }
    .fail-box p { line-height: 1.65; margin-bottom: 8px; }

    /* Variant A — 顺次向导 */
    .a-steps { display: grid; gap: 14px; }
    .a-step { padding: 0; overflow: hidden; }
    .a-step__bar { display: flex; align-items: center; gap: 14px; padding: 16px 20px; }
    .a-step__no { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 800 15px Bahnschrift, sans-serif; background: #edf1ef; color: var(--muted); flex: none; }
    .a-step.done .a-step__no { background: var(--teal-2); color: var(--teal); }
    .a-step.current .a-step__no { background: var(--teal); color: #fff; }
    .a-step.current { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(12,100,106,.12), var(--shadow); }
    .a-step.future { opacity: .62; }
    .a-step__title { flex: 1; }
    .a-step__title h2 { margin: 0 0 2px; }
    .a-step__title p { margin: 0; color: var(--muted); font-size: 13px; }
    .a-step__body { border-top: 1px solid var(--line); padding: 18px 20px 20px; background: var(--surface-2); }
    .a-drawer { border: 1px solid var(--line); border-radius: 12px; background: #fff; }
    .a-drawer > summary { list-style: none; padding: 12px 15px; font-weight: 800; color: var(--teal); cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .a-drawer > summary::-webkit-details-marker { display: none; }
    .a-drawer__inner { border-top: 1px solid var(--line); padding: 12px 15px 15px; display: grid; gap: 8px; }
    .a-folder { border: 1px solid var(--line); border-radius: 10px; background: #fff; }
    .a-folder > summary { list-style: none; padding: 9px 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 700; }
    .a-folder > summary::-webkit-details-marker { display: none; }
    .a-folder .file-grid { padding: 0 12px 12px; }
    .a-suggest-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; font-size: 13px; }
    .a-two-paths { display: grid; grid-template-columns: 1.2fr 1fr; gap: 12px; margin-top: 14px; }
    .a-path { border: 1px solid var(--line); border-radius: 12px; padding: 14px 15px; background: #fff; }
    .a-path.main { border-color: var(--teal); }

    /* Variant B — 总览 + 唯一推荐动作 */
    .b-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
    .b-stat { padding: 16px 18px; }
    .b-stat .num { font: 800 34px Bahnschrift, sans-serif; color: var(--teal); }
    .b-stat .num small { font-size: 15px; color: var(--muted); font-weight: 700; }
    .b-stat p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
    .b-layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 14px; align-items: start; }
    .b-next { padding: 22px 24px; border: 2px solid var(--teal); }
    .b-next h2 { font-size: 21px; }
    .b-next .actions { display: flex; align-items: center; gap: 14px; margin-top: 16px; flex-wrap: wrap; }
    .b-ai-detail { margin-top: 14px; border-top: 1px dashed var(--line); padding-top: 14px; }
    .b-cabinet { padding: 14px; }
    .b-cabinet h2 { font-size: 16px; }
    .b-group { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; text-align: left; font-size: 13px; font-weight: 700; }
    .b-group.active { border-color: var(--teal); background: var(--teal-2); color: var(--teal); }
    .b-cabinet__detail { border-top: 1px dashed var(--line); margin-top: 6px; padding-top: 12px; }
    .b-cabinet__detail .a-folder { margin-bottom: 6px; }
    .b-todo { margin-top: 16px; padding: 16px 18px; }
    .b-todo-row { display: flex; align-items: center; gap: 14px; padding: 11px 0; border-top: 1px solid var(--line); font-size: 13px; }
    .b-todo-row:first-of-type { border-top: 0; }
    .b-todo-row p { flex: 1; margin: 0; line-height: 1.55; }

    /* Variant C — 双栏主从工作台 */
    .c-progress { display: flex; align-items: center; gap: 0; margin-bottom: 16px; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; width: fit-content; }
    .c-progress .node { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; color: var(--muted); }
    .c-progress .node .dot { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font: 800 11px Bahnschrift, sans-serif; background: #edf1ef; color: var(--muted); }
    .c-progress .node.done { color: var(--teal); }
    .c-progress .node.done .dot { background: var(--teal-2); color: var(--teal); }
    .c-progress .node.now { color: var(--ink); }
    .c-progress .node.now .dot { background: var(--teal); color: #fff; }
    .c-progress .sep { width: 34px; height: 2px; background: var(--line); margin: 0 10px; }
    .c-progress .sep.done { background: var(--teal); }
    .c-layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 14px; align-items: start; }
    .c-rail { padding: 14px; position: sticky; top: 16px; }
    .c-rail h2 { font-size: 15px; margin-bottom: 10px; }
    .c-rail__label { font: 800 11px Bahnschrift, sans-serif; letter-spacing: .1em; color: var(--muted); margin: 12px 0 6px; }
    .c-item { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px; border: 0; background: transparent; border-radius: 9px; padding: 8px 10px; text-align: left; font-size: 13px; color: var(--ink); }
    .c-item:hover { background: #eef3f1; }
    .c-item.active { background: var(--teal-2); color: var(--teal); font-weight: 800; }
    .c-item.sub { padding-left: 26px; }
    .c-item .flag { font-size: 11px; color: var(--red); font-weight: 700; }
    .c-main { padding: 20px 22px; min-height: 560px; }
    .c-main__head { display: flex; justify-content: space-between; align-items: start; gap: 14px; margin-bottom: 14px; }
    .c-main__head h2 { margin-bottom: 3px; }
    .c-tabs { display: flex; gap: 6px; padding: 5px; background: #edf2ef; border-radius: 11px; width: fit-content; margin: 14px 0; }
    .c-tabs button { border: 0; background: transparent; color: var(--muted); border-radius: 8px; padding: 9px 14px; font-weight: 800; font-size: 13px; }
    .c-tabs button.active { background: #fff; color: var(--teal); box-shadow: 0 3px 10px rgba(35,70,72,.09); }
    .c-skel { border: 1px dashed #c8a13a; background: #fffdf4; border-radius: 12px; padding: 14px 16px; }
    .c-skel-line { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 5px 0; }
    .c-skel-line.indent { padding-left: 22px; color: var(--muted); }
    .c-rail__sub { font-size: 11px; color: var(--muted); padding: 1px 10px 4px; line-height: 1.5; }
    .value-hint { font-size: 12px; color: var(--teal); background: var(--teal-2); border-radius: 9px; padding: 8px 12px; margin-bottom: 12px; line-height: 1.6; }
    .lesson-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 12px 10px; }
    .lesson-chips span { padding: 5px 9px; border-radius: 7px; background: var(--surface-2); border: 1px solid var(--line); font-size: 12px; }
    .map-list { display: grid; gap: 7px; margin: 12px 0; }
    .map-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; font-size: 13px; }
    .map-row .pages { font-family: Bahnschrift, "Microsoft YaHei UI", sans-serif; font-weight: 800; color: var(--ink); white-space: nowrap; }
    .topic-box { border: 1px dashed #b9cbc6; border-radius: 12px; padding: 13px 15px; background: #fff; margin-top: 14px; }
    .ai-reinfer { border: 1px solid var(--line); border-radius: 10px; background: #fff; margin-top: 12px; }
    .ai-reinfer > summary { list-style: none; padding: 10px 13px; cursor: pointer; font-size: 13px; font-weight: 800; color: var(--teal); display: flex; justify-content: space-between; align-items: center; }
    .ai-reinfer > summary::-webkit-details-marker { display: none; }
    .ai-reinfer > summary::after { content: '›'; font-family: Bahnschrift, sans-serif; color: var(--muted); }
    .ai-reinfer[open] > summary::after { content: '‹'; }
    .ai-reinfer .body { border-top: 1px solid var(--line); padding: 12px 13px 13px; font-size: 13px; }

    /* 变体切换条：高对比悬浮 pill，明显不属于页面 */
    .variant-switcher {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 80;
      display: flex; align-items: center; gap: 4px;
      background: #101d22; color: #eaf4f2; border: 2px solid var(--yellow);
      border-radius: 999px; padding: 8px 12px;
      box-shadow: 0 16px 40px rgba(10, 24, 28, .45);
    }
    .variant-switcher .arrow {
      width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(255,255,255,.25);
      background: transparent; color: #eaf4f2; font-size: 16px; display: grid; place-items: center;
    }
    .variant-switcher .arrow:hover { background: rgba(255,255,255,.12); }
    .variant-switcher .name { min-width: 190px; text-align: center; font-size: 13px; font-weight: 800; }
    .variant-switcher .name small { display: block; color: #9fb6ba; font-weight: 600; font-size: 11px; letter-spacing: .06em; }
    .toast {
      position: fixed; bottom: 92px; left: 50%; transform: translateX(-50%) translateY(8px);
      background: var(--ink); color: #eaf4f2; border-radius: 10px; padding: 10px 16px; font-size: 13px;
      opacity: 0; pointer-events: none; transition: .18s ease; z-index: 90;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="prototype-ribbon">原型 · 资料库页三个布局变体（A / B / C），不连接真实接口 · 底部悬浮条或 ← → 键切换</div>
  <header class="appbar">
    <div class="brand">
      <span class="brand-mark">备</span>
      <div><strong>备课工作台 · 资料库</strong><small id="semester-label"></small></div>
    </div>
    <span class="pill grey">本机资料 · 仅存于这台电脑</span>
  </header>
  <main id="app"></main>

  <nav class="variant-switcher" aria-label="切换布局变体">
    <button class="arrow" id="prev-variant" aria-label="上一个变体">‹</button>
    <div class="name"><small>布局变体（原型）</small><span id="variant-name"></span></div>
    <button class="arrow" id="next-variant" aria-label="下一个变体">›</button>
  </nav>
  <div class="toast" role="status" aria-live="polite"></div>

  <script>
    /* ============ 本地真实数据（内嵌，供三个变体共同渲染） ============ */
    const SEMESTER = '2025-2026 学年下学期 · 数学八年级（北师大版）';
    const CHAPTERS = [
      { name: '第一章 勾股定理', files: [
        ['1.1 第1课时 认识勾股定理', 26], ['1.1 第2课时 验证勾股定理', 25],
        ['1.2 一定是直角三角形吗', 27], ['1.3 勾股定理的应用', 28],
        ['专题：勾股定理与折叠问题', 22], ['问题解决策略：反思', 35],
        ['第一章 小结与复习', 24], ['第一章 章末检测讲评', 20]]},
      { name: '第二章 实数', files: [
        ['2.1 认识无理数', 24], ['2.2 平方根 第1课时', 26], ['2.2 平方根 第2课时', 25],
        ['2.3 立方根', 24], ['2.4 估算', 22], ['2.5 用计算器开方', 20],
        ['2.6 实数', 28], ['2.7 二次根式 第1课时', 26], ['2.7 二次根式 第2课时', 25]]},
      { name: '第三章 位置与坐标', files: [
        ['3.1 确定位置', 24], ['3.2 平面直角坐标系 第1课时', 26], ['3.2 平面直角坐标系 第2课时', 25],
        ['3.3 轴对称与坐标变化', 24], ['第三章 小结与复习', 22], ['第三章 章末检测讲评', 20]]},
      { name: '第四章 一次函数', files: [
        ['4.1 函数', 26], ['4.2 一次函数与正比例函数', 26],
        ['4.3 一次函数的图象 第1课时', 25], ['4.3 一次函数的图象 第2课时', 24],
        ['4.4 一次函数的应用 第1课时', 27], ['4.4 一次函数的应用 第2课时', 26],
        ['4.4 一次函数的应用 第3课时', 24], ['第四章 小结与复习', 24], ['第四章 章末检测讲评', 20]]},
      { name: '第五章 二元一次方程组', files: [
        ['5.1 认识二元一次方程组', 24], ['5.2 求解二元一次方程组 第1课时', 26], ['5.2 求解二元一次方程组 第2课时', 25],
        ['5.3 应用二元一次方程组——鸡兔同笼', 24], ['5.4 应用二元一次方程组——增收节支', 24],
        ['5.5 应用二元一次方程组——里程碑上的数', 23], ['5.6 二元一次方程与一次函数', 26],
        ['5.7 用二元一次方程组确定一次函数表达式', 24], ['第五章 小结与复习', 22]]},
      { name: '第六章 数据的分析', files: [
        ['6.1 平均数 第1课时', 24], ['6.1 平均数 第2课时', 22],
        ['6.2 中位数与众数', 24], ['6.3 从统计图分析数据的集中趋势', 24],
        ['6.4 数据的离散程度 第1课时', 24], ['6.4 数据的离散程度 第2课时', 22],
        ['第六章 小结与复习', 22]]},
      { name: '第七章 平行线的证明', files: [
        ['7.1 为什么要证明', 22], ['7.2 第1课时 定义与命题', 24], ['7.2 第2课时 定理与证明', 24],
        ['7.3 第1课时 平行的判定', 25], ['7.3 第2课时 平行线的性质', 25],
        ['7.5 三角形内角和定理', 26], ['专题：平行线中的拐点问题', 22], ['第七章 小结与复习', 24]]},
    ];
    const TEXTBOOK = { name: '（根据2022年版课程标准修订）义务教育教科书·数学八年级上册', pages: 212 };
    const WORKBOOK = { name: '五年中考三年模拟·八年级上册数学' };
    /* 待确认的课时树建议：由 56 份 PPT 文件名推断生成（无需模型） */
    const SUGGESTION = [
      ['第一章 勾股定理', 6], ['第二章 实数', 7], ['第三章 位置与坐标', 4],
      ['第四章 一次函数', 7], ['第五章 二元一次方程组', 7], ['第六章 数据的分析', 5], ['第七章 平行线的证明', 4],
    ];
    const SUGGEST_TOTAL = SUGGESTION.reduce((s, r) => s + r[1], 0);
    const FAIL_REASON = '学期里还没有可映射的课时，AI 无法把教材页码挂到课时上。建议：先确认下方的课时树建议，或让 AI 从头建一棵。';
    const AI_SEND_NOTE = '会发送：教材的目录与页码结构（212 页）+ 当前学期信息；会得到：一棵按教材编排的课时树草稿，由您逐章确认后才生效。本次为单次调用、按次计费，发送前需要您确认。';

    /* ===== Variant C 新模型数据：课件“确定”课时树，教材教辅“对应”页码 ===== */
    /* 课时树唯一主干：由 7 个章文件夹与课件命名直接确定（无需 AI），逐章确认即生效 */
    const TREE = [
      ['第一章 勾股定理', ['1.1 第1课时 认识勾股定理', '1.1 第2课时 验证勾股定理', '1.2 一定是直角三角形吗', '1.3 勾股定理的应用', '专题：勾股定理与折叠问题', '问题解决策略：反思']],

          <div class="topic-box">
            <h3 style="margin-bottom:4px">专题补充</h3>
            <p class="muted" style="font-size:12px;line-height:1.6;margin-bottom:10px">对不上具体课时的专题不塞进课时树，备课时作为补充材料检索。</p>
            <div class="map-list" style="margin:0">
            ${WORKBOOK_TOPICS.map(([label, pages]) => `
              <div class="map-row"><span>${esc(label)}</span>
              <span style="display:flex;align-items:center;gap:10px"><span class="pages">${pages}</span>
              <span class="pill grey" style="font-size:11px">专题补充</span></span></div>`).join('')}
            </div>
          </div>`;
      }

      return `
      <div class="page-head"><span class="eyebrow">变体 C · 双栏主从工作台</span>
        <h1>左边选资料，右边看内容和下一步</h1>
        <p>课件确定课时树，教材教辅对应页码；资料明细只显示当前选中的那一组。</p></div>
      <div class="c-progress">
        <span class="node done"><span class="dot">✓</span>导入资料</span><span class="sep done"></span>
        <span class="node done"><span class="dot">✓</span>本机处理</span><span class="sep done"></span>
        <span class="node now"><span class="dot">3</span>确认课时树 · 由课件推断，待确认</span><span class="sep"></span>
        <span class="node"><span class="dot">4</span>对应教材/教辅</span><span class="sep"></span>
        <span class="node"><span class="dot">5</span>可备课</span>
      </div>
      <div class="c-layout">
        <aside class="c-rail card"><h2>资料柜</h2>${rail}</aside>
        <section class="c-main card">${main}</section>
      </div>`;
    }

    /* ============ 变体切换 ============ */
    const VARIANTS = [
      ['A', 'A · 顺次向导'],
      ['B', 'B · 总览 + 推荐动作'],
      ['C', 'C · 双栏工作台'],
    ];
    const params = new URLSearchParams(location.search);
    let current = VARIANTS.findIndex(v => v[0] === (params.get('variant') || '').toUpperCase());
    if (current < 0) current = 0;

    const app = document.getElementById('app');
    document.getElementById('semester-label').textContent = SEMESTER;

    function render() {
      const key = VARIANTS[current][0];
      app.innerHTML = key === 'A' ? renderA() : key === 'B' ? renderB() : renderC();
      document.getElementById('variant-name').textContent = VARIANTS[current][1];
      const url = new URL(location.href);
      url.searchParams.set('variant', key);
      history.replaceState({}, '', url);
    }
    function switchVariant(delta) {
      current = (current + delta + VARIANTS.length) % VARIANTS.length;
      render();
    }
    document.getElementById('prev-variant').addEventListener('click', () => switchVariant(-1));
    document.getElementById('next-variant').addEventListener('click', () => switchVariant(1));
    document.addEventListener('keydown', event => {
      const t = event.target;
      if (['INPUT', 'TEXTAREA', 'SELECT'].includes(t.tagName) || t.isContentEditable) return;
      if (event.key === 'ArrowLeft') { switchVariant(-1); }
      if (event.key === 'ArrowRight') { switchVariant(1); }
    });

    /* ============ 交互（全部为原型演示，不调用真实接口） ============ */
    const toast = document.querySelector('.toast');
    let toastTimer;
    function notify(msg) {
      toast.textContent = msg; toast.classList.add('show');
      clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
    }
    app.addEventListener('click', event => {
      const demo = event.target.closest('[data-demo]');
      if (demo) { notify(`原型演示：${demo.dataset.demo}（正式版此处才执行）`); return; }
      const toggle = event.target.closest('[data-toggle-ai]');
      if (toggle) {
        const panel = document.getElementById('b-ai-detail');
        panel.hidden = !panel.hidden;
        toggle.textContent = panel.hidden ? '改让 AI 用教材整理 ›' : '收起 AI 说明 ‹';
        return;
      }
      const bg = event.target.closest('[data-b-group]');
      if (bg) { bGroup = bg.dataset.bGroup; render(); return; }
      const ci = event.target.closest('[data-c-kind]');
      if (ci) { cSel = { kind: ci.dataset.cKind, index: Number(ci.dataset.cIndex || 0) }; render(); return; }
    });

    render();
  </script>
</body>
</html>
